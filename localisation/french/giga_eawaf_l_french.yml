 mod_damage_vs_country_type_giga_eawaf_sirens_mult:0 "Dégâts contre Sirenalia"
 giga_eawaf_outer_strife_field_modifier:0 "Influence du Champ de Discorde Extérieur"
 giga_eawaf_outer_strife_field_modifier_desc:0 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§W§PLa Discorde§! est générée selon la formule suivante lorsque la §YStabilité§! est inférieure à 90 :§!\n(§Y80 - Stabilité§!) x (§YPopulation Planétaire§!) x (§Y1§! + §YPourcentage de Criminalité§!)\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont multipliées par le niveau de §MPuissance§! de l’Enthraller.\n\n§LLe Champ de Discorde Extérieur influence les habitants de ce monde, les poussant vers la haine et transformant cette haine en §PDiscorde§! pour alimenter l’Enthraller Shroudsonique de Sirenalia. Construire des bâtiments spécifiques peut aider à réduire ou même annuler cet effet.§!"
 giga_eawaf_outer_strife_field_modifier_halved:0 "Influence du Champ de Discorde Extérieur"
 giga_eawaf_outer_strife_field_modifier_halved_desc:0 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§W§PLa Discorde§! est générée selon la formule suivante lorsque la §YStabilité§! est inférieure à 90 :§!\n(§Y80 - Stabilité§!) x (§YPopulation Planétaire§!) x (§Y1§! + §YPourcentage de Criminalité§!)\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont multipliées par le niveau de §MPuissance§! de l’Enthraller.\nLes effets sont §Yréduits de moitié§! grâce à un §YChamp de Désenchantement Prototypique§!.\n\n§LLe Champ de Discorde Extérieur influence les habitants de ce monde, les poussant vers la haine et transformant cette haine en §PDiscorde§! pour alimenter l’Enthraller Shroudsonique de Sirenalia. Construire des bâtiments spécifiques peut aider à réduire ou même annuler cet effet.§!"
 giga_eawaf_outer_strife_field_modifier_quartered:0 "Influence du Champ de Discorde Extérieur"
 giga_eawaf_outer_strife_field_modifier_quartered_desc:0 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§W§PLa Discorde§! est générée selon la formule suivante lorsque la §YStabilité§! est inférieure à 90 :§!\n(§Y80 - Stabilité§!) x (§YPopulation Planétaire§!) x (§Y1§! + §YPourcentage de Criminalité§!)\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont multipliées par le niveau de §MPuissance§! de l’Enthraller.\nLes effets sont §Yréduits à un quart§! grâce à un §YChamp de Désenchantement Harmonisé§!.\n\n§LLe Champ de Discorde Extérieur influence les habitants de ce monde, les poussant vers la haine et transformant cette haine en §PDiscorde§! pour alimenter l’Enthraller Shroudsonique de Sirenalia. Construire des bâtiments spécifiques peut aider à réduire ou même annuler cet effet.§!"
 giga_sirens_spawnlater:0 "Faire apparaître les Sirènes §Gplus tard§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date de spawn sélectionnée. Si défini sur §YGaranti§!, elles apparaîtront à la date exacte."
 giga_sirens_spawnearlier:0 "Faire apparaître les Sirènes §Rplus tôt§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date de spawn sélectionnée. Si défini sur §YGaranti§!, elles apparaîtront à la date exacte."
 giga_sirens_randomgame:0 "Date d’apparition de Sirenalia : §LAu hasard§!\nSirenalia apparaîtra à un moment aléatoire. La situation §YLa Prise de Contrôle des Sirènes§! se déclenchera après §Y25 ans§! et le §YSuaire Éthéré§! se dissipera après un temps aléatoire.\n$sirens_spawn_warning$"
 giga_sirens_lateendgame:0 "Date d’apparition de Sirenalia : §E2500§!\nSirenalia peut apparaître après §Y2500§!. La situation §YLa Prise de Contrôle des Sirènes§! se déclenchera après §Y25 ans§! et le §YSuaire Éthéré§! durera jusqu’en 2500.\n$sirens_spawn_warning$"
 giga_sirens_regularendgame:0 "Date d’apparition de Sirenalia : §G2450§!\nSirenalia peut apparaître après §Y2450§!. La situation §YLa Prise de Contrôle des Sirènes§! se déclenchera après §Y25 ans§! et le §YSuaire Éthéré§! durera jusqu’en 2450.\n$sirens_spawn_warning$"
 giga_sirens_endgame:0 "Date d’apparition de Sirenalia : §Y2400§! (Par défaut)\nSirenalia peut apparaître après §Y2400§!. La situation §YLa Prise de Contrôle des Sirènes§! se déclenchera après §Y25 ans§! et le §YSuaire Éthéré§! durera jusqu’en 2400.\n$sirens_spawn_warning$"
 giga_sirens_latemidgame:0 "Date d’apparition de Sirenalia : §H2350§!\nSirenalia peut apparaître après §Y2350§!. La situation §YLa Prise de Contrôle des Sirènes§! se déclenchera après §Y25 ans§! et le §YSuaire Éthéré§! durera jusqu’en 2350.\n$sirens_spawn_warning$"
 giga_sirens_midgame:0 "Date d’apparition de Sirenalia : §S2300§!\nSirenalia peut apparaître après §Y2300§!. La situation §YPrise de contrôle des Sirènes§! surviendra après §Y25 ans§! et le §YSuaire éthéré§! persistera jusqu’en 2300.\n$sirens_spawn_warning$"
 giga_sirens_lateearlygame:0 "Date d’apparition de Sirenalia : §P2250§!\nSirenalia peut apparaître vers §Y2250§!. La situation §YPrise de contrôle des Sirènes§! surviendra après §Y25 ans§! et le §YSuaire éthéré§! persistera jusqu’en 2250.\n$sirens_spawn_warning$"
 giga_sirens_earlygame:0 "Date d’apparition de Sirenalia : §RDébut de partie§!\nSirenalia peut apparaître près du §Ydébut de partie§!. La situation §YPrise de contrôle des Sirènes§! commencera immédiatement et le §YSuaire éthéré§! se dissipera en moins d’un an.\n$sirens_spawn_warning$"
 sirens_spawn_warning:0 "\n§YSélectionnez §GGaranti§! si vous voulez assurer l’apparition de Sirenalia.§!\n\n§GCliquez pour modifier la date d’apparition de Sirenalia§!"
 giga_eawaf_sirens_guaranteed:0 "Les §YSirènes§! réussiront §Gtoujours§! à prendre le contrôle de §YFaust§! et deviendront une crise, sauf intervention du joueur."
 giga_sirens_not_guaranteed:0 "Les §YSirènes§! ont environ §Y50%§! de chances de prendre le contrôle de §YFaust§! et de devenir une crise, sauf intervention du joueur."
 giga_eawaf_sirens_disabled:0 "Les §YSirènes§! ne tenteront pas de prendre le contrôle de §YFaust§!. Cependant, le système peut encore apparaître avec des primitives personnalisées si cette option n’est pas désactivée.\n\n§BLa crise §YSirenalia§! a été créée dans le cadre du §YPoisson d’Avril 2024§! en collaboration avec l’équipe de §YEquestria at War§!, qui a ajouté un chemin §YKaiser Kattail§! à leur propre mod.§!"
 giga_sirens_enabled:0 "Les §YSirènes§! tenteront de prendre le contrôle de §YFaust§! et deviendront éventuellement §RSirenalia§!. Elles chercheront à §Rcontrôler mentalement§! toute la galaxie grâce à leur chant envoûtant !\n\n§BLa crise §YSirenalia§! a été créée dans le cadre du §YPoisson d’Avril 2024§! en collaboration avec l’équipe de §YEquestria at War§!, qui a ajouté un chemin §YKaiser Kattail§! à leur propre mod.§!"
 giga_eawaf_sirens_easy:0 "Sirenalia (§BLargo§!)\nSirenalia sera §Baffaiblie§!.\n\nLe §Mpotentiel§! commencera à §Y0,5§! tandis que chaque niveau du §YShroudsonic Enthraller§! l’augmentera de §Y0,25§!."
 giga_eawaf_sirens_normal:0 "Sirenalia (§GLento§!)\nSirenalia sera §Gnormale§!.\n\nLe §Mpotentiel§! commencera à §Y1§! tandis que chaque niveau du §YShroudsonic Enthraller§! l’augmentera de §Y0,5§!."
 giga_eawaf_sirens_hard:0 "Sirenalia (§YModerato§!)\nSirenalia sera §Yrenforcée§!.\n\nLe §Mpotentiel§! commencera à §Y5§! tandis que chaque niveau du §YShroudsonic Enthraller§! l’augmentera de §Y2§!."
 giga_eawaf_sirens_veryhard:0 "Sirenalia (§HAllegro§!)\nSirenalia sera §Htrès renforcée§!.\n\nLe §Mpotentiel§! commencera à §Y10§! tandis que chaque niveau du §YShroudsonic Enthraller§! l’augmentera de §Y5§!."
 giga_eawaf_sirens_extreme:0 "Sirenalia (§RVivace§!)\nSirenalia sera §Rextrêmement renforcée§!.\n\nLe §Mpotentiel§! commencera à §Y25§! tandis que chaque niveau du §YShroudsonic Enthraller§! l’augmentera de §Y10§!."
 giga_eawaf_sirens_impossible:0 "Sirenalia (§PPresto§!)\nSirenalia sera §Pimplacablement renforcée§!.\n\nLe §Mpotentiel§! commencera à §Y50§! tandis que chaque niveau du §YShroudsonic Enthraller§! l’augmentera de §Y25§!."
 giga_eawaf_sirens_abyss:0 "Sirenalia (§gAbyssal§!)\n§RALORS QUE LE CYCLE SE DÉCHIRE ET QUE LES MURS DE LA RÉALITÉ S’EFFACENT, DES PROFONDEURS DE L’EXISTENCE ÉMERGE UNE FORCE INCOMPRÉHENSIBLE.§!\n\nLe §Mpotentiel§! commencera à §Y1000§! tandis que chaque niveau du §YShroudsonic Enthraller§! l’augmentera de §Y500§!.\n\n§RTOUTES§! les factions pourront être envoûtées par les Sirènes."
 d_everfree_forest:0 "Forêt Everfree"
 d_everfree_forest_desc:0 "Une forêt mystérieuse et presque impénétrable, imprégnée d’énergies apparemment magiques. La raser serait une tâche colossale, mais son étude approfondie pourrait fournir des données fascinantes."
 giga_eawaf.7002.name:0 "Faust entre dans l’Ère Atomique"
 giga_eawaf.7002.desc:0 "Des rapports indiquent que les primitifs habitant le monde continental particulier de §YFaust§! dans le système §Y[giga_eawaf_system.GetName]§! ont réussi à construire et tester un dispositif nucléaire à faible rendement. Bien que ces armes restent rares et coûteuses pour l’instant, elles devraient se proliférer exponentiellement à mesure que la technologie se perfectionne et se diffuse parmi les différentes nations de la planète. Fait intéressant, au lieu de s’appuyer sur une fission nucléaire conventionnelle à base d’uranium, ces armes exploitent les énergies contenues dans les abondants gisements de cristaux de la planète pour libérer une puissance destructrice phénoménale. Notre Poste d’Observation les a nommées §Ydispositifs thaumonucléaires§!. Désormais, tout conflit à grande échelle sur cette planète risque d’être bien plus dévastateur que jamais auparavant."
 giga_eawaf.7002.a:0 "Intriguant."
 giga_eawaf.7004.name:0 "Faust sombre dans une guerre thaumonucléaire"
 giga_eawaf.7004.desc:0 "Notre Poste d’Observation de §YFaust§! rapporte qu’en raison de tensions extrêmes sur la scène géopolitique de la planète, un incident apparemment mineur impliquant un bateau de pêche entre deux grandes puissances a dégénéré en un conflit global opposant les trois continents principaux de Faust. Malheureusement, les armes thaumonucléaires s’étaient déjà largement répandues et la plupart des grandes nations disposaient d’arsenaux considérables. Le conflit s’est rapidement transformé en un événement d’extinction, alors que les alliances supranationales adverses ont commencé à se bombarder mutuellement de projectiles thaumonucléaires. En quelques jours, la surface de la planète s’est entièrement embrasée sous les énergies cataclysmiques libérées par ces armes, transformant ce monde autrefois verdoyant en une tempête déchaînée d’énergies quasi-magiques. Les scans orbitaux indiquent qu’à l’exception d’une jungle curieusement résistante qui semble prospérer grâce aux énergies thaumonucléaires, toute civilisation primitive a été anéantie."
 giga_eawaf.7004.a:0 "Une fin aussi violente… Malheureux destin."
 giga_eawaf.7006.name:0 "Faust entre dans l’ère spatiale"
 giga_eawaf.7006.desc:0 "Les primitifs de §YFaust§! ont franchi une nouvelle étape cruciale dans leur évolution sociétale avec le développement de leurs premiers vaisseaux spatiaux capables de voyages interplanétaires. Alimentées par des formes liquides des cristaux abondants de la planète, plusieurs de ces sondes ont été envoyées explorer leur système stellaire, marquant le début de véritables études sur la nature singulière de leur système. Grâce au perfectionnement de leurs télescopes à lentilles cristallines, il est probable que ces primitifs aient réalisé que l’astrographie de leur monde est véritablement unique en son genre, en comparaison avec des exoplanètes 'standards'. Les tensions mondiales commencent à s’apaiser, plusieurs grandes puissances prenant des mesures concrètes en faveur de la coopération internationale. Reste à voir si ces efforts aboutiront à un âge d’or spatial ou à un désastre cataclysmique. Quoi qu’il en soit, il ne faudra plus longtemps avant que ces êtres particuliers ne rejoignent la communauté interstellaire."
 giga_eawaf.7006.a:0 "Intéressant."
 giga_eawaf.7012.name:0 "§YGrand Convocation Faustienne§! atteint la FTL"
 giga_eawaf.7011.desc.eawun:0 "Notre Poste d’Observation de §YFaust§! indique que les primitifs de la planète ont, au moins, conçu un moteur supraluminique fonctionnel. Comme une grande partie de leur technologie, il repose sur l’utilisation extensive des cristaux abondants de la planète, rendant leur fabrication étonnamment bon marché en raison de la quantité colossale de cristaux disponibles dans leur système stellaire. La planète s’est unifiée sous une entité supranationale connue sous le nom de §YGrand Convocation Faustienne§!, née de la fédération de plusieurs des gouvernements démocratiques majeurs de la planète. Bien que ces gouvernements existent encore dans une certaine mesure, la Convocation a effectivement assumé le rôle d’autorité interstellaire de Faust et sera responsable de guider l’expansion de leur civilisation à travers les étoiles. Compte tenu des immenses différences culturelles et physiques entre les différentes espèces de la planète, la fédéralisation pacifique de Faust en un seul gouvernement est considérée comme un exploit stupéfiant, aussi bien par l’équipage de notre Poste d’Observation que par la majorité des habitants de la planète. Cependant, comme nous contrôlons la station stellaire du système, nous avons reçu une transmission de leur dirigeant, §YJungle Trek III§!, demandant le transfert de propriété de la station afin que les habitants de Faust puissent enfin entreprendre leur voyage interplanétaire."
 giga_eawaf.7013.name:0 "§YEmpire Griffonien§! atteint la FTL"
 giga_eawaf.7011.desc.eawgriffon:0 "Notre §YPoste d’observation de Faust§! indique que les primitifs de cette planète ont enfin conçu un moteur FTL fonctionnel. Comme pour la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux abondants et particuliers de leur monde, ce qui rend sa production étonnamment peu coûteuse.\n\nLa planète a été unifiée par la guerre et la diplomatie sous le règne d’une nation impérialiste connue sous le nom d’§YEmpire Griffonien§!. Par conquête militaire ou domination économique, il a assujetti la majorité des anciens États-nations.\n\nBien que certains résidents n’acceptent pas cet ordre, il n’existe plus de puissance étrangère capable de s’opposer à l’Empire Griffonien, scellant ainsi le destin de Faust.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur dirigeant, §YGrover XI§! de la §YDynastie Grover§!, demandant que nous leur transférions le contrôle de la base stellaire afin que l’Empire Griffonien soit reconnu comme une nation galactique indépendante."
 giga_eawaf.7014.name:0 "§YRépublique socialiste de Faust§! atteint le vol FTL"
 giga_eawaf.7011.desc.eawcommunist:0 "Notre §YPoste d’observation de Faust§! indique que les primitifs de cette planète ont enfin conçu un moteur FTL fonctionnel. Comme pour la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux abondants et particuliers de leur monde, ce qui rend sa production étonnamment peu coûteuse.\n\nLa planète a été relativement pacifiquement unifiée sous la bannière de la §YRépublique socialiste de Faust§!. Par le biais d’alliances stratégiques et de quelques guerres majeures, ce gouvernement socialiste a consolidé son emprise sur la quasi-totalité des nations de Faust.\n\nBien que quelques États subsistent, ils sont bien trop insignifiants pour contester l’hégémonie de la République socialiste, qui promet égalité et prospérité à toutes les créatures, quelle que soit leur espèce ou leur origine.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission d’un représentant de leur Conseil suprême, demandant que nous leur transférions le contrôle de la base."
 giga_eawaf.70141.name:0 "§YFédération Faustienne§! atteint le vol FTL"
 giga_eawaf.70141.desc:0 "Notre §YPoste d’Observation de Faust§! indique que les primitifs de cette planète ont, au moins, conçu un moteur FTL fonctionnel. Comme la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux particuliers et abondants de leur monde, ce qui les rend étonnamment peu coûteux à produire, étant donné la quantité disponible dans leur système d’origine.\n\nLa planète a été unifiée sous la direction de la §YFédération Faustienne§!, un gouvernement harmoniste qui a vu le jour dans les régions orientales du continent griffonien.\n\nÀ l’origine simple alliance militaire et économique connue sous le nom de §YFédération du Fleuve§!, elle s’est progressivement transformée en un super-État qui, par la diplomatie et des croisades occasionnelles contre les régimes autoritaires comme l’Empire Griffonien voisin, a fini par s’imposer comme l’unique hyperpuissance de la planète.\n\nIls nous contactent à présent afin de négocier la cession du système."
 giga_eawaf.70142.name:0 "§YGrand Empire d’Aquileia-Wingbardy§! atteint le vol FTL"
 giga_eawaf.70142.desc:0 "Notre §YPoste d’Observation de Faust§! indique que les primitifs de cette planète ont, au moins, conçu un moteur FTL fonctionnel. Comme la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux particuliers et abondants de leur monde, ce qui les rend étonnamment peu coûteux à produire, étant donné la quantité disponible dans leur système d’origine.\n\nLa planète a été unifiée sous la direction de §YAquileia-Wingbardy§!, un empire né de la fusion de deux des plus grandes nations de Griffonia, qui, grâce à son ascension en tant que superpuissance continentale puis hyperpuissance planétaire, a pris le contrôle de son continent ainsi que de nombreuses colonies et entreprises économiques et militaires à l’étranger.\n\nÉtant donné que nous contrôlons la base stellaire du système, nous avons reçu une transmission de leur impératrice demandant la cession du système en échange de ressources."
 giga_eawaf.70143.name:0 "§YCorporation Faustienne§! atteint le vol FTL"
 giga_eawaf.70143.desc:0 "Notre §YPoste d’Observation de Faust§! indique que les primitifs de cette planète ont, au moins, conçu un moteur FTL fonctionnel. Comme la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux particuliers et abondants de leur monde, ce qui les rend étonnamment peu coûteux à produire, étant donné la quantité disponible dans leur système d’origine.\n\nLa planète a été unifiée principalement grâce à la puissance économique écrasante de §YKiria§!, une nation qui, après une industrialisation rapide et une transition vers un régime capitaliste intensif, a fini par dominer l’économie planétaire, devenant ainsi l’unique superpuissance à travers l’absorption économique de nombreuses autres nations.\n\nComme nous contrôlons la base stellaire du système, nous avons reçu une transmission de leur directeur, qui cherche probablement à acheter le système."
 giga_eawaf.70144.name:0 "§YRévolutionnaire Faust§! atteint le vol FTL"
 giga_eawaf.70144.desc:0 "Notre §YPoste d’Observation de Faust§! indique que les primitifs de cette planète ont, au moins, conçu un moteur FTL fonctionnel. Comme la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux particuliers et abondants de leur monde, ce qui les rend étonnamment peu coûteux à produire, étant donné la quantité disponible dans leur système d’origine.\n\nLa planète a été unifiée sous le gouvernement d’une nation originaire de l’île de §YHippogriffia§!, qui, après une prise de pouvoir communiste, a entamé une campagne d’expansion rapide culminant en une grande croisade contre tous les régimes autoritaires de la planète.\n\nGrâce à une utilisation intensive de l’énergie nucléaire et à des politiques hautement matérialistes, cette nation en pleine ascension a réussi à s’imposer et à unifier la majeure partie de Faust sous son contrôle, les derniers États restants se ralliant relativement facilement par la suite.\n\nAprès un immense investissement dans l’exploration spatiale et le développement accéléré d’un moteur FTL, ce monde nouvellement unifié s’est tourné vers les étoiles et nous envoie maintenant une transmission enthousiaste pour établir des relations diplomatiques."
 giga_eawaf.70145.name:0 "§YFléau Funeste§! atteint le vol FTL"
 giga_eawaf.70145.desc:0 "Notre §YPoste d’Observation de Faust§! indique que les primitifs de cette planète ont, au moins, conçu un moteur FTL fonctionnel. Comme la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux particuliers et abondants de leur monde, ce qui les rend étonnamment peu coûteux à produire, étant donné la quantité disponible dans leur système d’origine.\n\nLa planète a été unifiée sous une sorte d’'esprit de ruche' terrifiant composé d’êtres réanimés, qui a mené une grande 'Croisade Noire' contre toutes les créatures vivantes et les écosystèmes de Faust.\n\nBien que son succès ait d'abord été incertain, le simple nombre d’entités constituant cet esprit de ruche ainsi que sa capacité à ranimer à la fois ses propres morts et ceux de ses ennemis lui ont permis d’émerger victorieux, finissant par assimiler la totalité de Faust.\n\nDe manière alarmante, cet esprit de ruche, connu sous le nom de 'Fléau Funeste', semble totalement réfractaire à toute tentative de diplomatie et a lancé une attaque à grande échelle sur notre base stellaire en utilisant des vaisseaux FTL de fortune. Nous devons agir rapidement et éradiquer cette menace avant qu’elle ne consume toute la galaxie !"
 giga_eawaf.70146.name:0 "§YDirectoire Faustien§! atteint le vol FTL"
 giga_eawaf.70146.desc:0 "Notre §YPoste d’Observation de Faust§! indique que les primitifs de cette planète ont, au moins, conçu un moteur FTL fonctionnel. Comme la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux particuliers et abondants de leur monde, ce qui les rend étonnamment peu coûteux à produire, étant donné la quantité disponible dans leur système d’origine.\n\nLe monde a été entièrement unifié sous la direction d’une sorte de divinité mécanique répondant au nom de §YLeopold Schmeller§!, qui semble avoir été autrefois un simple Griffon ayant subi d’importantes améliorations cybernétiques avant de finalement transcender son corps pour devenir une gigantesque entité mécanique.\n\nDepuis, il a mené une immense croisade contre le reste du monde, libérant d’énormes armées d’automates avancés pour anéantir toute opposition et intégrer la population organique de Faust dans sa conscience machine en pleine expansion.\n\nComme nous contrôlons la base stellaire du système, Leopold nous a contactés afin de négocier l'achat de Faust."
 giga_eawaf.70147.name:0 "§YEmpire Katzenartig§! atteint le vol FTL"
 giga_eawaf.70147.desc:0 "Notre §YPoste d’Observation de Faust§! indique que les primitifs de cette planète ont, au moins, conçu un moteur FTL fonctionnel. Comme la plupart de leurs technologies, il repose largement sur l’utilisation des cristaux particuliers et abondants de leur monde, ce qui les rend étonnamment peu coûteux à produire, étant donné la quantité disponible dans leur système d’origine.\n\nLe monde a été entièrement unifié sous la direction du singulier §YKaiser Kattail§!, apparu dans la nation abyssinienne de §YAbyssinia§!. Malgré l’état misérable de cette nation, il a réussi à orchestrer une série de conquêtes spectaculaires, culminant en une guerre totale contre l’ensemble de Faust.\n\nContre toute attente, Kattail est sorti victorieux et a consolidé son emprise sur toute la planète, initiant même un projet de méga-ingénierie sur la lune de Faust, §YSéléné§!.\n\nComme nous contrôlons la base stellaire du système, il nous a contactés afin de négocier l'achat du système."
 giga_eawaf.7011.a:0 "À l’écran."
 giga_eawaf.7015.name:0 "Le [giga_eawaf_country.GetName]"
 giga_eawaf.7015.desc.eawun:0 "Salutations, voyageurs des étoiles. La Grande Convocation Faustienne a enfin acquis la technologie nécessaire pour voguer à travers l’espace.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. Par conséquent, notre grand conseil a décidé d’offrir une compensation financière de §Y7500§! £energy£, issue de nos plus grands réacteurs cristallins, en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!."
 giga_eawaf.7015.desc.eawgriffon:0 "Salutations, êtres extrafaustiens. L’Empire Griffonien a enfin maîtrisé les lois de la physique, nous permettant de traverser les vastes étendues interstellaires.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. Par conséquent, moi, Kaiser §YGrover XI§!, exige que vous transfériez le système sous notre contrôle, car nous l’habitons depuis bien plus longtemps que vous.\n\nC’est un droit légitime."
 giga_eawaf.7015.desc.eawcommunist:0 "Salutations, voyageurs des étoiles. Les plus brillants esprits de la République Socialiste de Faust ont conçu un grand dispositif capable d’atteindre d’autres étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. Par conséquent, notre conseil suprême a décidé d’offrir une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!.\n\nNous espérons que vous ne nous décevrez pas."
 giga_eawaf.7015.desc.riverun:0 "Salutations, voyageurs des étoiles. La Fédération Faustienne a enfin acquis la technologie nécessaire pour voguer à travers l’espace.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. Par conséquent, nous avons décidé d’offrir une compensation financière de §Y7500§! £energy£, issue de nos plus grands réacteurs cristallins, en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!."
 giga_eawaf.7015.desc.jerwng:0 "Salutations, êtres extrafaustiens. Grâce aux efforts conjoints de Wingbardy et d’Aquileia, notre espèce a enfin maîtrisé les lois de la physique, nous permettant de traverser les vastes étendues interstellaires.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. Par conséquent, moi, l’Impératrice §YAlessandra Discret§!, exige que vous transfériez le système sous notre contrôle, car nous l’habitons depuis bien plus longtemps que vous.\n\nC’est un droit légitime."
 giga_eawaf.7015.desc.kiria:0 "Salutations, partenaires commerciaux extrafaustiens ! Étant donné que nous avons percé les secrets du voyage FTL comme vous, nous aimerions vous proposer un marché ! Que diriez-vous de §Y7500§! £energy£, issue de nos plus grands réacteurs cristallins, en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§! ? Imaginez les opportunités économiques !"
 giga_eawaf.7015.desc.posada:0 "Enfin, nous avons tant attendu ce moment ! Peuple des Étoiles ! Les plus brillants esprits de notre monde ont conçu un grand dispositif capable d’atteindre d’autres étoiles.\n\nCependant, il semble que vous, Peuple des Étoiles, ayez revendiqué notre système stellaire. Par conséquent, nous aimerions vous demander respectueusement de nous en céder la propriété, en échange d’une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ !\n\nQue notre partenariat soit fructueux !"
 giga_eawaf.7015.desc.kaiser:0 "Salutations, alien. L'Empire Katzenartig a désormais débloqué le vol FTL et s'apprête à entreprendre la plus grande aventure de son histoire. À ce titre, je vous demande de nous transférer le contrôle de la base stellaire du système de Faust. Une compensation financière de §Y7500§! £energy£ peut être proposée, mais nous ne craignons pas d'entrer en guerre si vous refusez."
 giga_eawaf.7015.desc.dread:0 "Il n’y aura aucun repos avant la mort de la Mort elle-même."
 giga_flavor_systems.7005.dread:0 "Aux postes de combat !"
 giga_eawaf.7015.desc.leopold:0 "<<SALUTATIONS, VOYAGEURS DES ÉTOILES>> <<OFFRE DE COMPENSATION POUR L'ACQUISITION DU SYSTÈME DE FAUST>> <<PROPOSITION : §Y7500§! £energy£>> <<REFUSEZ ET SUBISSEZ NOTRE COURROUX>>"
 giga_eawaf.7015.a:0 "Vous pouvez prendre possession du système."
 giga_eawaf.7015.a.response:0 "Le [giga_eawaf_country.GetName] vous remercie pour votre coopération."
 giga_eawaf.7015.a.tooltip:0 "Nous allons transférer l’intégralité du système §Y[giga_eawaf_system.GetName]§! au §Y[giga_eawaf_country.GetName]§!, y compris toutes les colonies que nous pourrions y posséder."
 opinion_eaw_gave_system:0 "A cédé son système natal"
 opinion_eaw_gave_system_neighbors:0 "A cédé son système natal et ses voisins"
 giga_eawaf.7015.b:0 "Vous pouvez également prendre possession du système et de ses voisins immédiats."
 giga_eawaf.7015.b.tooltip:0 "Nous allons transférer l’intégralité du système §Y[giga_eawaf_system.GetName]§! ainsi que les §Ysystèmes voisins§! au §Y[giga_eawaf_country.GetName]§!, y compris toutes les colonies que nous pourrions y posséder. Le [giga_eawaf_country.GetName] vous en sera sûrement reconnaissant."
 giga_eawaf.7015.b.response:0 "Une véritable aubaine ! Le [giga_eawaf_country.GetName] vous en sera reconnaissant."
 giga_flavor_systems.7005.c:0 "Hors de question."
 giga_flavor_systems.7005.c.tooltip:0 "Nous allons refuser de leur céder le système. Ils pourraient riposter contre nous."
 giga_flavor_systems.7005.c.response:0 "Sachez que nous ne craignons pas le conflit, [ROOT.GetName]."
 giga_eaw_faust_planet_modifier:0 "Monde infusé de cristaux"
 giga_eaw_faust_planet_modifier_desc:0 "Ce monde possède des gisements inhabituellement abondants de cristaux ésotériques étroitement liés aux Cristaux Rares. Exploités correctement, ces cristaux peuvent libérer d’immenses quantités d’énergie."
 eaw_planet_buffs:0 "Thaumomancie"
 mod_planet_miners_rare_crystals_produces_add:0 "Cristaux rares extraits par les mineurs"
 giga_tech_thaumaturgic_weaponry:0 "Armement cristallin semi-thaumaturgique"
 giga_tech_thaumaturgic_weaponry_desc:0 "Les habitants de Faust ont mis au point des fusils et des armes infusés de puissants cristaux surpassant largement l’armement conventionnel. Bien que cela ait pu leur sembler magique, limitant ainsi leur capacité à répandre cette technologie, une étude approfondie sur la nature de ces cristaux pourrait nous permettre d’en standardiser l’usage au sein de nos forces armées. Cela impliquerait cependant un coût d’entretien important en Cristaux Rares."
 giga_eaw_crystal_army:0 "Armée infusée de cristaux"
 giga_eaw_crystal_army_desc:0 "Bien que légèrement plus fragiles et moins fiables que les armes conventionnelles, les armes à base de cristaux sont indéniablement plus puissantes. Ces soldats exploitent pleinement le potentiel offert par ces armes thaumaturgiques."
 giga_eaw_crystal_army_drone:0 "Automates infusés de cristaux"
 giga_eaw_crystal_army_drone_desc:0 "Bien que légèrement plus fragiles et moins fiables que les armes conventionnelles, les armes à base de cristaux sont indéniablement plus puissantes. Ces drones automatisés exploitent pleinement le potentiel offert par ces armes thaumaturgiques."
 giga_eawaf.7100.name:0 "Faust soumis"
 giga_eawaf.7100.desc:0 "Nos armées ont réussi à soumettre la grande majorité des forces armées de §YFaust§! et bien que quelques résistants continuent d’opérer dans les régions les plus isolées, nous avons désormais sécurisé le contrôle de tous les principaux centres de population de la planète. Cependant, Faust possède une diversité inhabituelle de nations et de cultures, avec au moins deux espèces majeures partageant la planète ainsi que des dizaines de sous-espèces, chacune ayant ses propres idéologies et croyances. Cela complique considérablement le maintien de l'ordre parmi la population conquise, d’autant plus que certaines de ces espèces semblent posséder des capacités proches de la psionique, facilitant ainsi l’organisation de mouvements de résistance à travers la planète. Il ne fait aucun doute que nous parviendrons à soumettre totalement les primitifs Faustiens, mais pour l’instant, nous devons nous attendre à une résistance extrêmement forte alors qu’ils prennent conscience de leur nouvelle réalité en tant que membres de notre civilisation."
 giga_eawaf.7100.a:0 "Ils seront maîtrisés en temps voulu."
 giga_eaw_faust_harsh_resistance:0 "Résistance Féroce"
 giga_eaw_faust_harsh_resistance_desc:0 "Les natifs de ce monde résistent à notre domination, mais ils ne pourront pas tenir éternellement."
 giga_eawaf.7101.name:0 "Armement Cristallin"
 giga_eawaf.7101.desc:0 "En étudiant la population conquise de §YFaust§! et leurs technologies, nos soldats ont remarqué qu'en dépit de leur classification en tant que civilisation primitive, les Faustiens utilisaient un armement étonnamment puissant pour leur niveau de développement technologique.\n\nDes investigations approfondies ont révélé que la majorité de leurs armes reposaient sur l'utilisation d'un type exotique de §Ycristal rare§! intégré à leurs technologies, capable d'emmagasiner et de libérer d'énormes quantités d'énergie. Ces cristaux servaient de véritables 'batteries cristallines', fournissant ainsi une source d'énergie quasi-inépuisable à leurs armes.\n\nApparemment apparentés aux cristaux rares que nous connaissons, ces cristaux auraient été déposés sur Faust par des siècles d'impacts météoriques en provenance de la ceinture d'astéroïdes cristalline avoisinante, peut-être altérés par une perturbation locale de l'espace-temps.\n\nQuoi qu'il en soit, nos scientifiques sont impatients d'étudier ces cristaux particuliers et ont déjà soumis plusieurs propositions visant à les intégrer dans notre propre armement afin d'améliorer encore davantage la puissance de nos forces armées.\n\nUn scientifique a souligné que, si une civilisation venait à exploiter pleinement le véritable potentiel de l’armement thaumaturgique, elle pourrait devenir l'une des forces les plus redoutables de toute la galaxie. Heureusement, les Faustiens utilisaient ces cristaux comme des améliorations de leurs technologies 'classiques' plutôt que de s'appuyer exclusivement sur eux. Pour notre propre bien, espérons qu'aucune civilisation ne découvre jamais le véritable potentiel de ces technologies ésotériques et pratiquement 'magiques'…"
 giga_eawaf.7101.a:0 "Intrigant."
 giga_eawaf.7016.name:0 "§Y[giga_eawaf_country.GetName]§! S'empare de la Base Stellaire de §Y[giga_eawaf_system.GetName]§!"
 giga_eawaf.7016.desc:0 "En totale violation de notre refus de leur demande, le §Y[giga_eawaf_country.GetName]§! a mené une opération visant à s'emparer de notre base stellaire dans le système §Y[giga_eawaf_system.GetName]§!.\n\nBien qu'ils aient réussi à capturer la base elle-même, nous estimons qu'il ne devrait pas être trop difficile de détruire leurs flottes et de reprendre le système ainsi que leur planète, bien que notre haut commandement mette en garde sur le fait que leurs forces terrestres sont exceptionnellement puissantes pour une civilisation aussi jeune."
 giga_eawaf.7016.a:0 "Comment osent-ils ? Écrasez-les immédiatement !"
 giga_eawaf.7016.a.tooltip:0 "Nous allons §Rdéclarer la guerre§! au §Y[giga_eawaf_country.GetName]§! et nous devrons conquérir §YFaust§! pour mettre fin au conflit."
 giga_eawaf.7016.b:0 "Ils peuvent garder ce système, il ne nous sert à rien de toute façon."
 giga_eawaf.7016.b.tooltip:0 "Le §Y[giga_eawaf_system.GetName]§! et toutes ses planètes sont transférés au §Y[giga_eawaf_country.GetName]§!."
 giga_eawaf.7103.name:0 "Les Alicornes se Mobilisent contre l’Invasion !"
 giga_eawaf.7103.desc:0 "Notre invasion de §YFaust§! n'est certainement pas passée inaperçue aux yeux des principaux protecteurs de la planète. En effet, les cieux de §YFaust§! tremblent alors que les deux divinités célestes de la planète, §YPrincesse Celestia§! et §YPrincesse Luna§!, se mobilisent pour tenter de sauver leur monde d'une soumission extraterrestre.\n\nNous devons nous attendre au pire. Puisque ces entités possèdent une magie suffisamment puissante pour permettre à Helios et Selene de défier les lois de la physique en orbitant autour de Faust, elles sont très probablement capables de ravager nos forces armées.\n\nNos commandants signalent déjà des divisions entières anéanties par les puissants faisceaux de magie plasmatique de Celestia, tandis que toutes les opérations logistiques sur la face nocturne de la planète sont gravement entravées par une obscurité totale et oppressante, vraisemblablement conjurée par Luna elle-même, rendant nos soldats complètement vulnérables dans l'obscurité.\n\nIl est évident que soumettre Faust va exiger un investissement militaire colossal de notre part. Cependant, si nous ne voulons pas avoir à affronter ces adversaires surnaturels, nous pourrions simplement nous retirer de ce bourbier avant qu'il ne soit trop tard. Toutefois, les dommages infligés à la société de Faust seront indéniablement irréversibles."
 giga_eawaf.7103.a:0 "Nous ne nous rendrons jamais à des chevaux parlants !"
 giga_eawaf.7103.a.tooltip:0 "§YCelestia§! et §YLuna§! se mobiliseront contre nous !"
 giga_eawaf.7103.b:0 "Ce caillou maudit ne vaut pas tant d'efforts."
 giga_eawaf.7103.b.tooltip:0 "Nous allons nous retirer de Faust. Cependant, la mobilisation de §YCelestia§! et §YLuna§!, ainsi que la prise de conscience que la vie extraterrestre existe, auront presque certainement de §Rgraves conséquences§! sur le développement de la planète."
 giga_eawaf.10151.name:0 "Établissement de la Base Stellaire de Faust"
 giga_eawaf.10151.desc:0 "Étant donné les propriétés particulières du système §YFaust§!, notre équipe d'exploration a suggéré que nous établissions en urgence un §Yavant-poste§! dans le système afin d'assurer la poursuite de nos investigations sur ses mystères."
 giga_eawaf.10151.a:0 "Une entreprise qui en vaut la peine !"
 giga_eawaf.10151.b:0 "Nous avons d'autres priorités."
 r_eawaf_sirens_crystal:0 "Cristaux Abyssaux"
 r_eawaf_sirens_crystal_desc:0 "Autrefois en possession des Sirènes et forgés par des moyens inconnus, ces fascinants cristaux rouges possèdent une magie extrêmement puissante capable d’influencer les pensées de presque toute créature pensante. Bien qu’il soit inconcevable que nous puissions les utiliser à leur plein potentiel comme le faisaient les Sirènes, ils pourraient néanmoins s’avérer utiles pour gérer des individus ou des entités politiques particulièrement récalcitrants."
 r_eawaf_eqg_portal:0 "Miroir de Cristal"
 r_eawaf_eqg_portal_desc:0 "Un mystérieux artefact ressemblant à un portail, relié à une dimension alternative peuplée d'humanoïdes primitifs aux couleurs étranges, fréquentant ce qui semble être un centre d’éducation. Bien que cette dimension ne nous soit d’aucune utilité directe, les propriétés ésotériques du portail offrent une fascinante incursion dans la nature sous-jacente de notre univers et de ses plans constitutifs. De plus, ses habitants produisent occasionnellement des pièces musicales intrigantes d'un certain intérêt culturel."
 giga_eawaf_portal_relic_tooltip:0 "\nExtrait un ensemble envoûtant de performances musicales harmonieuses sur les vertus de l'amitié depuis la dimension alternative, renforçant l'unité de notre nation.\n§L'Levez-vous, faites du bruit ! Frappez vos sabots, tournez sur vous-même !'§!"
 giga_eawaf_eqg_portal_modifier:0 "Musiques Harmoniques"
 giga_eawaf_eqg_portal_modifier_desc:0 "Les pièces musicales extraites de la dimension miroir fournissent à nos artistes un abondant matériel d’inspiration."
 job_entertainer_plural_with_icon:0 "Artistes"
 giga_eawaf_crystal_relic_tooltip:0 "Lance un sort de §Rhaine§! et de §Rdiscorde§! sur toutes les factions et empires hostiles, réduisant les capacités de leurs vaisseaux et augmentant les troubles planétaires."
 giga_eawaf_crystal_relic_modifier: "Sort de Discorde"
 giga_eawaf_crystal_relic_modifier_desc:0 "Un sort de discorde est en train d’être lancé contre nous."
 giga_eawaf.60252.name:0 "Sort de Discorde Imminent !"
 giga_eawaf.60252.desc:0 "Le §Y[giga_eawaf_strife_spell_caster.GetName]§! a utilisé les §YCristaux Abyssaux§! pour lancer un sort de discorde sur notre civilisation, réduisant la cohésion de notre peuple !"
 giga_eawaf.60252.a:0 "Malédiction !"
 giga_eawaf.60253.name:0 "Sort de Discorde Lancé !"
 giga_eawaf.60253.desc:0 "Grâce à des impulsions d’énergie ciblées, les §YCristaux Abyssaux§! ont déchargé leur pouvoir à travers la galaxie, troublant l'esprit de nos ennemis."
 giga_eawaf.60253.a:0 "Excellent. Qu'ils en souffrent."
 GIGA_EAWAF_EQG_PORTAL:0 "Libération des Faustiens"
 GIGA_EAWAF_EQG_PORTAL_DESC:0 "Il est primordial que nous trouvions un moyen de libérer Faust de l’emprise des Sirènes, sous peine de voir sa population entière périr dans une mort insensée."
 GIGA_EAWAF_SIRENS_COUNTRY:0 "Enchanteurs Harmoniques"