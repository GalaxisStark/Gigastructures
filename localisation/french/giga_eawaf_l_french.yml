l_french:
 eawaf_army:0 "Armée Thaumaturgique"
 eawaf_army_celestia:0 "Alicorne"
 eawaf_army_luna:0 "Alicorne"
 eawaf_sirens_army:0 "Armée Abyssale"
 giga_eawaf.1001.name:0 "L'Étoile Clignotante"
 giga_eawaf.1001.desc:0 "Depuis que notre espèce a commencé à cartographier les étoiles - d'abord à l'aide de télescopes optiques primitifs, puis via des satellites orbitaux, et maintenant avec des émetteurs tachyoniques - certains systèmes se sont toujours comportés de manière inattendue.\n\nLes principales sources de confusion pour nos astronomes étaient généralement des variations de luminosité stellaire et des modèles de transit exoplanétaire irréguliers. Mais au fil du temps, notre compréhension croissante de l'astrophysique a permis de résoudre ces mystères. La plupart du temps, il s'agissait simplement d'erreurs de mesure de nos télescopes primitifs. Dans d'autres cas, l'étude de ces phénomènes nous a permis d'affiner notre connaissance des exoplanètes et du comportement stellaire.\n\nCependant, malgré l'amélioration continue de nos instruments d'observation et notre compréhension toujours plus précise du cosmos, un système en particulier continue de défier tous les modèles d'astrophysique : l'énigmatique étoile connue sous le nom de §YFaust§!. Bien qu'elle puisse sembler être une étoile normale - bien que légèrement pâle - toute observation prolongée révèle un comportement troublant : elle disparaît purement et simplement avant de réapparaître environ douze heures plus tard, pour disparaître à nouveau douze heures après.\n\nSurnommée l'§YÉtoile Clignotante§! par nos astronomes, aucune théorie n'a encore pu expliquer ces disparitions régulières. Il est devenu évident que la seule façon de percer ce mystère est de s'y rendre nous-mêmes. Heureusement, avec la récente découverte du voyage plus rapide que la lumière, une telle enquête directe est enfin à portée de main. L'enthousiasme au sein de notre communauté scientifique est déjà à son comble."
 giga_eawaf.1001.a:0 "Mettons-nous au travail."
 giga_eawaf.1001.a.tooltip:0 "§BCe système et tout ce qui s'y rapporte font partie de l'événement spécial §YPoisson d'Avril 2024§! en collaboration avec le mod §YEquestria at War§! pour HOI4 ! Si, pour une raison quelconque, vous ne souhaitez pas participer à cette chaîne d'événements, vous pouvez désactiver le système via le Gigamenu. Mais je vous recommande de tenter l'expérience !§!"
 giga_eawaf_faust_chain_title:0 "Les Mystères de Faust"
 giga_eawaf_faust_chain_desc:0 "Le système Faust défie toute logique. Il est impératif que nous l'examinions plus en détail !"
 giga_eawaf_sirens_chain_title:0 "Sirenalia"
 giga_eawaf_sirens_chain_desc:0 "Les Sirènes sont déterminées à envoûter toute la galaxie. Elles doivent être arrêtées !"
 giga_eawaf_faust_name:0 "L'Étoile Clignotante"
 giga_eawaf_faust_desc:0 "Le système Faust 'clignote' - apparaissant et disparaissant à des intervalles d'environ douze heures. Il est évident que la seule façon d'élucider ce mystère est de nous y rendre nous-mêmes."
 giga_eawaf_poi_sirens_stats_name:0 "Traque des Sirènes"
 giga_eawaf_poi_sirens_stats_desc:0 "§RDiscorde Totale§! - [giga_eawaf_country.giga_eawaf_total_strife]\nLes Sirènes se nourrissent et prospèrent grâce à la §RDiscorde§! - une 'manifestation' de la haine et du mépris. Toute planète située dans le §PChamp Extérieur§! générera de la §RDiscorde§! en fonction de sa §YPopulation§!, de sa §YCriminalité§! et de sa §YStabilité§!, ces deux derniers facteurs étant affaiblis par le §PChamp Extérieur§!.\n\n§MNiveau d'Expansion du Champ de Discorde§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range_level]\n§RPortée du Champ de Discorde Intérieur§! - [giga_eawaf_country.giga_eawaf_inner_strife_field_range]\n§PPortée du Champ de Discorde Extérieur§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range]\n§YSeuil de Discorde avant Expansion§! - [giga_eawaf_country.giga_eawaf_strife_field_range_next_level_cost]\n§YSeuil de Discorde avant Réduction§! - [giga_eawaf_country.giga_eawaf_strife_field_range_prev_level_cost]\nPlus les Sirènes accumulent de la §RDiscorde§!, plus leur influence s'étend. Toutefois, si elles en collectent trop peu, leur champ d'effet diminuera. La taille du champ ne peut être modifiée qu'une fois tous les §Y2,5 ans§!.\n\n\n§MPuissance du Champ de Discorde§! - [giga_eawaf_country.giga_eawaf_field_potency_multiplier]\nPlus la Puissance du champ est élevée, plus les malus qu'il inflige aux vaisseaux et aux planètes sont sévères.\n\n§YRessources de Guerre Actuelles§! - [giga_eawaf_country.giga_eawaf_sirens_warmaterial_count]\n§YNiveau de l'Envoûteur Shroudsonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_level] \n§YCoût du Niveau Suivant de l'Envoûteur Shroudsonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_next_level_cost]\nCes ressources représentent le stock de matériaux avancés des Sirènes, produits par leur population sur les mondes capturés. Elles servent à la fabrication de vaisseaux et à l'amélioration de l'§YEnvoûteur Shroudsonique§!, rendant ses effets plus puissants et aggravant les malus qu'il inflige aux planètes et aux vaisseaux situés dans sa zone d'effet."
 giga_eawaf.1010.name:0 "Géocentrisme"
 giga_eawaf.1010.desc:0 "Le §Y[ROOT.GetName]§! est arrivé dans le système §YFaust§!, espérant enfin résoudre le mystérieux phénomène de 'l'Étoile Clignotante', qui a déconcerté astronomes et scientifiques pendant des siècles.\n\nEt, dans un ironique retournement de situation, la solution ne résidait pas dans nos théories les plus avancées, mais plutôt dans la toute première et erronée interprétation de l'espace que notre espèce a élaborée pour expliquer le mouvement des étoiles dans le ciel : le géocentrisme.\n\nLe système §YFaust§! est, d'une manière ou d'une autre, centré autour de Faust lui-même, un monde tellurique autour duquel gravitent plusieurs petites planètes (ou lunes), ainsi qu'un mini-soleil fournissant chaleur et lumière à Faust.\n\nLes analyses spectrales de cette étoile montrent qu'elle se comporte plus ou moins comme une étoile de classe G typique, bien que son diamètre ne dépasse pas trois mille kilomètres. Avec une taille aussi réduite, elle devrait être soit une étoile à neutrons, soit une simple géante gazeuse, et pourtant... elle est bien là, orbitant autour de Faust en vingt-quatre heures, disparaissant derrière la planète toutes les douze heures avant de réapparaître de l'autre côté.\n\nSi le mystère de l'§YÉtoile Clignotante§! est enfin résolu, il reste encore beaucoup de travail avant de comprendre ce qui se passe réellement dans ce système étrange."
 giga_eawaf.1010.a:0 "Quelle étrangeté."
 giga_eawaf.1011.name:0 "Cristaux Thaumaturgiques"
 giga_eawaf.1011.desc:0 "La ceinture d'astéroïdes en orbite autour de Faust est remplie d'affleurements de cristaux étranges, aux teintes violettes et roses, sans équivalent dans nos découvertes précédentes.\n\nLes premières expériences indiquent que ces cristaux 'stockent' une forme d'énergie éthérée au sein de leur structure moléculaire, laquelle peut être libérée en leur appliquant certains stimuli, souvent avec des résultats destructeurs.\n\nToutefois, nos espoirs d'utiliser ces cristaux pour améliorer nos armes et systèmes énergétiques ont été rapidement anéantis : toutes les tentatives de les extraire du système Faust ont entraîné une dissipation spontanée de leur charge énergétique, suivie de leur fragmentation en multiples morceaux inertes.\n\nIl est évident qu'une propriété spécifique du système Faust alimente ces cristaux en énergie, mais l'origine de cette énergie demeure, pour l'instant, un mystère total."
 giga_eawaf.1011.a:0 "Intrigant."
 giga_eawaf.1012.name:0 "Satellite Cauchemar"
 giga_eawaf.1012.desc:0 "§YSéléné§!, la lune rocheuse en orbite autour de Faust, opposée à l'énigmatique §YHélios§!, semble être, à première vue, l'élément le plus ordinaire du système Faust. Il s'agit d'une lune relativement grande, marquée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunaire, à l'instar de nombreuses autres lunes naturelles.\n\nLes premiers signes d'anomalie sont apparus ironiquement lorsque l'équipage du §Y[ROOT.GetName]§! a commencé à se reposer. Dès leur approche de la lune, leurs rêves agréables se sont transformés en cauchemars atroces. La majorité d'entre eux rapportent avoir été visités par une imposante figure équine ténébreuse leur promettant vengeance et une obscurité éternelle s'étendant sur les mondes.\n\nBien que ces cauchemars aient cessé dès que le vaisseau s'est éloigné de la lune, de nombreux membres de l'équipage croient désormais que ce corps céleste est 'hanté' par un esprit vengeur inconnu. De plus, §Y[ROOT.GetLeaderName]§!, le scientifique en charge, semble avoir été profondément marqué par ces visions nocturnes..."
 giga_eawaf.1012.a:0 "Tout ceci est dans leur tête... n'est-ce pas ?"
 giga_eawaf.1012.desc_machine_intelligence:0 "§YSéléné§!, la lune rocheuse en orbite autour de Faust, opposée à l'énigmatique §YHélios§!, semble être, à première vue, l'élément le plus ordinaire du système Faust. Il s'agit d'une lune relativement grande, marquée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunaire.\n\nLes premiers signes d'anomalie sont apparus dès que le §Y[ROOT.GetName]§! s'est approché. L'équipage a commencé à adopter un comportement erratique et à signaler des artefacts visuels prenant la forme d'une imposante silhouette équine obscure.\n\nBien que ces erreurs visuelles aient cessé dès que le vaisseau s'est éloigné, il est désormais supposé que ce corps céleste pourrait être 'hanté' par une entité vengeresse inconnue."
 giga_eawaf.1012.desc_hive_mind:0 "§YSéléné§!, la lune rocheuse en orbite autour de Faust, à l'opposé de l'énigmatique §YHélios§!, semble, à première vue, être l’élément le plus normal du système de Faust. C’est une grande lune rocheuse marquée par de nombreux cratères d’impact dus à son absence d’atmosphère, et recouverte d’une fine couche de poussière lunaire, comme beaucoup d’autres satellites naturels.\n\nLes premiers signes d’anomalie sont apparus ironiquement lorsque l’équipage du §Y[ROOT.GetName]§! s’est approché de la lune. Ils ont commencé à se comporter de manière erratique et ont signalé des hallucinations prenant la forme d’une silhouette équine sombre et imposante.\n\nBien que ces visions aient cessé dès que le vaisseau s’est éloigné de la lune, il est probable que ce corps céleste soit 'hanté' par un esprit vengeur inconnu."
 giga_eawaf.1012.b:0 "Troublant."
 giga_eawaf.1013.name:0 "Un Soleil Improbable"
 giga_eawaf.1013.desc:0 "Nous espérions qu'une inspection plus approfondie de §YHélios§! nous aiderait à mieux comprendre ce corps céleste mystérieux, mais il continue de se comporter de manière totalement impossible.\n\nTout d'abord, la période orbitale d'Hélios et de Séléné est de vingt-quatre heures, ce qui est bien plus court que ce que nous devrions observer. Selon nos calculs, ces deux lunes devraient logiquement mettre environ deux semaines pour faire le tour de Faust.\n\nEnsuite, bien que leurs orbites restent circulaires et prévisibles, elles présentent de subtiles 'oscillations' à des moments aléatoires, comme si elles étaient soudainement 'attirées' par une force inconnue.\n\nBien entendu, s'attendre à ce que les lois de l'orbite fonctionnent normalement dans un système où une étoile tourne autour d'une planète est déjà quelque peu absurde. Mais ces anomalies ne font qu'ajouter à l'interminable liste des mystères irrésolus du système Faust.\n\nDe plus, notre étoile semble puiser de l'énergie à partir de... rien. Son rayonnement dépasse largement ce que n'importe quel processus de fusion connu pourrait produire, enfreignant même parfois le principe fondamental d'équivalence masse-énergie."
 giga_eawaf.1013.a:0 "Mais comment cela fonctionne-t-il ?"
 giga_eawaf.1014.name:0 "Des Équidés en Guerre"
 giga_eawaf.1014.desc:0 "Comme si ce système n'était pas déjà assez étrange, son monde central, §YFaust§!, est non seulement habitable grâce à la lumière d'Hélios, mais il est également peuplé !\n\nUne activité radio soutenue en provenance de la surface trahit l'existence d'une civilisation technologiquement avancée, approchant le niveau de l'âge industriel. Ce monde est partagé par une douzaine d'espèces intelligentes, capables de pensée complexe, parmi lesquelles certaines possèdent d'étonnantes capacités surnaturelles, allant de l'agriculture incroyablement efficace à la télékinésie et au vol.\n\nD'importants gisements des cristaux thaumaturgiques trouvés dans la ceinture d'astéroïdes du système ont également été détectés sur la planète, où plusieurs espèces les utilisent pour amplifier leurs pouvoirs naturels. Nos scientifiques émettent donc l'hypothèse que ces cristaux et ces capacités sont intrinsèquement liés.\n\nNous semblons être témoins d'un moment charnière dans l'histoire de ce monde : plusieurs nations expérimentent activement de nouvelles méthodes scientifiques, ce qui pourrait radicalement transformer leur développement technologique.\n\nLe §Y[ROOT.GetName]§! a déployé une petite équipe à la surface afin d'observer cette civilisation unique avant d'établir un poste d'observation permanent."
 giga_eawaf.1014.a:0 "Espérons qu'ils ne finissent pas par s'autodétruire."
 giga_eawaf.10141.name:0 "Rapport d’Investigation de Faust"
 giga_eawaf.10141.desc:0 "Notre expédition à la surface de §YFaust§! s’est déroulée sans incident majeur, tout en nous fournissant une quantité colossale de données sur la civilisation, ou plutôt les civilisations, peuplant cette planète.\n\nLes terres émergées de la planète se divisent en trois grands continents : deux petits au nord, appelés §YÉquus§! et §YGriffonia§!, et un plus vaste au sud, §YZebrica§!. Ces continents sont d’une diversité remarquable, chacun abritant plusieurs espèces sapientes distinctes.\n\nParmi elles, on retrouve des espèces indigènes aussi variées que les humanoïdes bipèdes connus sous le nom de §YYétis§!, les ursidés quadrupèdes appelés simplement §YOurs§!, et les aviens connus sous le nom de §YGriffons§!. Cependant, une grande partie de la population planétaire est composée de créatures équines regroupées sous le terme générique §YÉquineans§!.\n\nCe terme englobe plusieurs espèces, dont les §YPonies§! (particulièrement petits mais doués de facultés thaumaturgiques et, aux côtés des Griffons, largement dominants en nombre sur les trois continents), les §YZèbres§! adaptés aux climats désertiques, les imposants §YChevaux§!, et les étranges §YKirins§! originaires de l’extrême est de Zebrica.\n\nMais ce qui intrigue et inquiète le plus nos chercheurs, c’est l’existence d’êtres quasi-divins parcourant la surface de Faust. Connus sous le nom de §YAlicornes§!, ces entités possèdent d’incroyables capacités de manipulation de la réalité et semblent être les souveraines incontestées de §YEquestria§!, la nation la plus puissante de la planète.\n\nLe consensus parmi les membres de l’expédition est clair : la puissance des Alicornes est telle qu’une tentative d’invasion de Faust serait §Rextrêmement risquée§!. Il serait donc bien plus sage de se contenter d’une observation à distance."
 giga_eawaf.10141.a:0 "Quel monde fascinant."
 giga_eawaf.10141.b:0 "C’EST PASSIONNANT ! Nous devons en apprendre davantage !"
 giga_eawaf.1015.name:0 "Le Mystère de Faust"
 giga_eawaf.1015.desc.nopsi:0 "Le système de §YFaust§! a désormais été entièrement cartographié par le §Y[ROOT.GetName]§!, et si le mystère de l’'Étoile Clignotante' a pu être expliqué par le passage d’Hélios derrière Faust, cette mission d’exploration a soulevé plus de questions qu’elle n’en a résolu.\n\nComment fonctionne Hélios ? Quelle est l’origine des cauchemars étranges survenant à proximité de Séléné ? D’où les cristaux thaumaturgiques tirent-ils leur énergie ? Et surtout, quel phénomène, s’il existe, relie tous ces éléments ?\n\nDe nombreuses théories ont été formulées pour tenter de rassembler toutes ces observations sous un même modèle, mais aucune ne parvient à décrire l’ensemble des mystères du système de Faust sans rencontrer d’importantes contradictions ailleurs. Pour l’instant, Faust et ses énigmes resteront un mystère."
 giga_eawaf.1015.nopsi:0 "Peut-être qu’avec le temps, notre compréhension sera suffisante…"
 giga_eawaf.1015.nopsi.tooltip:0 "Nous pourrions obtenir plus d’informations sur Faust en développant les technologies appropriées."
 giga_eawaf.1015.desc.psi:0 "Le système de §YFaust§! a désormais été entièrement cartographié par le §Y[ROOT.GetName]§!, et si le mystère de l’'Étoile Clignotante' a été expliqué par le transit d’Hélios derrière Faust, cette mission d’exploration a soulevé bien plus de questions qu’elle n’en a résolu.\n\nComment fonctionne Hélios ? Quelle est l’origine des cauchemars étranges survenant à proximité de Séléné ? D’où les cristaux thaumaturgiques tirent-ils leur énergie ? Et surtout, quel phénomène, s’il existe, relie tous ces éléments ?\n\nSi plusieurs hypothèses ont été avancées, une théorie en particulier se démarque nettement : celle d’une interférence psionique.\n\nSelon nos connaissances actuelles, les pouvoirs psioniques semblent provenir d’un domaine immatériel au-delà de notre réalité. Bien que les détails de cet univers restent flous, certains suggèrent que le système de Faust pourrait être situé dans une région où le voile séparant notre monde et ce royaume est plus mince.\n\nCette théorie, qui semble prometteuse pour expliquer nombre des mystères de Faust, gagne rapidement du terrain au sein de notre communauté scientifique. De nombreux chercheurs appellent désormais à une enquête approfondie du système afin de déterminer si cette hypothèse tient la route."
 giga_eawaf.1015.psi:0 "Nous n’avons pas une seconde à perdre !"
 giga_eawaf.1015.b:0 "Franchement, nous en avons assez vu."
 giga_eawaf.1015.b.tooltip:0 "Nous ne mènerons plus aucune expédition pour percer les mystères de Faust."
 GIGA_EAWAF_SURVEY_HELIOS:0 "Enquêter sur Hélios"
 GIGA_EAWAF_SURVEY_HELIOS_DESC:0 "Il existe des preuves indiquant que les anomalies du système de Faust sont causées par une interférence psionique. Nous devrions mener une enquête approfondie sur son étoile mystérieuse sans plus attendre."
 giga_eawaf.1016.name:0 "Eurêka Psionique"
 giga_eawaf.1016.desc:0 "Nos récentes avancées dans le domaine des §YPsioniques§! ont conduit nos scientifiques à réévaluer de nombreuses découvertes et théories sous un nouveau prisme.\n\nParmi elles figure notamment le mystérieux système de §YFaust§!, dont les cristaux thaumaturgiques, l’étoile miniature et les créatures aux capacités magiques défient notre compréhension de la physique depuis sa première exploration.\n\nCependant, grâce à la perspective renouvelée qu’offrent nos connaissances accrues sur ce qui se trouve au-delà du monde matériel, certains de nos scientifiques suggèrent de retourner dans le système de Faust afin de voir s’il ne recèle pas encore d’autres secrets insoupçonnés…"
 giga_eawaf.1016.a:0 "Misons-y immédiatement !"
 giga_eawaf.1017.name:0 "Fusion Psionique"
 giga_eawaf.1017.desc:0 "Bien que cela ait nécessité un investissement conséquent en temps et en ressources, nos scientifiques estiment avoir enfin percé les mystères du fonctionnement interne d'§YHélios§! ainsi que du reste du système Faust.\n\nLes expériences menées sur la sensibilité psionique des télépathes ont confirmé que l’ensemble du système se trouve dans un espace où le voile entre la réalité et l’immaterium est plus mince, permettant l’émergence de phénomènes surnaturels. Comme les systèmes stellaires sont en perpétuel mouvement dans l'espace, nos scientifiques ont conclu qu'un phénomène devait être à l'origine de cet 'amincissement' de la réalité et ont entrepris de sonder Hélios lui-même pour obtenir des réponses.\n\nGrâce à des sondes thermiquement protégées plongeant dans les profondeurs de cet enfer ésotérique, il a été découvert qu'au cœur d’Hélios se trouve une 'faille' miniature dans la réalité elle-même, menant directement à un domaine d’énergie psionique pure. La matière du noyau d’Hélios tombe régulièrement dans cette faille avant de réapparaître sous la forme d’une énergie psionique surchauffée. Cette énergie 'flotte' ensuite vers les couches externes d’hydrogène d’Hélios et déclenche des réactions de fusion nucléaire.\n\nPar un processus encore mal compris, l’énergie psionique 'épuisée' se reconvertit ensuite en noyaux d’hydrogène, eux-mêmes enflammés par une nouvelle énergie psionique. Les noyaux d’hélium fusionnés, en raison de leur masse plus élevée, tombent dans la faille, et le cycle se répète indéfiniment, maintenant ainsi la petite étoile en combustion !\n\nLa découverte et la compréhension de ce processus ésotérique, désormais appelé §YFusion Psicatalysée§!, ont révolutionné à la fois la science nucléaire et les études psioniques. Nombre de nos scientifiques débattent désormais de la possibilité de reproduire ce processus nous-mêmes afin de produire de l'énergie."
 giga_eawaf.1017.a:0 "Absolument incroyable ! Voyons si nous pouvons reproduire le processus."
 giga_eawaf.1017.a.tooltip:0 "Nous allons tenter de déclencher une fusion psicatalysée dans un environnement contrôlé, mais cela pourrait nécessiter une compréhension des psioniques plus avancée que celle dont nous disposons actuellement. Cela ne coûte rien d’essayer."
 giga_eawaf.1017.b:0 "Ces découvertes sont remarquables, mais nous avons déjà accompli suffisamment."
 GIGA_EAWAF_PSIONIC_FUSION:0 "Reproduire la Fusion Psicatalysée"
 GIGA_EAWAF_PSIONIC_FUSION_DESC:0 "Les mécanismes qui alimentent les processus de fusion d’Hélios reposent sur un apport complexe de matière tombant directement dans l’immaterium. Répliquer artificiellement ce processus pourrait nous permettre de construire des réacteurs à fusion nettement plus puissants. Nos scientifiques estiment qu’il nous faut d’abord trouver un moyen de §Ypercer l’immaterium§!, puis d’acquérir un puissant §Ycatalyseur psionique§! pour réussir. Il pourrait être sage d’attendre que nous remplissions ces prérequis avant d’entreprendre ce projet."
 giga_eawaf.10171.name:0 "Succès de la Fusion Psicatalysée"
 giga_eawaf.10171.desc:0 "Après de nombreux échecs et impasses, les dernières expériences visant à reproduire la §YFusion Psicatalysée§! dans un environnement contrôlé ont enfin produit un gain d'énergie positif.\n\nUne faille psionique artificielle a été induite et maintenue par des psioniques au sein d’une sphère condensée d’hélium, qui s’est spontanément effondrée dans la faille avant de réapparaître sous forme d’énergie psionique surchauffée, à l’image du noyau d’Hélios. Des noyaux d’hydrogène ont ensuite été injectés au moment précis de l’émergence de l’énergie, déclenchant des réactions de fusion nucléaire extrêmement puissantes, plusieurs ordres de grandeur supérieures à celles des réacteurs à fusion conventionnels, voire même des étoiles normales.\n\nAvec ce premier obstacle expérimental surmonté, les applications potentielles de cette technologie sont illimitées. Non seulement elle génère d’énormes quantités d’énergie, mais les réactions de fusion accrues pourraient théoriquement être utilisées pour créer des éléments extrêmement lourds avec bien plus de facilité que les méthodes actuelles. De plus, les failles stabilisées semblent induire un 'amincissement de la réalité' similaire à celui observé dans le système Faust, améliorant considérablement l’efficacité des capacités psioniques à proximité.\n\nAprès ce succès retentissant, il ne nous reste plus qu’à mettre à l’échelle ce modèle pour une utilisation industrielle."
 giga_eawaf.10171.a:0 "Excellent !"
 giga_eawaf.10172.name:0 "Échec de la Fusion Psicatalysée"
 giga_eawaf.10172.desc:0 "Malheureusement, nos tentatives de reproduction de la §YFusion Psicatalysée§! se sont toutes soldées par un échec. Il semble que notre compréhension actuelle des psioniques soit encore bien trop primitive pour recréer avec précision les conditions spécifiques existant au sein du noyau infernal d’Hélios.\n\nNos propres conceptions de réacteurs échouent soit à ouvrir une faille dans l’immaterium, soit à catalyser correctement la réaction de fusion psionique. Le projet est considéré par beaucoup comme un gaspillage de ressources, mais certains de nos scientifiques continuent de croire en sa faisabilité, arguant que nous ne sommes tout simplement pas encore prêts."
 giga_eawaf.10172.a:0 "Essayons encore ! Cette fois, cela fonctionnera..."
 giga_eawaf.10172.a.tooltip:0 "Nous allons tenter à nouveau de déclencher une fusion psicatalysée dans un environnement contrôlé, mais il serait peut-être plus sage d’attendre d’avoir progressé dans notre compréhension des psioniques, sous peine d’essuyer un nouvel échec."
 giga_eawaf.10172.b:0 "Ce projet a été une perte de temps. Abandonnons-le."
 giga_eawaf.2001.name:0 "Les Profondeurs s'Éveillent"
 giga_eawaf.2001.desc:0 "Quelque chose s'agite à la surface de Faust. Des explorateurs hippocampes originaires de §YHippogriffia§!, une nation située à l'extrémité nord-ouest de Zébrica, ont récemment entrepris une expédition dans les profondeurs de la §YFosse de Mareiana§!, l'une des failles les plus profondes et sombres des vastes océans de Faust.\n\nÀ leur retour, quelque chose en eux avait changé. Une présence mystérieuse s'était emparée d'eux, comme si leur âme même avait été asservie. Cette présence s'est alors propagée à d'autres hippocampes, influençant de plus en plus d'esprits à travers la nation d'Hippogriffia.\n\nEn l'espace de quelques semaines, cette influence a culminé en un coup d'État relativement pacifique, renversant l'ancien gouvernement et instaurant à sa place les §YSirènes§!, un trio de démons serpentins dotés de pouvoirs hypnotiques. Ils se sont autoproclamés nouveaux dirigeants du territoire, qu'ils ont rebaptisé §YSirenalia§!.\n\nD'après les informations recueillies par notre poste d'observation, ces Sirènes semblent animées par un désir intense de vengeance contre une catastrophe oubliée qui aurait jadis frappé leur espèce. Il est donc évident qu'elles ne comptent pas s'arrêter à Hippogriffia et chercheront probablement à étendre leur influence sur toute la Zébrica, voire même sur l'ensemble de Faust.\n\nLa tâche est néanmoins ardue. Déjà, un mouvement de résistance, connu sous le nom de §YRésistance d'Aris§!, formé d'anciens hauts responsables d'Hippogriffia, dont son ancienne reine, a émergé pour contrer l'ascension de Sirenalia et renverser le règne des Sirènes sur leurs terres légitimes. La question reste de savoir s'ils réussiront à restaurer l'ordre ancien.\n\nQuel que soit le dénouement, il serait dans notre intérêt de suivre de près cette situation."
 giga_eawaf.2001.a:0 "Étrange... Observons la situation."
 giga_eawaf.2002.name:0 "Les Sirènes Assurent leur Emprise sur Hippogriffia"
 giga_eawaf.2002.desc:0 "L'ancien ordre d'Hippogriffia a été balayé, et §YSirenalia§! règne en maître. Après plusieurs années de guerre acharnée contre les partisans de la résistance et d'opérations de contre-espionnage, la §YRésistance d'Aris§! a été méthodiquement démantelée.\n\nCurieusement, les anciens membres de la résistance n’ont pas été exécutés ou exilés, mais plutôt asservis par les Sirènes elles-mêmes. Il en résulte une impression troublante de les voir tout simplement abandonner leurs idéaux pour rejoindre les rangs de leurs anciens ennemis.\n\nNos observations ont confirmé que les Sirènes sont bel et bien capables d’exercer un contrôle mental direct sur d’autres êtres sapients grâce à leur chant envoûtant. Cette capacité semble être alimentée par d’étranges cristaux nichés dans leur chair, bien que le mécanisme exact de cet asservissement nous échappe encore.\n\nGrâce à ce pouvoir, les Sirènes étendent déjà leur contrôle, cherchant à assujettir plusieurs nations voisines de Sirenalia.\n\nAvec une marine particulièrement puissante et une flotte aérienne considérable, héritées de l'ancien gouvernement d'Hippogriffia, nous estimons que les Sirènes ne rencontreront que peu de résistance dans leur conquête du nord de la Zébrica dans les prochaines années.\n\nQuant au reste de Faust, bien que certains s'inquiètent de l'ascension de Sirenalia, la majorité perçoit les Sirènes comme une simple puissance montante, vouée à être un jour écrasée par une coalition future."
 giga_eawaf.2002.a:0 "Restons vigilants."
 giga_eawaf.20021.name:0 "Les Sirènes Renversées"
 giga_eawaf.20021.desc:0 "Il semble que le règne des Sirènes n'était tout simplement pas destiné à durer. Après des mois d’actions clandestines, les membres de la §YRésistance d'Aris§! ont déclenché une rébellion ouverte contre Sirenalia.\n\nDans tout le pays, les non-asservis affrontent ceux tombés sous le joug des Sirènes. Ces derniers, loyaux jusqu'à la mort, combattent avec acharnement pour défendre leurs maîtresses. Pourtant, grâce à un soutien crucial d’§YÉquestria§!, la résistance harmonique l’emporte finalement. L’ordre des Sirènes s’effondre sur lui-même et leur magie hypnotique, privée de sa source d’énergie, s’évapore tout simplement.\n\nUn nouveau gouvernement unifié d’Hippogriffia a été instauré afin de restaurer l'ancien ordre, tandis que les Sirènes elles-mêmes ont disparu. Ont-elles péri dans les combats ? Ou bien sont-elles retournées dans les abysses océaniques pour y regagner en puissance, patientant avant de retenter leur conquête ?\n\nQuoi qu’il en soit, pour le futur immédiat, les habitants d’Hippogriffia peuvent dormir sur leurs deux oreilles, sachant que les Sirènes ne représentent plus une menace... du moins pour les prochains siècles."
 giga_eawaf.20021.a:0 "Elles ont trouvé plus fort qu'elles."
 giga_eawaf.2003.name:0 "La Chute du Nord de la Zébrica"
 giga_eawaf.2003.desc:0 "Les voisins de Sirenalia n'ont eu aucune chance face à l'avance implacable des Sirènes. Fortes de leur flotte navale et aérienne surpuissantes, les Sirènes ont lancé une série d’offensives contre les nations voisines de §YChiropterra§! et de §YColthage§!, déclenchant ainsi la §YGuerre du Nord de la Zébrica§!. Ce conflit s’est conclu par une victoire totale des Sirènes, qui ont ensuite imposé leur hégémonie sur la quasi-totalité du nord du continent.\n\nSuite à cette immense victoire, les Sirènes tournent déjà leur regard vers leur prochaine cible majeure : la nation-continent d’§YÉquestria§!, située au nord-ouest de Sirenalia, de l’autre côté de l’océan. D’abord perplexes quant au choix de cet adversaire redoutable, nos scientifiques ont découvert qu’un groupe d’individus, connus sous le nom de §YPiliers d'Équestria§!, serait à l’origine de la chute des Sirènes il y a plusieurs millénaires.\n\nIncroyablement, ces 'Piliers' sont toujours en vie, et il semble que les Sirènes soient prêtes à tout pour se venger de ceux qui les ont jadis bannies dans les profondeurs de la Fosse de Mareiana.\n\nLe conflit à venir promet d’être d’une ampleur inédite, probablement la plus grande guerre que Faust ait connue jusqu’à présent. Déjà, les Sirènes s’emploient à conquérir plusieurs nations stratégiquement positionnées, notamment §YMaregypte§! et §YAbyssinie§!, dans le but de les transformer en bases avancées pour leur invasion d’Équestria.\n\nBien qu’Équestria soit considérée comme une puissance écrasante, nombreux sont ceux sur Faust à croire que cette guerre mènera inévitablement à la chute des Sirènes. Pourtant, ces dernières semblent déterminées à aller jusqu’au bout de leur plan ambitieux."
 giga_eawaf.2003.a:0 "Cette guerre promet d'être spectaculaire."
 giga_eawaf.20031.name:0 "Sirenalia Défaite"
 giga_eawaf.20031.desc:0 "Malheureusement pour les Sirènes, les nations du nord de la Zébrica se sont révélées être un adversaire de taille face au jeune empire de Sirenalia.\n\nAprès une série d'assauts initiaux réussis contre les nations de §YChiropterra§! et §YColthage§!, déclenchant ainsi la §YGuerre du Nord de la Zébrica§!, l'avancée des Sirènes s'est rapidement essoufflée lorsque ces nations, contre toute attente, se sont unies pour repousser leur expansion.\n\nLa situation s'est encore compliquée pour les Sirènes avec l'entrée en guerre de §YWingbardy§!, une puissante nation du sud de Griffonia. La marine wingbardienne a définitivement renversé l’équilibre des forces, et il n’a fallu que quelques mois avant que les territoires centraux de Sirenalia ne soient menacés.\n\nAprès des mois de siège suivis de plusieurs offensives éprouvantes contre les capitales de Sirenalia, les Sirènes, réalisant que leur défaite était inévitable, ont pris la fuite et ont de nouveau disparu dans les profondeurs de l’océan.\n\nAvec leur départ, ce qui restait du gouvernement de Sirenalia s’est rapidement effondré. Ses anciens territoires ont été placés sous un mandat de reconstruction chargé de restaurer la région et d’éliminer les derniers bastions fanatiques encore fidèles aux Sirènes.\n\nLes véritables traces des Sirènes restent inconnues, mais elles ne devraient pas refaire surface avant plusieurs siècles. La majorité des habitants de Faust les considèrent donc comme définitivement vaincues."
 giga_eawaf.20031.a:0 "Elles ont trouvé plus fort qu'elles."
 giga_eawaf.2004.name:0 "Les Sirènes Renversent Équestria"
 giga_eawaf.2004.desc:0 "L’impensable s’est produit ! Contre toute attente, §YSirenalia§! a triomphé de la nation-continent d’§YÉquestria§!.\n\nUne série d’invasions navales foudroyantes a frappé les côtes sud-est d’Équestria avec une rapidité et une puissance inégalées, des millions de soldats asservis progressant vers le nord en direction de la capitale équestrienne, §YCanterlot§!.\n\nCombinant charges suicides et guerre chimique, les armées des Sirènes ont infligé un choc moral dévastateur aux Équestriens pris au dépourvu. Il n’a pas fallu longtemps avant que Sirenalia n’encercle la capitale et ne prenne le contrôle des principaux centres industriels et démographiques d’Équestria.\n\nAvec la chute de Canterlot, les Sirènes ont asservi les plus puissants protecteurs d’Équestria et utilisé leur magie pour bannir les esprits des deux §YAlicornes§! régnantes dans §YHelios§! et §YSelene§!. Elles ont ensuite projeté les Piliers d'Équestria dans les profondeurs de l'Immaterium, garantissant ainsi leur domination totale sur Équestria et ses habitants.\n\nGrâce à la chute de la plus grande puissance de Faust, les Sirènes disposent désormais d’une main-d’œuvre et d’une industrie sans précédent. Elles exploitent déjà ces ressources pour lancer des offensives contre les nations du nord d’Équestria, dans le but de sécuriser complètement le continent d’§YEquus§!.\n\nD’après notre poste d’observation, il ne s’agit désormais que d’une question de temps avant que l’influence des Sirènes ne s’étende à l’ensemble de Faust... voire même au-delà."
 giga_eawaf.2004.a:0 "Elles sont d'une efficacité redoutable."
 giga_eawaf.2004.a.tooltip:0 "Si nous avions voulu stopper les Sirènes, il est désormais trop tard. Seule une invasion terrestre directe pourrait les arrêter."
 giga_eawaf.20042.name:0 "Révélations Surnaturelles"
 giga_eawaf.20042.desc:0 "Nos études sur la méthode des Sirènes, ainsi que l’analyse approfondie des cristaux thaumaturgiques hautement atypiques de Faust, ont enfin porté leurs fruits.\n\nEn effet, tout dans ce monde et sa nature semble indiquer l’existence d’une 'force' sous-jacente qui imprègne toute conscience. Les Sirènes semblent activement manipuler cette force pour atteindre leurs objectifs. Nos équipes scientifiques sont impatientes d’explorer plus en profondeur ce phénomène."
 giga_eawaf.20042.a:0 "Fascinant... poursuivez les recherches !"
 giga_eawaf.20042.b:0 "Cela ne vaut pas la peine que nous y consacrions plus de temps."
 giga_eawaf.20041.name:0 "Équestria Anéantit les Sirènes"
 giga_eawaf.20041.desc:0 "Comme beaucoup l’avaient prévu, l’invasion des Sirènes sur §YEquestria§! s’est avérée être un désastre total. Bien que l’attaque ait d’abord été couronnée de succès, Equestria a rapidement mobilisé ses vastes réserves de main-d’œuvre, utilisant cette supériorité pour d’abord stopper puis repousser les assauts de Sirenalia sur Equus.\n\nS’ensuivit un gigantesque assaut amphibie en plusieurs vagues sur les terres centrales de Sirenalia. Bien que les Sirènes aient opposé une résistance acharnée, elles furent finalement submergées par la puissance industrielle et militaire écrasante d’Equestria.\n\nAprès la prise complète du territoire de Sirenalia, les Alicornes régnantes d’Equestria réussirent à capturer les Sirènes alors qu’elles tentaient de fuir. Pour s’assurer que jamais plus Sirenalia ne ressurgisse, les Piliers d’Equestria, unis aux Alicornes, concentrèrent leurs pouvoirs pour sceller les âmes mêmes des Sirènes au plus profond de l’Immaterium, où elles devraient rester emprisonnées pour plusieurs millénaires.\n\nAvec la défaite de Sirenalia et la disparition de ses dirigeantes hors de la réalité, les ambitions de domination des Sirènes ont été définitivement anéanties."
 giga_eawaf.20041.a:0 "Il y a donc encore de l’espoir pour Faust."
 giga_eawaf.2005.name:0 "Les Sirènes Soumettent Faust"
 giga_eawaf.2005.desc:0 "Avec la chute de §YEquestria§! aux mains des Sirènes, il n’était qu’une question de temps avant que le reste de Faust ne suive. Malgré des tentatives désespérées d’unification des autres nations pour contrer leur ascension, ces efforts sont arrivés trop tard.\n\nAinsi, après plusieurs années de conflits intenses, les Sirènes ont enfin étendu l’influence de §YSirenalia§! à l’ensemble de Faust. Sur toute la surface de la planète, plus de deux milliards de sapients sont désormais soumis à leur envoûtement, contraints de travailler sans relâche pour alimenter l’essor industriel de Sirenalia.\n\nAvec le monde entier sous leur contrôle, il semble évident que les Sirènes nourrissent à présent l’ambition de s’étendre vers les étoiles. Cependant, les moyens qu’elles pourraient employer pour y parvenir restent flous. En dépit de leurs puissantes capacités magiques, Sirenalia est actuellement complètement dépassée par la moindre civilisation interstellaire, et toute tentative d’expansion dans l’espace serait probablement confrontée à une riposte d’une ampleur insurmontable.\n\nPour l’instant, notre poste d’observation continuera de surveiller les activités des Sirènes et informera immédiatement notre gouvernement et nos forces armées si Sirenalia entreprend des préparatifs pour conquérir l’espace."
 giga_eawaf.2005.a:0 "Nous les écraserons s'ils tentent quoi que ce soit."
 giga_eawaf.20051.name:0 "Le Secret des Sirènes ?"
 giga_eawaf.20051.desc:0 "Nos opérations secrètes visant à renforcer les Sirènes nous ont permis d'acquérir des informations précieuses sur les mécanismes internes de leur sortilège et sur la manière dont les cristaux thaumaturgiques de Faust étaient exploités par Sirenalia pour amplifier leur envoûtement à travers le monde.\n\nNos scientifiques sont désormais convaincus qu'en utilisant certains échantillons de ces cristaux, récupérés dans la ceinture d'astéroïdes locale, ils pourraient être en mesure de reproduire ces effets, bien que sur une échelle plus réduite et avec une efficacité moindre. Une telle découverte pourrait avoir des applications... intéressantes au sein de notre gouvernement et de notre société."
 giga_eawaf.20051.a:0 "Nous devons approfondir leur méthode."
 giga_eawaf.20051.b:0 "C'est bien trop dangereux."
 giga_eawaf.20061.name:0 "Surtension Thaumaturgique"
 giga_eawaf.20061.desc:0 "Les instruments de notre station en orbite autour de Faust se sont soudainement affolés. Un pic d'énergie d'une intensité phénoménale commence à se manifester à la surface de Faust, apparemment centré autour de la capitale de Sirenalia.\n\nIl semblerait que les Sirènes soient en train de rassembler l’ensemble des cristaux thaumaturgiques de Faust afin de lancer une sorte d’incantation gigantesque. D’après nos relevés, l’énergie contenue dans ces cristaux serait suffisante pour générer un champ thaumaturgique s’étendant non seulement à la surface de Faust, mais également à l’ensemble de son système planétaire local.\n\nNous ignorons totalement quels pourraient être les effets de ce 'sort', mais tout se déroule bien trop rapidement pour que nous puissions intervenir. Nos scientifiques nous exhortent donc à §Revacuer tous les actifs de valeur du système de Faust§! avant que la surcharge énergétique n’atteigne son apogée, estimée à environ §Y3 mois§!."
 giga_eawaf.20061.a:0 "Ce n'est pas bon signe."
 giga_eawaf.20071.name:0 "Faust Englouti dans le Suaire Éthéré"
 giga_eawaf.20071.desc:0 "Alors que la surcharge énergétique atteint son intensité maximale, Faust et l’ensemble de son système planétaire disparaissent tout simplement.\n\nLorsque le sort final des Sirènes atteint son apogée, une gigantesque masse d’énergie éthérée émerge de Faust, probablement libérée par l'activation massive des cristaux thaumaturgiques. Ce champ s’étend d’abord sur Sirenalia, puis sur Faust tout entier, avant d’engloutir le système en entier.\n\nEn quelques heures à peine, le champ s’étend à tout le voisinage planétaire de Faust, absorbant tout ce qui se trouve à proximité, qu’il s’agisse de vaisseaux, de planètes ou de simples débris spatiaux.\n\nAu bout d’une journée environ, le champ, désormais surnommé le §YSuaire Éthéré§!, se stabilise, perturbant les hyperlignes et rendant les autres formes de voyage FTL purement et simplement impossibles. Les vaisseaux et transmissions envoyés pour enquêter sur le système disparaissent purement et simplement, sans laisser de trace. La conclusion est évidente : pour l’instant, le système de Faust a été retiré de la galaxie, manifestement en raison des machinations des Sirènes.\n\nBien qu'il soit incertain que ce suaire finisse par se dissiper, de légères variations dans ses signatures énergétiques semblent indiquer qu'il pourrait disparaître au bout d’environ §Yun siècle§!. Toutefois, cette estimation repose davantage sur des suppositions que sur des certitudes."
 giga_eawaf.20071.a:0 "C'est... étrange. On dirait bien qu'elles ont disparu."
 giga_eawaf.20071.a.tooltip:0 "§YFaust§! est désormais englobé dans le §YSuaire Éthéré§! et y restera supposément pendant au moins §Yun siècle§!. Toute tentative d'intrusion dans le système est vouée à un échec catastrophique.\n§RIl serait sage d’éviter les systèmes directement adjacents au suaire...§!"
 giga_eawaf.20072.name:0 "Le Système de Faust Englouti dans le Suaire Éthéré"
 giga_eawaf.20072.desc:0 "Le mystérieux système de §YFaust§!, connu pour héberger une étoile miniature en orbite autour d’un monde tellurique, a soudainement disparu de tous les capteurs de la galaxie.\n\nDes investigations plus poussées ont révélé que l’ensemble du système - y compris Faust lui-même et tout vaisseau qui s’y trouvait - a été englouti dans un colossal §YSuaire Éthéré§!, empêchant toute observation ou intrusion.\n\nD’après certains rapports épars, ce phénomène serait le fruit d’un 'sort' lancé par §YSirenalia§!, une superpuissance planétaire ayant récemment réussi à unifier Faust grâce à un ensorcellement mental de masse après plusieurs guerres dévastatrices.\n\nL'objectif exact de ce suaire demeure inconnu, mais des fluctuations dans ses signatures énergétiques laissent penser qu'il pourrait commencer à se dissiper au bout d’environ §Yun siècle§!. Toutefois, il est impossible de dire s’il s’agit d’une véritable prédiction ou d’une simple conjecture.\n\nPour l’heure, le système entier a été retiré de la galaxie, et il serait prudent d’exercer une extrême vigilance à proximité de ce champ mystérieux."
 giga_eawaf.20072.a:0 "C'est vraiment étrange."
 giga_eawaf.30001.name:0 "Fluctuations du Suaire Éthéré"
 giga_eawaf.30001.desc:0 "Depuis quelques mois, les relevés énergétiques thaumaturgiques en provenance du §YSuaire Éthéré§!, qui étaient jusque-là restés stables après la disparition de §YFaust§!, ont commencé à fluctuer sans raison apparente.\n\nBien que nous ignorions encore ce qui pourrait être en train de se passer à l’intérieur du suaire, ces variations suggèrent clairement une activité en cours de la part des §YSirènes§!, qui avaient conquis le système par la force des armes il y a plusieurs années.\n\nPlus inquiétant encore, l’analyse des fluctuations suggère que le Suaire Éthéré pourrait commencer à se désagréger d’ici §Ycinq ans§!."
 giga_eawaf.30001.a:0 "Nous devons nous attendre au pire."
 giga_eawaf.30002.name:0 "Sirenalia - §HAdagio Dazzle§!"
 giga_eawaf.30002.desc:0 "Mortels ! Je n’ai jamais été du genre à faire durer les avant-premières, alors passons directement à l’acte principal cette fois-ci. Cette galaxie que vous croyez être la vôtre est en réalité nôtre par droit, et nous avons bien l’intention de nous l’approprier sous peu. Vous pouvez toujours choisir de vous soumettre dès maintenant, mais nous savons tous les deux comment ce jeu se joue, n’est-ce pas ? J’ai hâte de voir ce que vous aurez à nous offrir à la fin."
 giga_eawaf.30002.bye:0 "Nous renverrons votre espèce dans les abysses !"
 giga_eawaf.30003.name:0 "Le Retour des Sirènes"
 giga_eawaf.30003.desc:0 "Il est désormais évident que, loin de s'isoler, les Sirènes ont passé leur temps sous le Suaire Éthéré à comploter et à préparer leur retour. Autour de ce qui fut autrefois le monde verdoyant de §YFaust§!, désormais transformé en un vaste enfer psionico-industriel, se dresse une mégastructure ésotérique surnommée le §YShroudsonic Enthraller§!, dont l’objectif est limpide : amplifier la portée du chant de contrôle mental des Sirènes afin de couvrir la §Rgalaxie tout entière§!.\n\nPour ce faire, l’Enthraller génère un puissant §RChamp de Discorde§! centré sur Faust. Près de Faust, au sein de ce qui est désormais connu sous le nom de §RChamp Intérieur§!, le sort est suffisamment puissant pour §Rprendre instantanément le contrôle mental§! de tout vaisseau s’approchant de trop près. Il est donc impératif d’§Réviter§! cette zone à tout prix tant que nous ne disposons pas de contre-mesures adaptées.\n\nÀ une plus grande distance, le Champ perd en intensité mais reste actif dans le §PChamp Extérieur§!, qui s’étend bien au-delà des frontières de Sirenalia et pousse les populations des mondes touchés à éprouver une haine grandissante les unes envers les autres.\n\nPlus inquiétant encore, cette §RDiscorde§! est ce qui alimente les Sirènes, ce qui signifie que plus elles accumulent de §RDiscorde§!, plus le §YShroudsonic Enthraller§! pourra projeter son sort loin... et plus les Sirènes seront nourries. Il va donc sans dire que Sirenalia doit être stoppée avant que l’Enthraller ne déclenche une réaction en chaîne qui conduirait à l’expansion du §RChamp Intérieur§! sur l’ensemble de la galaxie.\n\nComme les mécanismes exacts du 'Champ de Discorde', de l’Enthraller et du sort demeurent encore obscurs, une §YSituation§! a été instaurée afin de suivre l’évolution de notre compréhension des Sirènes."
 giga_eawaf.30003.a:0 "Continuez de les surveiller."
 giga_eawaf.4000.name:0 "Sirenalia"
 giga_eawaf.4000.desc.adagio:0 "Êtes-vous venu offrir votre reddition totale et inconditionnelle ? Non ? Alors pourquoi perdre notre temps ?"
 giga_eawaf.4000.desc.aria:0 "Faites vite. Je n’ai pas toute la journée à gaspiller avec des créatures comme vous."
 giga_eawaf.4000.desc.sonata:0 "Ooooh, je ne crois pas vous avoir déjà vu ! Ou peut-être que si ? Il y a tellement de nouveaux visages étranges à retenir, vous savez !"
 giga_eawaf.4000.bye:0 "Éteindre l'écran."
 giga_eawaf.6000.name:0 "Les Défenses Extérieures de l’Enthraller Brisées !"
 giga_eawaf.6000.desc:0 "Nos courageuses flottes sont parvenues à détruire les emplacements d’armes extérieures de la redoutable §YShroudsonic Enthraller§! des Sirènes.\n\nPar conséquent, la perte de ces points de défense critiques a exposé le §YNoyau Abyssal§! de l’Enthraller, une structure gigantesque enroulée autour de Faust et alimentant tout l’appareil. Il est impératif de le détruire au plus vite si nous voulons enfin mettre un terme à la folie des Sirènes."
 giga_eawaf.6000.a:0 "Assaut immédiat !"
 giga_eawaf.6001.name:0 "Shroudsonic Enthraller Détruit !"
 giga_eawaf.6001.desc:0 "Avec la destruction du §YNoyau Abyssal§! de l'Enthraller, qui servait de 'condensateur' amplifiant le sort des Sirènes à l’échelle galactique, l’ancienne mégastructure s’est rapidement effondrée en un immense champ de débris de la taille d’une planète, entourant Faust lui-même.\n\nPeu après, le §YChamp de Discorde§! s’est complètement désintégré, entraînant la perte de contrôle des Sirènes sur la plupart de leurs territoires situés en dehors de Faust. Acculées, elles se sont maintenant retranchées sur la planète en vue d’un dernier combat désespéré."
 giga_eawaf.6001.a:0 "Elles n'ont plus aucun endroit où fuir."
 giga_eawaf.60022.name:0 "Le Dernier Combat des Sirènes"
 giga_eawaf.60022.desc:0 "Alors que nos armées posent pied sur §YFaust§!, les Sirènes, acculées, lancent des millions de Faustiens contrôlés mentalement contre nos légions !\n\nAu grand désarroi de nos commandants, des nations entières de thralls, souvent sans équipement ni expérience militaire, se jettent dans une tentative désespérée de ralentir notre avancée inévitable.\n\nIl est clair que, si rien n’est fait, les Sirènes comptent sacrifier l’intégralité de la population innocente de Faust — et donc la majeure partie de la valeur de la planète — simplement pour gagner un peu plus de temps…"
 giga_eawaf.60022.a:0 "Nous devons arrêter cela immédiatement ! Recherchez un moyen de libérer les Faustiens."
 giga_eawaf.60022.b:0 "Que ce monde soit brisé sous notre puissance, s’il en est ainsi."
 giga_eawaf.60024.name:0 "La Destruction de Faust"
 giga_eawaf.60024.desc:0 "Grâce à une force écrasante, le monde de §YFaust§! a été totalement détruit, emportant avec lui ses maîtres siréniens. Bien que cela ait causé d’innombrables pertes, cela assure enfin la fin définitive de la folie des Sirènes."
 giga_eawaf.60024.a:0 "C’était pour le bien supérieur."
 giga_eawaf.60025.name:0 "La Chute de Faust"
 giga_eawaf.60025.desc:0 "Malgré les dernières tentatives des Sirènes et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous notre puissance.\n\nOu du moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population planétaire a péri dans les combats, laissant des continents entiers sans vie intelligente et couverts des vestiges lugubres de gigantesques villes et complexes industriels que nos forces commencent à occuper. À peine un pour cent des anciens habitants a survécu lorsque le sort des Sirènes s’est dissipé en raison de la réduction rapide de la population faustienne.\n\nQuant aux §YSirènes§! elles-mêmes, elles ont visiblement fui dans les profondeurs de la §YFosse de Mareiana§!, d’où elles étaient sorties, mais nos commandants assurent que les forces planétaires organisent déjà une expédition dans les abysses océaniques afin d’éliminer ces créatures une bonne fois pour toutes."
 giga_eawaf.60025.a:0 "Victoire… mais à quel prix ?"
 giga_eawaf.60251.name:0 "La Fin des Sirènes"
 giga_eawaf.60251.desc:0 "La fin des Sirènes fut, faute d’un meilleur terme, particulièrement anticlimatique. Après la descente de notre expédition dans la Fosse de Mareiana, ses membres ont rapidement localisé les Sirènes, cachées dans d’anciennes formations géologiques au fond de l’océan.\n\nBien sûr, elles ont tenté de résister en utilisant leur magie, mais, totalement privées d'une population nourrissant leur pouvoir et impuissantes face à notre technologie de Désenchantement, leurs tentatives se sont avérées futiles. Ce qui suivit ne fut rien de plus que la vaporisation rapide des trois Sirènes sous un feu nourri d’armes à haute énergie.\n\nCependant, chose étrange, les cristaux rouges qui étaient jadis incrustés dans les Sirènes et qui semblaient être la source de leur pouvoir ont, d’une manière ou d’une autre, survécu à cette destruction totale. Nos soldats les ont récupérés et placés dans des conteneurs thaumaturgiquement sécurisés pour une analyse plus approfondie."
 giga_eawaf.60251.a:0 "Ces cristaux... pourraient nous être utiles."
 giga_eawaf.60251.b:0 "Jetez-les dans le soleil, détruisez-les !"
 giga_eawaf.60026.name:0 "La Chute de Faust"
 giga_eawaf.60026.desc:0 "Malgré les ultimes tentatives des Sirènes et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous la puissance de §Y[giga_eawaf_sirens_killer_country.GetName]§!.\n\nDu moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population planétaire a péri dans les combats, laissant des continents entiers dépourvus de vie intelligente et recouverts des restes lugubres de gigantesques villes et complexes industriels. À peine un pour cent des anciens habitants a survécu à la dissolution du sort des Sirènes, conséquence directe de l’effondrement démographique de Faust.\n\nQuant aux §YSirènes§! elles-mêmes, elles ont visiblement fui dans les profondeurs de la §YFosse de Mareiana§!, d’où elles étaient sorties, bien que tout porte à croire que §Y[giga_eawaf_sirens_killer_country.GetName]§! prendra rapidement les mesures nécessaires pour les éliminer."
 giga_eawaf.60026.a:0 "Une victoire bien sombre."
 giga_eawaf.60027.name:0 "Visions Miroir"
 giga_eawaf.60027.desc:0 "Notre département scientifique rapporte qu’après des analyses orbitales de Faust, couplées à des expéditions audacieuses à la surface, il aurait trouvé un moyen de neutraliser les Sirènes sans avoir à sacrifier l'intégralité de la population faustienne.\n\nEn effet, si nous savions déjà que Faust se trouvait dans une région de l’espace où la 'réalité' est plus faible, il s’avère désormais qu’un point précis à la surface, situé près de ce que les natifs appelaient autrefois §YCanterlot§!, est en étroite proximité dimensionnelle avec un 'royaume miroir'.\n\nLa cause de ce lien ainsi que la nature de ce royaume restent inconnues, mais nos scientifiques théorisent qu’il serait possible, en combinant des échantillons des cristaux de contrôle mental utilisés par les Sirènes avec une puissante décharge d’énergie orbitale dirigée sur cette zone, de 'briser' le tissu de la réalité et de créer un 'vortex dimensionnel' temporaire. Ce vortex pourrait alors être exploité pour 'bannir' les Sirènes vers cette dimension alternative.\n\nCe plan nécessite toutefois une exécution rapide et une connaissance parfaite des phénomènes impliqués par un 'sacrifié' chargé de plonger dans le vortex avec des cristaux finement accordés afin de déclencher la réaction thaumaturgique en chaîne nécessaire pour attirer et exiler définitivement les Sirènes.\n\nÀ ce jour, seul §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! semble être en mesure d’accomplir un tel exploit."
 giga_eawaf.60027.a:0 "Approuvé. Mettez le plan à exécution immédiatement, quel qu’en soit le prix !"
 giga_eawaf.60027.b:0 "Refusé. Ce monde ne vaut pas le sacrifice de [giga_eawaf_sirens_scientist_sacrifice.GetName]."
 giga_eawaf.60028.name:0 "Les Sirènes Bannies"
 giga_eawaf.60028.desc:0 "Alors que la décharge d'énergie de nos actifs orbitaux frappe la surface de Faust à l'endroit où se situe la faille dimensionnelle, §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! plonge dans la déchirure grandissante du continuum espace-temps, accompagné d'un ensemble de cristaux thaumaturgiques soigneusement calibrés pour imiter ceux incrustés dans les Sirènes elles-mêmes.\n\nComme prévu, cela déclenche un 'enchevêtrement thaumaturgique' qui entraîne les Sirènes, impuissantes, hors de leur cachette sur Faust et les projette directement dans le vortex dimensionnel aux côtés de notre officier, avant que le vortex lui-même ne s'effondre, incapable de persister plus de quelques secondes dans notre réalité.\n\nCe qui suit est l'effondrement total du contrôle des Sirènes sur Faust et la libération définitive de sa population de leur emprise démoniaque, mettant ainsi un terme à leur tactique d'assaut de masse insatiable. Bien que Faust et ses habitants restent marqués par ces événements pour de nombreuses années à venir, les Sirènes ont, enfin, été définitivement éradiquées de notre réalité."
 giga_eawaf.60028.a:0 "Elles ne nous tourmenteront plus jamais."
 giga_eawaf.60029.name:0 "Un Miroir Étrange"
 giga_eawaf.60029.desc:0 "Après l’élimination des Sirènes, nos scientifiques ont mené une enquête approfondie sur §YCanterlot§!, le lieu où la faille dimensionnelle étrange avait été initialement détectée.\n\nIls rapportent avoir découvert un artefact particulier, une sorte de 'miroir de cristal' orné, enfoui profondément sous la surface. Une étude plus poussée a révélé que cet appareil pourrait très probablement être à l'origine de la connexion interdimensionnelle qui nous a permis de bannir les Sirènes hors de notre réalité.\n\nUne activation contrôlée du miroir, suivie d’une exploration prudente menée par des sondes furtives, a révélé un lien vers un §Rroyaume alternatif§! peuplé d'étranges humanoïdes colorés qui semblent pratiquer régulièrement des célébrations musicales rituelles.\n\nBien qu'il soit totalement déconseillé de révéler notre présence à cette dimension, ou d'en retirer quoi que ce soit, par crainte que les Sirènes ne découvrent une voie de retour vers notre réalité, nous pourrions conserver le miroir dans une installation hautement sécurisée, nous permettant ainsi d'étudier ses mystérieux habitants et leurs curieuses traditions musicales."
 giga_eawaf.60029.a:0 "Curieux. Conservons-le."
 giga_eawaf.60029.b:0 "Bien trop dangereux ! Scellez-le définitivement."
 giga_eawaf.60032.name:0 "Sirenalia Anéantie"
 giga_eawaf.60032.desc:0 "Suite à la disparition définitive de §HAdagio Dazzle§!, §MAria Blaze§! et §BSonata Dusk§! aux mains de §Y[giga_eawaf_sirens_killer_country.GetName]§!, les redoutables §YSirènes§! qui menaçaient de soumettre Faust et le reste de la galaxie à leur contrôle mental depuis plusieurs décennies, leur empire de §YSirenalia§! a été relégué aux oubliettes de l'histoire.\n\nTous les vaisseaux et planètes encore sous l'influence des Sirènes se sont soit auto-détruits, soit libérés, soit retournés à leurs anciens propriétaires. Ainsi, la communauté galactique pousse un soupir de soulagement collectif alors que le plan insensé des Sirènes visant à instaurer une 'unité galactique éternelle' a enfin été anéanti pour de bon."
 giga_eawaf.60032.a:0 "Le chœur des Sirènes s'est enfin tu."
 giga_eawaf.5001.name:0 "Prototype de Désenvoûteur Conçu"
 giga_eawaf.5001.desc:0 "Nos chercheurs rapportent que nos efforts pour comprendre et contrer les Sirènes commencent enfin à porter leurs fruits, même si ce n'est que légèrement.\n\nBien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, des études préliminaires suggèrent que l'émission de décharges d'énergie ciblées à des fréquences spécifiques dans le quasi-espace pourrait atténuer certains effets du Champ de Discorde, au prix d'une augmentation drastique des coûts d'entretien des vaisseaux équipés de ces mécanismes et d'une entrave à leur mobilité lorsqu'ils sont activés.\n\nBaptisés §YDésenvoûteurs§!, ces dispositifs avancés semblent constituer une option viable pour contrer les Sirènes et feront l'objet de recherches approfondies."
 giga_eawaf.5001.a:0 "Il y a de l'espoir."
 giga_eawaf.5001.a.tooltip:0 "Nous devrons rechercher la technologie du Désenvoûteur afin de progresser dans la situation §YContrer les Sirènes§!. En attendant, notre approche a été définie sur §YPas d'Études sur les Sirènes§! afin d'éviter un gaspillage de ressources."
 giga_eawaf.5002.name:0 "Désenvoûteur Réglé Conçu"
 giga_eawaf.5002.desc:0 "De nouvelles avancées dans la recherche anti-Sirènes ont permis de développer des modèles améliorés de Désenvoûteurs, offrant une efficacité accrue.\n\nBien qu'ils ne soient toujours pas assez puissants pour repousser le §RChamp Intérieur§!, ces dispositifs devraient permettre à nos vaisseaux d'opérer dans le §PChamp Extérieur§! sans subir de pénalités de vitesse."
 giga_eawaf.5002.a:0 "Mettez-vous au travail immédiatement."
 giga_eawaf.5003.name:0 "Désenvoûteur Symphonique Conçu"
 giga_eawaf.5003.desc:0 "Nos équipes scientifiques rapportent que les récentes avancées dans la technologie des Désenvoûteurs devraient permettre à ces modèles améliorés de repousser non seulement le §PChamp Extérieur§!, mais aussi d'être suffisamment efficaces pour contrer même le §RChamp Intérieur§!, permettant ainsi à nos vaisseaux d'opérer en plein cœur du territoire des Sirènes, bien qu'à une vitesse fortement réduite.\n\nCela signifie que, à condition de posséder une puissance de feu suffisante, il devrait désormais être possible de mettre un terme définitif à la folie des Sirènes."
 giga_eawaf.5003.a:0 "Excellent."
 giga_eawaf.5004.name:0 "Conception du Désenchantement Euphoniques"
 giga_eawaf.5004.desc:0 "D'autres améliorations de nos Désenchantements existants ont permis la conception du §YDésenchantement Euphonique§! - l'aboutissement ultime de la technologie anti-Sirènes. Capable d'opérer n'importe où dans le Champ de Discorde sans impact sur la vitesse des vaisseaux, il devrait permettre à nos flottes de frapper les Sirènes à tout moment et en tout lieu."
 giga_eawaf.5004.a:0 "Délicieux ! Elles seront bientôt impuissantes."
 giga_eawaf.1104.name:0 "Armement Thaumaturgique"
 giga_eawaf.1104.desc:0 "L'§YArmement Thaumaturgique§! que nous avons réussi à rétroconcevoir à partir des Sirènes possède la particularité d'être aussi puissant que l'énergie que nous pouvons y injecter en toute sécurité. Ainsi, nous avons conçu une nouvelle technologie répétable visant à augmenter continuellement la puissance de ces armes."
 giga_eawaf.1104.a:0 "Intriguant."
 giga_tech_eawaf_psifusion:0 "Fusion Psicatalysée Industrielle"
 giga_tech_eawaf_psifusion_desc:0 "Reproduire les mécanismes ésotériques du noyau infernal d'Helios dans un environnement contrôlé et à l'échelle industrielle permettrait une production d'énergie colossale et une facilitation de la création d'éléments lourds."
 giga_tech_eawaf_weapons_repeatable:0 "Armement Thaumaturgique Surchargé"
 giga_tech_eawaf_weapons_repeatable_title:0 "Dégâts des armes thaumaturgiques : §G+25%§! Entretien des vaisseaux équipés d'armes thaumaturgiques : §R+12.5%§!"
 giga_tech_eawaf_weapons_repeatable_desc:0 "§RPour des raisons techniques, la pénalité d'entretien s'applique à l'ensemble du vaisseau et non uniquement aux composants thaumaturgiques ! Il est donc recommandé de remplir entièrement le vaisseau avec ces armes pour en tirer le meilleur parti.§!"
 giga_tech_eawaf_sirens_secret:0 "Envoûtement Thaumaturgique"
 giga_tech_eawaf_sirens_secret_desc:0 "Étudier comment les Sirènes déploient leur sort d'envoûtement pourrait avoir de grandes applications pour notre gouvernement et notre société."
 giga_tech_eawaf_sirens_strike_craft:0 "$GIGA_EAWAF_STRIKE_CRAFT$"
 giga_tech_eawaf_sirens_strike_craft_desc:0 "$GIGA_EAWAF_STRIKE_CRAFT_DESC$"
 giga_tech_eawaf_sirens_autocannon:0 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON$"
 giga_tech_eawaf_sirens_autocannon_desc:0 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC$"
 giga_tech_eawaf_sirens_artillery:0 "$GIGA_EAWAF_CRYSTAL_ARTILLERY$"
 giga_tech_eawaf_sirens_artillery_desc:0 "$GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC$"
 giga_tech_eawaf_sirens_missile:0 "$GIGA_EAWAF_PSIONIC_CHARGE$"
 giga_tech_eawaf_sirens_missile_desc:0 "$GIGA_EAWAF_PSIONIC_CHARGE_DESC$"
 giga_tech_eawaf_sirens_impactor:0 "$GIGA_EAWAF_CRYSTAL_IMPACTOR$"
 giga_tech_eawaf_sirens_impactor_desc:0 "$GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC$"
 giga_tech_eawaf_sirens_voidbeam:0 "$GIGA_EAWAF_GRAND_VOID_BEAM$"
 giga_tech_eawaf_sirens_voidbeam_desc:0 "$GIGA_EAWAF_GRAND_VOID_BEAM_DESC$"
 giga_tech_eawaf_disenchanter_1:0 "Contre-mesures Sirènes Initiales"
 giga_tech_eawaf_disenchanter_1_desc:0 "Bien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, les premières études suggèrent que des décharges focalisées d'énergie à des fréquences spécifiques dans le quasi-espace pourraient atténuer certains effets du Champ de Discorde, au prix d'une augmentation drastique de l'entretien des vaisseaux équipés de ces dispositifs."
 giga_tech_eawaf_disenchanter_2:0 "Réglage du Désenchantement"
 giga_tech_eawaf_disenchanter_2_desc:0 "Un réglage plus précis des mécanismes de Désenchantement permet une neutralisation plus efficace des effets néfastes du Champ de Discorde."
 giga_tech_eawaf_disenchanter_3:0 "Symphonies Subpsioniques"
 giga_tech_eawaf_disenchanter_3_desc:0 "Les percées dans notre compréhension du Champ de Discorde nous permettent désormais d'émettre directement des contre-mélodies au chant des Sirènes dans l'Immaterium lui-même, ce qui permet de repousser même les effets d'envoûtement du §RChamp Intérieur§!."
 giga_tech_eawaf_disenchanter_3_effects:0 "Permet la capture des §YBases Stellaires§! et des §YPlanètes§! dans le §RChamp Intérieur§!."
 giga_tech_eawaf_disenchanter_4:0 "Dissipation Euphonique de la Discorde"
 giga_tech_eawaf_disenchanter_4_desc:0 "Notre compréhension du chant des Sirènes a désormais atteint un point où nous pouvons confortablement annuler leur champ d'envoûtement à toute échelle, bien que cela implique un coût énergétique non négligeable."
 building_giga_eawaf_psifusion_reactor:0 "Réacteur de Fusion Psicatalysée"
 building_giga_eawaf_psifusion_reactor_desc:0 "Ce complexe de réacteurs gigantesques abrite une 'étoile psionique' artificielle alimentée par une faille du Suaire. Non seulement il produit des quantités d'énergie colossales, mais il peut aussi être utilisé pour créer des éléments lourds et améliorer l'efficacité de la psionique sur l'ensemble de la planète."
 building_giga_eawaf_sirens_capital:0 "Panopticon Planétaire"
 building_giga_eawaf_sirens_capital_desc:0 "Un complexe colossal conçu pour relayer la volonté des Sirènes à travers ce monde afin d'assurer une efficacité sociétale et industrielle maximale."
 building_giga_eawaf_disenchanter_building_1:0 "Champ de Désenchantement Prototype"
 building_giga_eawaf_disenchanter_building_1_desc:0 "Un Désenchantement surdimensionné capable de neutraliser certains effets du Champ de Discorde sur ce monde. Réduit de moitié les pénalités du §PChamp Extérieur§!."
 building_giga_eawaf_disenchanter_building_2:0 "Champ de Désenchantement Harmonisé"
 building_giga_eawaf_disenchanter_building_2_desc:0 "Ce Champ de Désenchantement perfectionné est non seulement capable de réduire drastiquement les effets du Champ de Discorde sur ce monde, mais aussi de le protéger contre l'emprise du Champ Intérieur. Réduit d'un quart les effets du §PChamp Extérieur§! et protège contre le §RChamp Intérieur§!."
 job_giga_eawaf_sirens_toiler:0 "Serviteur des Sirènes"
 job_giga_eawaf_sirens_toiler_plural:0 "Serviteurs des Sirènes"
 job_giga_eawaf_sirens_toiler_desc:1 "Les Serviteurs des Sirènes travaillent jour et nuit pour produire les ressources nécessaires à l'alimentation de la machine de guerre des Sirènes."
 mod_job_giga_eawaf_sirens_toiler_add:0 "$job_giga_eawaf_sirens_toiler$ Emplois"
 mod_job_giga_eawaf_sirens_toiler_per_pop:0 "$job_giga_eawaf_sirens_toiler$ Emplois par Pop"
 job_giga_eawaf_sirens_naval:0 "Opérateur de Flotte des Sirènes"
 job_giga_eawaf_sirens_naval_plural:0 "Opérateurs de Flotte des Sirènes"
 job_giga_eawaf_sirens_naval_desc:1 "Les Opérateurs de Flotte des Sirènes sont chargés de gérer la logistique des armadas spatiales des Sirènes."
 mod_job_giga_eawaf_sirens_naval_add:0 "$job_giga_eawaf_sirens_toiler$ Emplois"
 mod_job_giga_eawaf_sirens_naval_per_pop:0 "$job_giga_eawaf_sirens_naval$ Emplois par Pop"
 job_giga_eawaf_sirens_scientist:0 "Sciento-Économiste des Sirènes"
 job_giga_eawaf_sirens_scientist_plural:0 "Sciento-Économistes des Sirènes"
 job_giga_eawaf_sirens_scientist_desc:1 "Les Sciento-Économistes représentent l'élite de la société des Sirènes. Composés des rares individus autorisés à conserver leur libre arbitre, leur rôle est d'améliorer l'efficacité de la société des Sirènes et de repousser sans cesse les limites de la science."
 mod_job_giga_eawaf_sirens_scientist_add:0 "$job_giga_eawaf_sirens_toiler$ Emplois"
 mod_job_giga_eawaf_sirens_scientist_per_pop:0 "$job_giga_eawaf_sirens_scientist$ Emplois par Pop"
 job_giga_eawaf_sirens_strifer:0 "Agent de Discorde des Sirènes"
 job_giga_eawaf_sirens_strifer_plural:0 "Agents de Discorde des Sirènes"
 job_giga_eawaf_sirens_strifer_desc:1 "Les besoins des Sirènes exigent que certains individus restent dans un état perpétuel, mais contrôlé, de colère et de conflit les uns avec les autres, afin de générer un précieux flux de Discorde même au sein du Champ Intérieur parfaitement régulé."
 mod_job_giga_eawaf_sirens_strifer_add:0 "$job_giga_eawaf_sirens_strifer$ Emplois"
 mod_job_giga_eawaf_sirens_strifer_per_pop:0 "$job_giga_eawaf_sirens_strifer$ Emplois par Pop"
 situation_eawaf_sirens_takeover:0 "La Prise de Contrôle des Sirènes"
 situation_eawaf_sirens_takeover_desc:0 "Un trio de 'Sirènes' dotées de capacités de contrôle mental cherchent à imposer leur domination sur Faust. Elles semblent déterminées à user de tous les moyens nécessaires pour mener à bien cette entreprise ambitieuse. Il est probablement dans notre intérêt de suivre cette situation de près."
 situation_eawaf_sirens_takeover_type:0 "La Prise de Contrôle des Sirènes"
 situation_eawaf_sirens_takeover_monthly_change_tooltip:0 ""
 approach_giga_eawaf_stop_sirens:0 "Arrêter les Sirènes"
 approach_giga_eawaf_stop_sirens_tooltip:0 "Nous ferons tout notre possible pour stopper les Sirènes sans être détectés. Assassinats ciblés de leurs atouts clés, sabotage des lignes d'approvisionnement et soutien aux mouvements anti-Sirènes devraient freiner leur progression jusqu'à ce qu'elles soient submergées par leurs ennemis.\nCela augmentera les chances que les Sirènes tombent face à leurs adversaires à chaque étape de leur conquête.\n§RNous ne pourrons plus revenir en arrière une fois cette action engagée.§!"
 approach_giga_eawaf_do_nothing:0 "Ne Rien Faire"
 approach_giga_eawaf_do_nothing_tooltip:0 "Observons simplement l'évolution des événements. Nous avons des préoccupations plus urgentes.\n§YNous pourrons toujours changer d'avis plus tard.§!"
 approach_giga_eawaf_study_sirens:0 "Étudier les Sirènes"
 approach_giga_eawaf_study_sirens_tooltip:0 "Nous allons investir des ressources et du personnel pour étudier les Sirènes et leurs méthodes de contrôle mental. Nous pourrions ainsi apprendre énormément sur la véritable nature de la conscience et de l'esprit.\n§YNous pourrons toujours changer d'avis plus tard.§!"
 approach_giga_eawaf_bolster_sirens:0 "Soutenir les Sirènes"
 approach_giga_eawaf_bolster_sirens_tooltip:0 "Nous allons discrètement aider les Sirènes dans leur prise de contrôle. Cela nous permettra d'observer leur plein potentiel en action et d'obtenir une mine de données précieuses.\n§GNous pourrons toujours changer d'avis plus tard, mais plus nous les soutiendrons, plus nous en apprendrons.§!"
 situation_eawaf_sirens_takeover_effects:0 "Les Sirènes progresseront dans leur conquête de Faust."
 giga_eawaf_sirens_too_strong_tooltip:0 "Les Sirènes sont devenues trop puissantes pour que nous puissions les contrer discrètement. Nous devons soit les laisser poursuivre leur ascension, soit intervenir directement via une invasion terrestre de Faust, qui pourrait s'avérer périlleuse."
 situation_eawaf_sirens_understanding:0 "Contrer les Sirènes"
 situation_eawaf_sirens_understanding_desc:0 "Les Sirènes tentent de propager une mélodie ésotérique de contrôle mental à travers toute la galaxie. Nous devons trouver un moyen de contrer ce phénomène avant que nous ne tombions tous sous leur emprise démoniaque. Le coût en §YRecherche§! et en §YUnité§! pour neutraliser les Sirènes évoluera en fonction de la §MPuissance§! du Champ. Si nous ne pouvons pas nous le permettre, nous reviendrons à §YAucune Étude des Sirènes§!."
 situation_eawaf_sirens_understanding_type:0 "Contrer les Sirènes"
 situation_eawaf_sirens_understanding_monthly_change_tooltip:0 ""
 approach_giga_eawaf_sirens_research_1:0 "Aucune Étude des Sirènes"
 approach_giga_eawaf_sirens_research_1_tooltip:0 "Cela s'améliorera."
 approach_giga_eawaf_sirens_research_2:0 "Études Anti-Sirènes Limitées"
 approach_giga_eawaf_sirens_research_2_tooltip:0 "Les Sirènes ne sont pas une priorité, mais nous allons tout de même investir un peu, juste au cas où."
 approach_giga_eawaf_sirens_research_3:0 "Études Anti-Sirènes Approfondies"
 approach_giga_eawaf_sirens_research_3_tooltip:0 "Nous devons stopper les Sirènes, alors investissons des ressources suffisantes pour y parvenir."
 approach_giga_eawaf_sirens_research_4:0 "Études Anti-Sirènes Massives"
 approach_giga_eawaf_sirens_research_4_tooltip:0 "Les Sirènes doivent être arrêtées à tout prix ! Investissons tout ce que nous pouvons pour les contrer !"
 situation_eawaf_sirens_disenchanters_effect:0 "Nous améliorerons nos contre-mesures contre les Sirènes."
 giga_eawaf_has_sirens_secret:0 "Nos études précédentes sur les Sirènes renforcent nos contre-mesures !"
 giga_eawaf_disenchanter_research_cost_1:0 "Études Anti-Sirènes Limitées"
 giga_eawaf_disenchanter_research_cost_1_desc:0 "Les Sirènes ne sont pas une priorité, mais nous allons tout de même investir un peu, juste au cas où."
 giga_eawaf_disenchanter_research_cost_2:0 "Études Anti-Sirènes Approfondies"
 giga_eawaf_disenchanter_research_cost_2_desc:0 "Nous devons stopper les Sirènes, alors investissons des ressources suffisantes pour y parvenir."
 giga_eawaf_disenchanter_research_cost_3:0 "Études Anti-Sirènes Massives"
 giga_eawaf_disenchanter_research_cost_3_desc:0 "Les Sirènes doivent être arrêtées à tout prix ! Investissons tout ce que nous pouvons pour les contrer !"
 sc_giga_eawaf_faust_shroud:0 "Suaire Éthéré"
 giga_eawaf_sirens_megaphone_1:0 "Enthralleur Shroudsonique"
 giga_eawaf_sirens_megaphone_1_DESC:0 "Une mégastructure ésotérique capable d’amplifier et de relayer une puissante 'mélodie' de contrôle mental à travers le Suaire afin d’asservir des systèmes entiers à des distances interstellaires."
 anti_sirens_shield:0 "Grand Rempart Symphonique"
 anti_sirens_shield_DESC:0 "Un Désenchantement surdimensionné protégeant entièrement ce système contre tous les effets du Champ de Discorde des Sirènes. Annule complètement le §PChamp Extérieur§! et le §RChamp Intérieur§!."
 anti_sirens_shield_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_miscellaneous$\nProtège entièrement un système contre le §YChamp de Discorde§!.\n§LUn Désenchantement surdimensionné protégeant ce système contre tous les effets du Champ de Discorde des Sirènes.§!"
 anti_sirens_shield_dismantle:0 "Démanteler le Rempart"
 anti_sirens_shield_dismantle_DESC:0 "Nous n’avons plus besoin de ce rempart. Démantelons-le."
 STRIFE_FIELD_ABOUT_TO_SHRINK_TITLE:0 "Le Champ de Discorde est sur le point de se rétracter"
 STRIFE_FIELD_ABOUT_TO_SHRINK_DESC:0 "Le §RChamp de Discorde§! ne dispose pas d’assez de Discorde pour maintenir sa taille actuelle. Son §MPortée§! diminuera de §Y1§! dans §Y6 mois§!."
 STRIFE_FIELD_SHRINKING_TITLE:0 "Rétraction du Champ de Discorde"
 STRIFE_FIELD_SHRINKING_DESC:0 "Le §RChamp de Discorde§! ne dispose pas d’assez de Discorde pour maintenir sa taille actuelle. Sa §MPortée§! a diminué de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que celle du $inner_strife_field_name$ est de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."
 STRIFE_FIELD_ABOUT_TO_GROW_TITLE:0 "Le Champ de Discorde est sur le point de s’étendre"
 STRIFE_FIELD_ABOUT_TO_GROW_DESC:0 "Le §RChamp de Discorde§! dispose d’assez de Discorde pour agrandir ses frontières. Sa §MPortée§! augmentera de §Y1§! dans §Y6 mois§!."
 STRIFE_FIELD_GROWING_TITLE:0 "Expansion du Champ de Discorde"
 STRIFE_FIELD_GROWING_DESC:0 "Le §RChamp de Discorde§! dispose d’assez de Discorde pour agrandir ses frontières. Sa §MPortée§! a augmenté de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que celle du $inner_strife_field_name$ est de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."
 SIRENS_SWAPPING_LEADER_TITLE:0 "Changement de Leader des Sirènes"
 SIRENS_SWAPPING_LEADER_DESC_ARIA:0 "Les §RSirènes§! sont maintenant dirigées par §MAria Blaze§!.\nElle offre des bonus à la §YPrécision§!, au §YSuivi§! et à la §YVitesse§! des vaisseaux."
 SIRENS_SWAPPING_LEADER_DESC_SONATA:0 "Les §RSirènes§! sont maintenant dirigées par §BSonata Dusk§!.\nElle offre des bonus à la §YVitesse de Construction des Mégastructures§! et à la §YProduction de Matériaux de Guerre§!."
 SIRENS_SWAPPING_LEADER_DESC_ADAGIO:0 "Les §RSirènes§! sont maintenant dirigées par §HAdagio Dazzle§!.\nElle offre des bonus aux §YDégâts§! et à la §YPortée§! des vaisseaux."
 SIRENS_MEGAPHONE_UPGRADED_TITLE:0 "Enthralleur Shroudsonique Amélioré"
 SIRENS_MEGAPHONE_UPGRADED_DESC:0 "Le §YEnthralleur Shroudsonique§! a été amélioré au niveau §Y[giga_eawaf_country.giga_eawaf_sirens_megaphone_level]§!. Sa §MPuissance§! est maintenant de §Y[giga_eawaf_country.giga_eawaf_field_potency_multiplier]§!, influençant les malus du §PChamp Extérieur§! ainsi que les coûts d’entretien des §YDésenchanteurs§!."
 inner_strife_field_name:0 "§RChamp de Discorde Intérieur§!"
 outer_strife_field_name:0 "§PChamp de Discorde Extérieur§!"
 NAME_Giga_Eawaf_Sirens_Megaphone:0 "Enthralleur Shroudsonique - Modèle [giga_eawaf_country.giga_eawaf_sirens_megaphone_level]"
 GIGA_EAWAF_DISENCHANTER_1:0 "Désenchanteur Prototype"
 GIGA_EAWAF_DISENCHANTER_1_DESC:0 "Une version préliminaire d’un dispositif capable de contrer la mélodie envoûtante des Sirènes en émettant un bruit énergétique spécialement accordé autour du vaisseau. Ces prototypes sont cependant coûteux et extrêmement énergivores, nécessitant une importante alimentation externe pour fonctionner en continu."
 GIGA_EAWAF_DISENCHANTER_2:0 "Désenchanteur Accordé"
 GIGA_EAWAF_DISENCHANTER_2_DESC:0 "Cette version améliorée et rationalisée du Désenchanteur repose sur les prototypes initiaux pour contrer plus efficacement la mélodie des Sirènes à travers des bruits énergétiques ajustés. Bien qu'ils impactent moins la mobilité du vaisseau, la complexité croissante de la génération du bruit psionique adéquat entraîne une augmentation des exigences logistiques."
 GIGA_EAWAF_DISENCHANTER_3:0 "Désenchanteur Symphonique"
 GIGA_EAWAF_DISENCHANTER_3_DESC:0 "La sophistication continue des Désenchanteurs permet non seulement de neutraliser le Champ Extérieur, mais aussi d’opérer dans le Champ Intérieur des Sirènes. Cependant, les coûts d’entretien continuent de croître."
 GIGA_EAWAF_DISENCHANTER_4:0 "Désenchanteur Euphonique"
 GIGA_EAWAF_DISENCHANTER_4_DESC:0 "Ce modèle de Désenchanteur parfait permet à nos vaisseaux de contrer totalement les effets de la mélodie envoûtante des Sirènes, les rendant essentiellement immunisés à toutes leurs attaques psioniques. Malheureusement, cela s’accompagne de coûts d’entretien colossaux pour maintenir ces dispositifs en fonctionnement dans les profondeurs du Champ de Discorde."
 GIGA_EAWAF_ENTHRALLING_BEAM:0 "Rayon Envoûtant"
 GIGA_EAWAF_PANOPTICON_AURA:0 "Mini-Champ de Discorde"
 GIGA_EAWAF_GRAND_VOID_BEAM:0 "Grand Rayon du Vide"
 GIGA_EAWAF_GRAND_VOID_BEAM_DESC:0 "Ce gigantesque rayon a la particularité d’augmenter psioniquement l’entropie de sa cible, le rendant extrêmement efficace contre les systèmes de boucliers."
 GIGA_EAWAF_CRYSTAL_IMPACTOR:0 "Percuteur Cristallin"
 GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC:0 "Le Percuteur Cristallin utilise des cristaux thaumaturgiques dotés d’une conscience partielle pour produire des projectiles auto-guidés à très haute vélocité, capables de pénétrer les blindages ennemis."
 GIGA_EAWAF_CRYSTAL_ARTILLERY:0 "Artillerie Cristalline"
 GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC:0 "Cette artillerie tire de grands projectiles cristallins imprégnés d’une énergie psionique instable, les rendant très efficaces contre les défenses ennemies."
 GIGA_EAWAF_CRYSTAL_AUTOCANNON:0 "Autocanon Cristallin"
 GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC:0 "Ces autocanons projettent une rafale de cristaux thaumaturgiques tranchants. Bien que peu efficaces contre les blindages épais et facilement stoppés par les boucliers, ils peuvent dévaster la coque exposée des vaisseaux énergétiques."
 GIGA_EAWAF_STRIKE_CRAFT:0 "Leurres Harceleurs"
 GIGA_EAWAF_STRIKE_CRAFT_DESC:0 "Plutôt que de mener des assauts directs, ces chasseurs à forte durabilité servent à submerger, harceler et désorienter les systèmes de défense ennemis, facilitant les dégâts infligés par nos autres armes."
 GIGA_EAWAF_PSIONIC_CHARGE:0 "Charge Thaumaturgique"
 GIGA_EAWAF_PSIONIC_CHARGE_DESC:0 "Ce missile non conventionnel est une sphère de cristaux thaumaturgiques chargés, projetée à travers le vide spatial. Animée d’une conscience partielle ne désirant que la destruction, elle peut contourner boucliers et blindages pour semer le carnage chez ses adversaires détestés."
