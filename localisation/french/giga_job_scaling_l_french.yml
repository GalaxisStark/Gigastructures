 d_giga_job_size_ringworld:0 "Étendues Interminables"
 d_giga_job_size_ringworld_desc:0 "Avec une grande marge d'expansion, nous pouvons construire mieux et plus grand."
 d_giga_job_upkeep:0 "Échelle de l'entretien des emplois"
 d_giga_job_upkeep_desc:0 "Même les meilleurs efforts en matière d'efficacité peuvent être contrecarrés par l'ampleur du déploiement."
 d_giga_job_upkeep_tooltip:0 "Ce type de planète peut supporter une population beaucoup plus élevée qu'une planète normale, de sorte que de nombreux bonus peuvent potentiellement être empilés plus que la normale.\n\nCette caractéristique dilue plusieurs modificateurs pour les populations §Ysupérieures à 200§! afin qu'ils ne soient plus qu'à moitié de leur force à 400, un tiers à 600, et ainsi de suite."
