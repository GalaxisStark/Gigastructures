 d_giga_job_size:0 "Effet d'échelle des emplois"
 d_giga_job_size_desc:0 "Que ce soit par l'efficacité ou la simple taille des installations, de nombreux emplois sont plus puissants sur ce monde."
 mod_giga_planet_job_size:0 "Échelle des emplois"
 mod_giga_planet_job_size_tooltip_pre:0 "Augmente la production de base et l'entretien de nombreuses catégories d'emplois, en fonction de l'ampleur du modificateur §Y$mod_giga_planet_job_size$§! pour cette planète."
 mod_giga_planet_job_size_tooltip_pre_short:0 "Échelle Totale des emplois :"
 mod_giga_planet_job_size_tooltip:0 "Effets d'une échelle totale des emplois de"
