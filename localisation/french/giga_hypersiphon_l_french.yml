l_french:
 giga_hypersiphon_power_estimate:0 "§HEstimation de Puissance Calculée :§!\n- Capacité Navale Max : §Y[this.GigaGetNavalCap]§!\n- Capacité Navale Utilisée : §Y[this.GigaGetUsedNavalCap]§!\n- Puissance Actuelle de la Flotte : §Y[this.GigaGetFleetPower]§!\n\n- Puissance Estimée : §Y[This.giga_hypersiphon_incursion_power]§!"
 giga_project_hypersiphon_portal:0 "Enquête sur l'Intrusion du Suaire"
 giga_project_hypersiphon_portal_DESC:0 "Les vestiges du mystérieux portail du Suaire utilisé par les entités psioniques hostiles qui nous ont attaqués pourraient nous permettre d'affiner notre réseau $name_psy_siphon$."
 giga_tech_shroud_conduit:0 "Connexions Directes au Suaire"
 giga_tech_shroud_conduit_desc:0 "Après de longues méditations et études, nos télépathes estiment qu'il pourrait être possible d'ouvrir des tunnels stables vers le royaume connu sous le nom de Suaire. Bien que de taille subatomique, l'utilisation contrôlée de ces tunnels permettrait à notre population psionique de bénéficier d'énergies autrement limitées à des rituels coûteux et dangereux."
 giga_tech_psychic_hypersiphon:0 "Ouverture du Passage"
 giga_tech_psychic_hypersiphon_desc:0 "Le Suaire est un royaume étrange. En combinant de nouvelles technologies de confinement avec une puissance télépathique immense, il pourrait devenir possible de relier directement notre réalité à celle du Suaire à une échelle macroscopique. Cela pourrait grandement améliorer nos Conduits du Suaire, portant notre prospérité à de nouveaux sommets. Un certain passage d’énergies indésirables est théorisé comme inévitable, mais il devrait rester minime."
 giga_dialog.1401.name:0 "Construction du $name_psy_siphon$"
 giga_dialog.1401.desc:0 "Nos ingénieurs ont assemblé le site de construction de notre futur $name_psy_siphon$, qui drainera l'énergie du Suaire lui-même !\n\nUne fois achevé, la puissance de nos installations planétaires $building_giga_shroud_conduit$ sera grandement renforcée, nous menant vers de nouveaux sommets de prospérité."
 giga_dialog.1401.a:0 "Compris."
 giga_dialog.1402.name:0 "Cadre de Confinement du $name_psy_siphon$"
 giga_dialog.1402.desc:0 "Le cadre de confinement du $name_psy_siphon$ est désormais en place ! Il a été conçu pour contenir une sphère d'énergie psionique pure en ébullition, servant de point focal aux efforts de nos télépathes pour canaliser les énergies du Suaire.\n\nLa dernière étape consistera en la construction des équipements utilisés pour ouvrir le portail lui-même."
 giga_dialog.1402.a:0 "Rassemblez les matériaux rituels."
 giga_dialog.1404.name:0 "$name_psy_siphon$ Achevé"
 giga_dialog.1404.desc:0 "Le grand portail reliant notre réalité au Suaire près de [giga_system.GetName] a été entièrement activé !\n\nUne énergie pure s’écoule désormais de cette porte artificielle vers le royaume psychique, et nos télépathes ressentent déjà le formidable avantage que ce lien direct confère à leurs capacités psioniques !"
 giga_dialog.1404.a:0 "Nous sommes maîtres de l'immatériel."
 psychic_hypersiphon_0:0 "$gc_mega$$name_psy_siphon$ Site de Construction"
 psychic_hypersiphon_0_DESC:0 "Ce site de construction servira de base à la future construction d’un $name_psy_siphon$."
 psychic_hypersiphon_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_psionics$ - $giga_list_category_advanced_resource_production$\nOuvre un portail vers le §YSuaire§!, améliorant les bâtiments §Y$building_giga_shroud_conduit$§! - $giga_list_potentially_hazardous$\nDes Hypersiphons supplémentaires augmenteront l'effet de chaque bâtiment.\n§LUn portail immense reliant notre univers au Suaire, renforçant nos capacités psioniques."
 psychic_hypersiphon_1:0 "Cadre de Confinement du $name_psy_siphon$"
 psychic_hypersiphon_1_DESC:0 "Cette structure imposante servira de noyau principal pour contenir et raffiner l'énergie extraite du Suaire. Le cadre central maintiendra et stabilisera une 'étoile' composée d'énergie psionique pure, servant de point d’ancrage pour un équipage de puissants psioniques."
 psychic_hypersiphon_2:0 "$name_psy_siphon$"
 psychic_hypersiphon_2_DESC:0 "Un $name_psy_siphon$ entièrement opérationnel et stabilisé. Le portail reliant notre réalité au Suaire a été complètement activé et libère une Essence pure du Suaire."
 giga_psy_siphon_interaction_title:0 "§HDébloque la fonctionnalité :§! $building_giga_shroud_conduit$ amélioré"
 giga_psy_siphon_interaction_desc:0 "§H$building_giga_shroud_conduit$ amélioré§!\nPour chaque $name_psy_siphon$ construit, les bâtiments £building£ §Y$building_giga_shroud_conduit$§! accorderont des emplois supplémentaires et produiront £sr_psionic_sublimate£ §Y$sr_psionic_sublimate$§! pour chaque Pop psionique sur la planète.\n\nCela pourrait entraîner une certaine §Rinstabilité§! dans les Conduits, mais cela ne devrait avoir qu’un impact minime..."
 psychic_hypersiphon_3_aeternum:0 "Hypersiphon Aeternite $name_psy_siphon$"
 psychic_hypersiphon_3_aeternum_DESC:0 "Un $name_psy_siphon$ entièrement opérationnel et stabilisé, construit il y a d'innombrables éons par Aeternum. Le portail reliant notre réalité au Suaire a été complètement activé et libère une Essence pure du Suaire sans aucun signe d’instabilité."
 building_giga_shroud_conduit:0 "Conduit du Suaire"
 building_giga_shroud_conduit_desc:0 "Une immense installation psionique extrayant de force l'Énergie du Suaire et la redistribuant à la surface de la planète, augmentant considérablement les capacités télépathiques."
 building_giga_shroud_conduit_hypersiphon_hint:0 "\nLa construction d'une Mégastructure §Y$psychic_hypersiphon_2$§! fournira des emplois supplémentaires et générera £sr_psionic_sublimate£ §Y$sr_psionic_sublimate$§! pour chaque £pop£ §YPop Psionique§! sur la planète."
 building_giga_shroud_conduit_hypersiphon_safe_effect:0 "\nHypersiphons Psioniques renforçant ce bâtiment : §Y[owner.GetHypersiphonNetworkSize]§!\n\nGénération de £sr_psionic_sublimate£ §Y$sr_psionic_sublimate$§! à partir de §Y[this.GetHypersiphonPopCount]§! Pops Psioniques"
 building_giga_shroud_conduit_hypersiphon_effect:0 "\nHypersiphons Psioniques renforçant ce bâtiment : §Y[owner.GetHypersiphonNetworkSize]§!\n\nGénération de £sr_psionic_sublimate£ §Y$sr_psionic_sublimate$§! et §Rinstabilité§! à partir de §Y[this.GetHypersiphonPopCount]§! Pops Psioniques"
 decision_hypersiphon_mass_summon:0 "Invocation Massive de $shroud_summoned_army_plural$"
 decision_hypersiphon_mass_summon_effect:0 "Invoque §G[owner.GetHypersiphonSummonCount]§! §Y$shroud_summoned_army_plural$§!, basé sur le nombre d’emplois [owner.GetGigaShroudConduitJobIcon] §Y[owner.GetGigaShroudConduitJob]§! et £pop£ §YPops Psioniques§! sur la planète."
 decision_hypersiphon_mass_summon_desc:0 "Avec une préparation rituelle complexe et d’énormes quantités de $sr_psionic_sublimate$ concentré, des entités du Suaire pourraient être invoquées à grande échelle."
 job_giga_shroud_conduit_worker:0 "Technicien du Conduit du Suaire"
 job_giga_shroud_conduit_worker_plural:0 "Techniciens du Conduit du Suaire"
 job_giga_shroud_conduit_worker_desc:0 "Spécialistes chargés de gérer les minuscules tunnels du Suaire ouverts par un $building_giga_shroud_conduit$."
 job_giga_shroud_conduit_worker_effect_desc:0 "£job_giga_shroud_conduit_worker£ $job_giga_shroud_conduit_worker_plural$ canalisent £energy£ §Y$energy$§! pour produire £unity£ §Y$unity$§! et améliorer la productivité sur la planète."
 mod_job_giga_shroud_conduit_worker_add:0 "Emplois de $job_giga_shroud_conduit_worker$"
 mod_job_giga_shroud_conduit_worker_per_pop:0 "§G+1§! emploi de $job_giga_shroud_conduit_worker$ par palier de $VALUE$ Pops "
 mod_job_giga_shroud_conduit_worker_per_pop_short:0 "\n§G+1§! emploi de £mod_job_giga_shroud_conduit_worker_add£ par palier de $VALUE$ £pop£"
 job_giga_shroud_conduit_worker_icon:0 "£job_giga_shroud_conduit_worker£"
 job_giga_shroud_conduit_priest:0 "Canaliseur du Suaire"
 job_giga_shroud_conduit_priest_plural:0 "Canaliseurs du Suaire"
 job_giga_shroud_conduit_priest_desc:0 "Clergé psionique chargé de gérer les connexions délicates générées par un $building_giga_shroud_conduit$."
 job_giga_shroud_conduit_priest_effect_desc:0 "£job_giga_shroud_conduit_priest£ $job_giga_shroud_conduit_priest_plural$ utilisent £energy£ §Y$energy$§! pour produire £unity£ §Y$unity$§!, fournir £amenities£ $MOD_PLANET_AMENITIES_ADD$, et améliorer la productivité sur la planète."
 mod_job_giga_shroud_conduit_priest_add:0 "Emplois de $job_giga_shroud_conduit_priest$"
 mod_job_giga_shroud_conduit_priest_per_pop:0 "§G+1§! emploi de $job_giga_shroud_conduit_priest$ par palier de $VALUE$ Pops "
 mod_job_giga_shroud_conduit_priest_per_pop_short:0 "\n§G+1§! £mod_job_giga_shroud_conduit_priest_add£ par $VALUE$ £pop£"
 job_giga_shroud_conduit_priest_icon:0 "£job_giga_shroud_conduit_priest£"
 job_giga_shroud_conduit_drone:0 "Drone du Conduit du Suaire"
 job_giga_shroud_conduit_drone_plural:0 "Drones du Conduit du Suaire"
 job_giga_shroud_conduit_drone_desc:0 "Drones psioniquement actifs spécialisés dans la gestion des connexions délicates générées par un $building_giga_shroud_conduit$."
 job_giga_shroud_conduit_drone_effect_desc:0 "£job_giga_shroud_conduit_drone£ $job_giga_shroud_conduit_drone_plural$ canalisent £energy£ §Y$energy$§! pour produire £unity£ §Y$unity$§! et améliorer la productivité sur la planète."
 mod_job_giga_shroud_conduit_drone_add:0 "Emplois de $job_giga_shroud_conduit_drone$"
 mod_job_giga_shroud_conduit_drone_per_pop:0 "§G+1§! $job_giga_shroud_conduit_drone$ emploi par $VALUE$ Pops "
 mod_job_giga_shroud_conduit_drone_per_pop_short:0 "\n§G+1§! £mod_job_giga_shroud_conduit_worker_add£ par $VALUE$ £pop£"
 job_giga_shroud_conduit_drone_icon:0 "£job_giga_shroud_conduit_drone£"
 giga_situation_hypersiphon_tracker_type:0 "Suivi du $name_psy_siphon$"
 giga_situation_hypersiphon_tracker:0 "Suivi du $name_psy_siphon$ sur [target.planet.GetName]"
 giga_situation_hypersiphon_tracker_desc:0 "Gère les événements liés à ce $name_psy_siphon$"
 giga_situation_hypersiphon_tracker_monthly_change_tooltip:0 ""
 giga_situation_hypersiphon_instability:0 "Instabilité du Conduit du Suaire"
 giga_situation_hypersiphon_instability_type:0 "$giga_situation_hypersiphon_instability$"
 giga_situation_hypersiphon_instability_desc:0 "Les tunnels psioniques macroscopiques générés par notre $name_psy_siphon$ provoquent des fluctuations au sein de la structure locale du Suaire.\nLes relevés indiquent des pics d’activité bien au-delà de nos prévisions initiales, et si le niveau d’énergie augmente trop, nous pourrions commencer à subir des effets négatifs."
 giga_situation_hypersiphon_instability_monthly_change_tooltip:0 "£mod_black_hole£ §YInstabilité du Conduit du Suaire§! causée par les bâtiments £building£ §Y$building_giga_shroud_conduit$§! renforcés par les Mégastructures §Y$name_psy_siphon$§!."
 giga_situation_hypersiphon_instability_progress_instability:0 "Bâtiments $building_giga_shroud_conduit$"
 giga_situation_hypersiphon_instability_progress_decay:0 "Dissipation Naturelle"
 giga_situation_hypersiphon_instability_progress_mitigate:0 "$giga_situation_hypersiphon_instability_approach_mitigate$"
 giga_situation_hypersiphon_instability_progress_encourage:0 "$giga_situation_hypersiphon_instability_approach_encourage$"
 giga_situation_hypersiphon_instability_stage_1:0 "§EMinime§! Instabilité du Suaire"
 giga_situation_hypersiphon_instability_stage_1_effect:0 "Des événements perturbateurs liés au Suaire peuvent survenir §Etrès rarement§!."
 giga_situation_hypersiphon_instability_stage_2:0 "§GFaible§! Instabilité du Suaire"
 giga_situation_hypersiphon_instability_stage_2_effect:0 "Des événements perturbateurs liés au Suaire peuvent survenir §Grarement§!."
 giga_situation_hypersiphon_instability_stage_3:0 "§YMoyenne§! Instabilité du Suaire"
 giga_situation_hypersiphon_instability_stage_3_effect:0 "Des événements perturbateurs liés au Suaire peuvent survenir §Yoccasionnellement§!."
 giga_situation_hypersiphon_instability_stage_4:0 "§HElevée§! Instabilité du Suaire"
 giga_situation_hypersiphon_instability_stage_4_effect:0 "Des événements perturbateurs liés au Suaire se produiront §Hfréquemment§!."
 giga_situation_hypersiphon_instability_stage_5:0 "§RExtrême§! Instabilité du Suaire"
 giga_situation_hypersiphon_instability_stage_5_effect:0 "Des événements perturbateurs liés au Suaire se produiront §Rtrès fréquemment§!."
 giga_situation_hypersiphon_instability_approach_neutral:0 "Observer"
 giga_situation_hypersiphon_instability_approach_neutral_desc:0 "Le Suaire est un royaume mystérieux et mal compris. Nous savons que quelque chose approche, mais cela reste informe, éphémère. Nous continuerons à observer."
 giga_situation_hypersiphon_instability_approach_neutral_effect:0 "Nous poursuivrons l'observation des fluctuations du Suaire."
 giga_situation_hypersiphon_instability_approach_encourage:0 "Encourager"
 giga_situation_hypersiphon_instability_approach_encourage_desc:0 "Il est impératif que nous exploitions ce pouvoir à son plein potentiel, même si cela signifie irriter ceux qui tenteraient de nous freiner."
 giga_situation_hypersiphon_instability_approach_encourage_effect:0 "[GetGigaShroudConduitJobIcon]§Y[GetGigaShroudConduitJob]§! Emplois sont §Gplus efficaces§! pour booster la production, mais la progression de la situation est accélérée de §R25%§! et les événements négatifs sont plus fréquents.\n"
 giga_situation_hypersiphon_instability_approach_mitigate:0 "Atténuer"
 giga_situation_hypersiphon_instability_approach_mitigate_desc:0 "Nous devons minimiser notre impact sur le Suaire et ses habitants, de peur d’attirer leur colère."
 giga_situation_hypersiphon_instability_approach_mitigate_effect:0 "La progression de la situation est ralentie de §G50%§! et les événements négatifs sont moins fréquents, mais [GetGigaShroudConduitJobIcon]§Y[GetGigaShroudConduitJob]§! Emplois sont §Rmoins efficaces§! pour booster la production.\n"
 giga_situation_hypersiphon_instability_complete_effect:0 "Une nouvelle Incursion majeure du Suaire se produira quelque part dans notre espace."
 giga_situation_hypersiphon_instability_complete_effect_unknown:0 "Les conséquences de laisser ces énergies croître sont actuellement inconnues."
 giga_situation_hypersiphon_instability_fail_effect:0 "Le Suaire retrouve sa tranquillité."
 giga_hypersiphon.002.name:0 "Courants Invisibles"
 giga_hypersiphon.002.desc:0 "Cela a commencé comme un léger trouble dans l’esprit de nos télépathes, mais cela est rapidement devenu quelque chose de plus. Il est maintenant évident que la collecte d'énergies directement à partir de la substance du Suaire en quantités aussi importantes provoque plus de turbulences que nous ne l’avions prévu.\n\nPour l’instant, nous ne sommes pas certains des implications de ces perturbations, mais si elles continuent d’augmenter en intensité, nous pourrions finir par attirer l’attention des puissances qui y résident.\n\nPour le moment, nous observerons."
 giga_hypersiphon.002.a:0 "Inquiétant."
 giga_hypersiphon.010.name:0 "Dysfonctionnement du Siphon du Suaire"
 giga_hypersiphon.010.desc:0 "L’équipage du $building_giga_shroud_conduit$ sur [hypersiphon_target.GetName] signale un énorme pic d’énergie psionique sur [hypersiphon_target.GetPlanetMoon], se manifestant par une perturbation physique à la surface.\n\nLa zone affectée est désormais inutilisable et nécessitera des efforts considérables pour être nettoyée."
 giga_hypersiphon.010.a:0 "Gênant."
 giga_hypersiphon.010.result.1:0 "Une petite région de [hypersiphon_target.GetName] a été contaminée par des déchets ectoplasmiques."
 giga_hypersiphon.010.result.2:0 "Une vaste région de [hypersiphon_target.GetName] a été contaminée par des déchets ectoplasmiques."
 giga_hypersiphon.010.result.3:0 "Une anomalie s’est formée à la surface de [hypersiphon_target.GetName], déconcertant nos [hypersiphon_target.owner.GetScientistPlural]."
 giga_hypersiphon.010.result.4:0 "$giga_hypersiphon.010.result.3$"
 giga_hypersiphon.010.result.5:0 "Une énorme région de [hypersiphon_target.GetName] a été engloutie par un violent système de tempête psionique, causant des ravages tout en servant de connexion au Suaire."
 giga_hypersiphon.020.name:0 "Vaches du Suaire dans [hypersiphon_target.GetName]"
 giga_hypersiphon.020.desc.first:0 "Une immense tempête psionique s'est formée dans le système [hypersiphon_target.GetName], perturbant gravement nos opérations spatiales.\n\nDe manière mystérieuse, un grand nombre d'entités du Suaire apparemment passives sont également apparues dans le système. Nos télépathes les ont surnommées 'Vaches du Suaire', en raison de leur ressemblance frappante avec les Tiyanki, tant sur le plan physique que dans leur chant psionique."
 giga_hypersiphon.020.desc.normal:0 "Des créatures du Suaire sont apparues dans le système [hypersiphon_target.GetName], accompagnées une fois de plus par une tempête psionique perturbatrice."
 giga_hypersiphon.020.desc.damage:0 "Une nouvelle tempête psionique s'est formée dans le système [hypersiphon_target.GetName]. D'autres Vaches du Suaire ont émergé, immédiatement hostiles aux routes commerciales et aux installations locales."
 giga_hypersiphon.020.a:0 "C'est intriguant..."
 giga_hypersiphon.020.b:0 "Encore eux ?"
 giga_hypersiphon.020.c:0 "Poste de combat !"
 giga_hypersiphon.020.effect:0 "Une tempête psionique s'est formée dans [hypersiphon_target.GetName] et a amené avec elle une faune du Suaire !"
 giga_hypersiphon.022.name:0 "Dissipation des Perturbations du Suaire dans [hypersiphon_target.GetName]"
 giga_hypersiphon.022.desc:0 "La tempête psionique dans le système [hypersiphon_target.GetName] s'est dissipée, et les opérations reprennent leur cours normal.\n\nLes apparitions mystérieuses qui l'accompagnaient ont également disparu sans laisser de trace."
 giga_hypersiphon.022.a:0 "Tout est clair, pour le moment."
 giga_hypersiphon.030.name:0 "Visions de Désastre sur [hypersiphon_target.GetName]"
 giga_hypersiphon.030.desc:0 "La population de [hypersiphon_target.GetName] est récemment frappée par des cauchemars terrifiants et des visions de catastrophes imminentes. Plusieurs secteurs industriels sur [hypersiphon_target.GetPlanetMoon] ont signalé des événements étranges, où des interférences psioniques ont entraîné une augmentation du taux de mortalité et des pannes mécaniques.\n\nNos télépathes rapportent qu'une présence liée au Suaire s'est installée, et qu'il pourrait falloir un certain temps avant que ses effets ne disparaissent."
 giga_hypersiphon.030.a:0 "Troublant."
 giga_hypersiphon.030.result.1.1:0 "Mort et destruction ont visité ce monde."
 giga_hypersiphon.030.result.1.2:0 "Destruction massive sur cette planète."
 giga_hypersiphon.030.result.1.3:0 "Une destruction généralisée s'est abattue sur ce monde."
 giga_hypersiphon.040.name:0 "Incursion du Suaire dans [hypersiphon_target.GetName] !"
 giga_hypersiphon.040.desc:0 "Des entités hostiles du Suaire se sont manifestées dans le système [hypersiphon_target.GetName] !\n\nLes premiers rapports suggèrent qu'elles se déplacent de manière erratique, sans objectif clair, attaquant tout sur leur passage. Nos télépathes spéculent que ces apparitions n'ont plus de connexion avec leur royaume d'origine et que, sans source de subsistance, leur énergie finira par se dissiper dans l'espace."
 giga_hypersiphon.040.a:0 "Dommage."
 giga_hypersiphon.040.result:0 "§LVisiteurs malveillants, errant sans but...§!"
 giga_hypersiphon.100.name:0 "Incursion Majeure du Suaire dans [hypersiphon_target.GetName] !"
 giga_hypersiphon.100.desc:0 "Un grand nombre d'entités hostiles du Suaire se sont manifestées dans le système [hypersiphon_target.GetName], regroupées autour d'une faille mystérieuse.\n\nElles semblent mener une attaque coordonnée contre nos installations dans le système, suggérant une action organisée. Nos télépathes spéculent qu'avec cette connexion maintenue à leur royaume d'origine, ces entités pourraient opérer indéfiniment dans notre plan et même s'étendre au-delà des frontières du système."
 giga_hypersiphon.100.a:0 "Préparez une contre-offensive immédiatement !"
 giga_hypersiphon.100.restart:0 "Relance la Situation : §Y$giga_situation_hypersiphon_instability$§!\n\n§MÀ travers le voile, avec malveillance et fureur...§!"
 giga_hypersiphon.101.name:0 "Pic d'Énergie Psionique"
 giga_hypersiphon.101.desc:0 "Une énorme signature énergétique a été détectée dans le système [hypersiphon_target.GetName], situé dans l'espace du [hypersiphon_target.owner.GetName]. Les premiers rapports suggèrent que des apparitions hostiles ont émergé d'une faille et attaquent tout dans le système."
 giga_hypersiphon.101.a:0 "Troublant."
 giga_hypersiphon.103.name:0 "Colonie Consommée par le Suaire"
 giga_hypersiphon.103.desc:0 "Des attaques répétées des entités du Suaire ont détruit la colonie sur [This.GetName], recouvrant la planète d'une épaisse couche de nuages de tempêtes psioniques. Il semble que la surface ait été complètement vidée de toute vie détectable, et les relevés de la planète indiquent des conditions étranges défiant les lois de la physique."
 giga_hypersiphon.103.a:0 "Une tragédie."
 giga_hypersiphon.105.name:0 "Incursion du Suaire Contenue"
 giga_hypersiphon.105.desc.first:0 "Nos forces ont réussi à effondrer la faille du Suaire dans le système [fromfrom.solar_system.GetName]. Avec leur connexion au Suaire coupée, les entités hostiles qui en avaient émergé se sont rapidement dissipées, devenant inoffensives.\n\nUne question demeure : quelle est notre solution à long terme à ce problème ? L'instabilité persiste, et cela se reproduira si rien ne change. Une faible signature des envahisseurs subsiste autour de l'ouverture scellée, et les résidus laissés sur nos vaisseaux peuvent être étudiés.\n\nPeut-être cela nous apportera-t-il les réponses que nous cherchons."
 giga_hypersiphon.105.desc.other:0 "Nos forces ont réussi à effondrer la faille du Suaire dans le système [fromfrom.solar_system.GetName]. Avec leur connexion au Suaire coupée, les entités hostiles qui en avaient émergé se sont rapidement dissipées, devenant inoffensives.\n\nLe Suaire reste agité - il semble que notre travail ne soit jamais terminé."
 giga_hypersiphon.105.a:0 "Une opportunité intéressante..."
 giga_hypersiphon.105.b:0 "Toujours vigilants."
 giga_hypersiphon.106.name:0 "Faille du Suaire Fermée"
 giga_hypersiphon.106.desc:0 "Nos forces ont réussi à effondrer la faille énergétique dans le système [fromfrom.solar_system.GetName]. Avec leur connexion à leur origine coupée, les entités hostiles qui en avaient émergé se sont rapidement dissipées, devenant inoffensives.\n\nLes relevés suggèrent que la région est désormais sécurisée, sans traces d’énergie résiduelle significative."
 giga_hypersiphon.106.a:0 "Espérons que cela le restera."
 giga_hypersiphon.107.name:0 "Incursion du Suaire Contenue"
 giga_hypersiphon.107.desc.first:0 "Les forces du [from.GetName] ont réussi à effondrer la faille du Suaire dans le système [fromfrom.solar_system.GetName]. Avec leur connexion au Suaire coupée, les entités hostiles qui en avaient émergé se sont rapidement dissipées, devenant inoffensives.\n\nUne question demeure : quelle est notre solution à long terme à ce problème ? L'instabilité persiste, et cela se reproduira si rien ne change. Une faible signature des envahisseurs subsiste autour de l'ouverture scellée, et les résidus laissés sur nos vaisseaux peuvent être étudiés.\n\nPeut-être cela nous apportera-t-il les réponses que nous cherchons."
 giga_hypersiphon.107.desc.other:0 "Les forces de [from.GetName] ont réussi à refermer la faille du Suaire dans le système [fromfrom.solar_system.GetName]. Avec leur lien vers le Suaire coupé, les entités hostiles qui en ont émergé se sont rapidement dissipées, devenant inoffensives.\n\nLe Suaire reste cependant agité - il est probable qu'une nouvelle incursion se produise à l'avenir."
 giga_hypersiphon.107.a:0 "Une opportunité intéressante..."
 giga_hypersiphon.107.b:0 "Peut-être que cette fois, elle restera fermée..."
 giga_hypersiphon.108.name:0 "Faille du Suaire Fermée"
 giga_hypersiphon.108.desc:0 "Les forces de [from.GetName] ont réussi à sceller la faille énergétique dans le système [fromfrom.solar_system.GetName]. Avec leur connexion à leur origine coupée, les entités hostiles qui en avaient émergé se sont rapidement dissipées, devenant inoffensives.\n\nLes rapports indiquent que la région est désormais sécurisée, sans aucune lecture énergétique résiduelle significative."
 giga_hypersiphon.108.a:0 "Bien compris."
 giga_hypersiphon.109.name:0 "Analyse de la Faille du Suaire Terminée"
 giga_hypersiphon.109.desc:0 "L'analyse préliminaire des résidus laissés par les envahisseurs du Suaire nous a permis d'obtenir quelques aperçus sur la façon dont nos Conduits du Suaire et nos Hypersiphons affectent le flux du Suaire.\n\nUne application prudente de mesures de sécurité et de rituels précis nous permettrait d'atténuer les effets négatifs de notre connexion, bien que cela réduise les bénéfices économiques de nos infrastructures de conduit.\n\nAlternativement, nous pourrions ignorer les dégâts causés et nous concentrer plutôt sur le renforcement de nos conduits en absorbant davantage d'énergies exploitables."
 giga_hypersiphon.109.a:0 "Intriguant."
 giga_hypersiphon.109.effect:0 "Débloque les approches §Y$giga_situation_hypersiphon_instability_approach_mitigate$§! et §Y$giga_situation_hypersiphon_instability_approach_encourage$§! pour la situation §Y$giga_situation_hypersiphon_instability$§!"
 d_giga_hypersiphon_goop:0 "£blocker£ Décharge du Suaire"
 d_giga_hypersiphon_goop_desc:0 "Essence psionique condensée et résidu ectoplasmique, violemment toxiques sur un plan ontologique."
 d_giga_hypersiphon_psionic_anomaly:0 "£blocker£ Zone Anormale"
 d_giga_hypersiphon_psionic_anomaly_desc:0 "Une région où les lois de la nature se plient comme des branches sous le vent."
 d_giga_hypersiphon_psionic_supercell_planet:0 "£blocker£ Supercellule Psionique"
 d_giga_hypersiphon_psionic_supercell_planet_desc:0 "Une tempête féroce consume une vaste région de la surface planétaire, la rendant inhabitable et envoyant des ondes de choc psioniques à travers l'esprit de toute la population."
 d_giga_hypersiphon_psionic_supercell_artificial:0 "£blocker£ Interférences des Systèmes Psioniques"
 d_giga_hypersiphon_psionic_supercell_artificial_desc:0 "Une énorme anomalie psionique causant des interférences significatives avec les systèmes locaux. Des ondes de choc traversent fréquemment la conscience collective de toute la population."
