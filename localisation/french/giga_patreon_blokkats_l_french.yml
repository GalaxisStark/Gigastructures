l_french:
 trait_blokkat_blokkimous:0 "Enthousiaste du Multivers"
 trait_blokkat_blokkimous_desc:0 "Ce Blokkat semble avoir trouvé des preuves que notre univers fait partie d'un 'multivers temporel' s'étendant à l'infini et montre un intérêt pour l'étude de ce phénomène nouvellement découvert."
 prison_blokkat_is_blokkimous:0 "§MEnthousiaste du Multivers§! - Ce Blokkat semble avoir trouvé des preuves que notre univers fait partie d'un 'multivers temporel' s'étendant à l'infini et montre un intérêt pour l'étude de ce phénomène nouvellement découvert."
 trait_blokkat_baron:0 "Complètement Dérangé"
 trait_blokkat_baron_desc:0 "Ce Blokkat a une fascination bizarre pour la transformation et la distorsion de tout ce qui est naturel. Il semble aussi s’être forgé une attitude aristocratique et élitiste."
 prison_blokkat_is_baron:0 "§RComplètement Dérangé§! - Ce Blokkat a une fascination bizarre pour la transformation et la distorsion de tout ce qui est naturel. Il semble aussi s’être forgé une attitude aristocratique et élitiste."
 trait_blokkat_blokkepsii:0 "Empathique"
 trait_blokkat_blokkepsii_desc:0 "Ce Blokkat semble se soucier profondément des autres espèces et consacre son temps à les étudier. Bien qu'il soit toujours axé sur les opérations de récolte, il semble parfaitement disposé à aider d'autres espèces de toutes les manières possibles."
 prison_blokkat_is_blokkepsii:0 "§EEmpathique§! - Ce Blokkat semble se soucier profondément des autres espèces et consacre son temps à les étudier. Bien qu'il soit toujours axé sur les opérations de récolte, il semble parfaitement disposé à aider d'autres espèces de toutes les manières possibles."
 trait_blokkat_bloblokkad:0 "Leader Scientifique"
 trait_blokkat_bloblokkad_desc:0 "Ce Blokkat semble apprécier la poursuite du savoir plus que tout. On le voit régulièrement expérimenter sur des 'primitifs' ou bricoler des projets insensés."
 prison_blokkat_is_bloblokkad:0 "§ELeader Scientifique§! - Ce Blokkat semble apprécier la poursuite du savoir plus que tout. On le voit régulièrement expérimenter sur des 'primitifs' ou bricoler des projets insensés."
 trait_blokkat_blokkofett:0 "Nouvelle Recrue"
 trait_blokkat_blokkofett_desc:0 "Ce Blokkat faisait partie d'une nation spatiale comme la nôtre qui a complété les Protocoles Blokk et a rejoint les Blokkats. Cette opération de récolte galactique est sa première mission, et il a été assigné à l’étude des entités nationales."
 prison_blokkat_is_blokkofett:0 "§HNouvelle Recrue§! - Ce Blokkat faisait partie d'une nation spatiale comme la nôtre qui a complété les Protocoles Blokk et a rejoint les Blokkats. Cette opération de récolte galactique est sa première mission, et il a été assigné à l’étude des entités nationales."
 trait_blokkat_blokkutos:0 "Rêveur"
 trait_blokkat_blokkutos_desc:0 "Ce Blokkat ressent toujours une nostalgie pour le passé et rêve d’un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu à ceux qui l'entourent."
 prison_blokkat_is_blokkutos:0 "§MRêveur§! - Ce Blokkat ressent toujours une nostalgie pour le passé et rêve d’un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu à ceux qui l'entourent."
 trait_blokkat_sophia:0 "Chevalier Rose"
 trait_blokkat_sophia_desc:0 "Ce Blokkat, pour une raison quelconque, prétend être et apprécie d’être ce qu'il appelle un Chevalier Rose, semblant connaître toutes les méthodes de guerre, y compris celles qui semblent complètement archaïques."
 prison_blokkat_is_sophia:0 "§PChevalier Rose§! - Ce Blokkat, pour une raison quelconque, prétend être et apprécie d’être ce qu'il appelle un Chevalier Rose, semblant connaître toutes les méthodes de guerre, y compris celles qui semblent complètement archaïques. Il semble indifférent à l’idée d’aider les Blokkats ou de nous aider dans nos propres opérations de récolte. Il demande souvent à être simplement appelé 'Rose'. Il a une obsession fanatique de tirer tout ce qui peut être chargé dans un canon sur les vaisseaux ennemis et prend souvent la fuite lorsqu’il sait que sa vie est en danger. De plus, pour une raison obscure, il aime tenter d’éperonner des vaisseaux les uns contre les autres.\n\nEnfin, il prétend vouloir voir 'La Plus Grande Chose Que Tout Être Pourrait Voir'. Personne ne sait de quoi il parle."
 trait_blokkat_blokknight:0 "Chevalier Rose"
 trait_blokkat_blokknight_desc:0 "Ce Blokkat semble aimer se déguiser, raconter d'innombrables histoires de hauts faits et d'interactions valeureuses avec d'anciennes civilisations primitives. Il semble aussi avoir une obsession malsaine pour les armes et armures primitives, s’assurant qu'elles soient produites en masse."
 prison_blokkat_is_blokknight:0 "§LLe Chevalier Blokknight est de Retour§! - Ce Blokkat semble aimer se déguiser, raconter d'innombrables histoires de hauts faits et d'interactions valeureuses avec d'anciennes civilisations primitives. Il semble aussi avoir une obsession malsaine pour les armes et armures primitives, s’assurant qu'elles soient produites en masse."
 trait_blokkat_yoru:0 "Psychotique et Violent"
 trait_blokkat_yoru_desc:0 "Ce Blokkat semble être animé par une volonté inébranlable d'annihiler toute forme de vie."
 prison_blokkat_is_yoru:0 "§RPsychotique et Violent§! - Ce Blokkat semble être animé par une volonté inébranlable d'annihiler toute forme de vie. Pourquoi ? Peut-être qu'il a reçu un signal sur le Blokkwork, peut-être qu'il a brûlé son blokktartine ce matin, ou peut-être... qu'il est juste fou."