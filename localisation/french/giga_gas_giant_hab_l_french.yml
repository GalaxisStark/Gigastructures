l_french:
 giga_gas_giant_home_system_NAME:0 "Foyer Géant Gazeux"
 giga_gas_giant_home_system_DESC:0 "Commencez sur une géante gazeuse habitable avec votre monde natal d'origine détruit."
 origin_gas_giant: "Ascension sur Géante Gazeuse"
 origin_gas_giant_desc: "Durant l’ère spatiale naissante de cet empire, leur monde natal a été frappé par une comète errante. Déjà dotés d’une infrastructure spatiale suffisante pour survivre temporairement, ils ont transformé une station minière orbitant une géante gazeuse en leur nouveau foyer. Au fil des années, la planète leur a offert les ressources nécessaires à leur subsistance et leur a apporté de nouvelles connaissances sur les divers gaz exotiques présents dans la galaxie. L’abondance de ces gaz a permis le développement de techniques industrielles avancées, bien que cette dépendance aux gaz exotiques soit devenue essentielle, même pour les industries les plus basiques."
 origin_gas_giant_robot: "Ascension sur Géante Gazeuse"
 origin_gas_giant_robot_desc: "Durant l’ère spatiale naissante de cet empire, leur monde natal a été frappé par une comète errante. Déjà dotés d’une infrastructure spatiale suffisante pour survivre temporairement, ils ont transformé une station minière orbitant une géante gazeuse en leur nouveau foyer. Au fil des années, la planète leur a offert les ressources nécessaires à leur subsistance et leur a apporté de nouvelles connaissances sur les divers gaz exotiques présents dans la galaxie. L’abondance de ces gaz a permis le développement de techniques industrielles avancées, bien que cette dépendance aux gaz exotiques soit devenue essentielle, même pour les industries les plus basiques."
 origin_gas_giant_effects: "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (Taille: £planetsize£ 16-28)$NEW_LINE$- Trait d'espèce:$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]$TABBED_NEW_LINE$- ['technology:tech_hydroponics', £society_research£ $tech_hydroponics$]"
 origin_gas_giant_effects_robot: "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (Taille: £planetsize£ 16-28)$NEW_LINE$- Trait d'espèce:$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab_robot']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$ ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]"
 concept_giga_habitable_gas_giant: "$pc_habitable_gas_giant$"
 concept_giga_habitable_gas_giant_desc: "$pc_habitable_gas_giant_desc$"
 concept_giga_gas_worlds: "Monde Gazeux"
 concept_giga_gas_worlds_desc: "Les géantes gazeuses habitables, les planètes ayant une atmosphère artificiellement saturée en gaz, ainsi que certains mondes toxiques légèrement plus hospitaliers sont classés sous la catégorie des 'Mondes Gazeux'."
 building_giga_gas_giant_habitation_module: "Module d'Habitation pour Géante Gazeuse"
 building_giga_gas_giant_habitation_module_desc: "Ensemble d'installations nécessaires à la colonisation d'une géante gazeuse, assemblées par la population d'origine de cette planète. Ces installations comprennent des réacteurs fournissant l’énergie nécessaire à la colonie, des baies d’amarrage pour décharger les minéraux extraits des lunes locales, ainsi que d’immenses hangars climatisés servant d'exploitations agricoles hydroponiques. De plus, ces structures abritent le centre de gestion de la distribution des ressources et divers services destinés aux populations locales."
 trait_giga_gas_giant_hab:0 "Dépendance aux Gaz Exotiques"
 trait_giga_gas_giant_hab_desc:0 "§LAprès des siècles d'exposition aux gaz exotiques en vivant sur une géante gazeuse, cette espèce est devenue partiellement dépendante de ces substances dans son quotidien.§!"
 trait_giga_gas_giant_hab_tooltip:0 "§YScience§! et §YIndustrie§! Entretien en Gaz Exotiques des emplois : §R+0.03§!\nUtilisation du logement sur les mondes ['concept_giga_gas_worlds', §YGaz§!] : §G-10%§!\n£job_researcher£ Entretien des $job_researcher$ sur les mondes ['concept_giga_gas_worlds', §YGaz§!] : §G-10%§!\nEntretien en Gaz Exotiques des emplois sur les mondes ['concept_giga_gas_worlds', §YGaz§!] : §G-33%§!\nUtilisation du logement sur les mondes non ['concept_giga_gas_worlds', §YGaz§!] : §R+30%§!\nHabitabilité sur les mondes non ['concept_giga_gas_worlds', §YGaz§!] : §R-20%§!\nEntretien en Gaz Exotiques des emplois sur les mondes non ['concept_giga_gas_worlds', §YGaz§!] : §R+50%§!"
 trait_giga_gas_giant_hab_robot:0 "Alimenté par les Gaz Exotiques"
 trait_giga_gas_giant_hab_robot_desc:0 "§LDe petites auto-modifications accumulées au fil du temps ont rendu ces machines presque totalement dépendantes des gaz exotiques comme source d’énergie.§!"
 trait_giga_gas_giant_hab_robot_tooltip:0 "$trait_giga_gas_giant_hab_tooltip$"
