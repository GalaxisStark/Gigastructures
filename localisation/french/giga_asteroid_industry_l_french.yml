 asteroid_manufactory_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$ - $giga_list_category_advanced_resource_production$\nOffre un choix de §YBâtiments d'usine§! en fonction du §YType d'astéroïde§! et du §YDépôt§!\nLes bâtiments d'usine correspondants offrent un §YBonus§! s'ils sont construits sur des planètes du même §YSystème Solaire§!\n§LUne grande installation construite autour d'un astéroïde, récoltant des ressources pour une utilisation planétaire.§!"
 asteroid_manufactory_0_CONSTRUCTION_INFO_DELAYED:0 "$asteroid_manufactory_cost$\n\nDoit être construit sur un astéroïde avec un modificateur §Y$asteroid_manufactory_candidate$§!\n\n$MEGASTRUCTURE_UPGRADES_TO$\n\n$asteroid_manufactory_alloys_upgrade$\n$asteroid_manufactory_energy_upgrade$\n\nDisponible pour les empires utilisant £consumer_goods£ $consumer_goods$:\n$asteroid_manufactory_consumer_goods_upgrade$\n\nDisponible pour les empires utilisant £food£ $food$:\n$asteroid_manufactory_food_upgrade$\n\nDisponible si la §YCapacité de construction de mégastructure§! est définie sur £job£§BBasée sur l'emploi§!:\n$asteroid_manufactory_supertensiles_upgrade$"
