 giga_asteroid_industry_candidate_supertensiles:0 "$asteroid_manufactory_candidate$: §Y$giga_sr_amb_megaconstruction$§!"
 giga_asteroid_industry_candidate_supertensiles_desc:0 "§TUn ['concept_giga_asteroid_industry_supertensiles'] peut être construit ici§!\n\nDes dépôts naturels de $giga_sr_amb_megaconstruction$ peuvent être trouvés dans cet astéroïde, qui pourraient être extraits avec des opérations minières plus intensives."
 asteroid_manufactory_2:0 "Autofabrique Astéroïdale"
 asteroid_manufactory_2_DESC:0 "Une usine automatisée qui extrait et raffine des matériaux d'un astéroïde pour produire des biens destinés au marché de consommation."
 giga_tech_asteroid_manufactory:0 "Usines de Fabrication Astéroïdales"
 giga_tech_asteroid_manufactory_desc:0 "En tant que restes de la formation de la plupart des systèmes solaires, les astéroïdes regorgent de ressources brutes facilement accessibles. De grandes constructions construites autour d'eux, équipées de récolteurs spécialisés, pourraient être utilisées pour collecter ces ressources et les expédier vers des usines planétaires pour traitement ou consommation."
 giga_asteroid_industry.001.name:0 "Site de Construction Industrielle Astéroïdale Terminé !"
 giga_asteroid_industry.001.desc:0 "Le site de construction d'un futur site industriel a été achevé dans le système [FromFrom.solar_system.GetName]. Flottant près d'un astéroïde, cette grande plateforme contient l'équipement nécessaire pour commencer la construction d'un vaste complexe minier, qui peut être spécialisé pour produire toutes sortes de produits.\n\nUne question demeure : quel type d'installation devons-nous construire ?"
 giga_asteroid_industry.001.alloys:0 "Une installation minière axée sur la production de £alloys£ §Y$alloys$§!."
 giga_asteroid_industry.001.alloys.effect:0 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_alloys']."
 giga_asteroid_industry.001.consumer_goods:0 "Une usine conçue pour fabriquer des composants pour £consumer_goods£ §Y$consumer_goods$§!."
 giga_asteroid_industry.001.consumer_goods.effect:0 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_consumer_goods']."
 giga_asteroid_industry.001.energy:0 "Un dépôt de carburant pour les centrales électriques produisant £energy£ §Y$energy$§!."
 giga_asteroid_industry.001.energy.effect:0 "Ce site sera configuré pour construire un ['concept_giga_asteroid_industry_energy']."
 giga_asteroid_industry.001.food:0 "Un processeur de glace pour irriguer les fermes et produire £food£ §Y$food$§!."
 giga_asteroid_industry.001.food.effect:0 "Ce site sera configuré pour construire un ['concept_giga_asteroid_industry_food']."
 giga_asteroid_industry.001.supertensiles:0 "Un extracteur des matériaux nécessaires pour £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!."
 giga_asteroid_industry.001.supertensiles.effect:0 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_supertensiles']."
 giga_asteroid_industry.003.name:0 "[FromFrom.GetName] Terminé"
 giga_asteroid_industry.003.generic:0 "La construction de [FromFrom.planet.GetName] [FromFrom.GetName] dans le système [FromFrom.solar_system.GetName] est terminée.\n\n"
 giga_asteroid_industry.003.alloys:0 "$giga_asteroid_industry.003.generic$Les barges de minerai sont déjà en file d'attente, prêtes à transporter les précieux minerais vers nos installations de fonderie planétaires.\n\nLes fonderies locales bénéficieront d'un traitement secondaire permettant de réduire les déchets, au prix d'un entretien logistique accru."
 giga_asteroid_industry.003.consumer_goods:0 "$giga_asteroid_industry.003.generic$Cette gigantesque usine produira des composants génériques pour une grande variété de produits de consommation, avec la finition et l'assemblage final réalisés dans des dépôts planétaires.\n\nLes dépôts locaux bénéficieront d'importations plus ciblées, mais avec des coûts logistiques accrus."
 giga_asteroid_industry.003.energy:0 "$giga_asteroid_industry.003.generic$L'extraction de grandes quantités de carburant utile à partir de la glace permettra de stocker du carburant pour une utilisation dans les centrales électriques planétaires.\n\nLes générateurs locaux bénéficieront d'une efficacité améliorée du réseau énergétique."
 giga_asteroid_industry.003.food:0 "$giga_asteroid_industry.003.generic$La glace extraite peut être utilisée pour soutenir des fermes intégrant des écosystèmes aquatiques, même sur les planètes les plus arides.\n\nLes fermes locales bénéficieront d'une production améliorée et d'une meilleure infrastructure de recyclage des déchets."
 giga_asteroid_industry.003.supertensiles:0 "$giga_asteroid_industry.003.generic$Les matériaux extraits ici seront affinés et purifiés dans des fonderies moléculaires planétaires avant d'être utilisés dans d'autres projets de méga-ingénierie.\n\nLes installations locales bénéficieront d'une réduction des coûts bureaucratiques, mais avec des coûts logistiques accrus."
 desc_asteroid_manufactory:0 "Une installation de fabrication polyvalente construite autour d'un astéroïde. Fournit un choix de bâtiments d'usine qui génèrent des emplois, en fonction du type d'astéroïde et de ses dépôts."
