 asteroid_manufactory_supertensiles:0 "Fonderie de Matériaux de Mégaconstruction"
 asteroid_manufactory_supertensiles_DESC:0 "Une installation avancée de traitement des matériaux qui extrait naturellement $giga_sr_amb_megaconstruction$ et plusieurs minerais connexes, les préparant pour un traitement ultérieur dans des salles blanches planétaires."
