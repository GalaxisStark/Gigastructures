 concept_giga_mbrain_uplinks_regular_desc:0 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires:$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_factory_concept$$giga_mbrain_uplink_refinery_concept$\n\nDisponible pour les empires autorisant £job_roboticist£ Robots:$giga_mbrain_uplink_robot_concept$\n\nDisponible pour ['concept_giga_mbrain_uplinks_diplomatic', Diplomatic] Empires:$giga_mbrain_uplink_diplomacy_concept$\n\nDisponible pour les empires gardant £job_livestock£ $job_livestock$:$giga_mbrain_uplink_livestock_concept$\n\nDisponible pour ['concept_giga_mbrain_uplinks_judgemental', Judgemental] Empires:$giga_mbrain_uplink_hell_concept$\n\nIndisponible pour ['civic:civic_dystopian_society']:$giga_mbrain_uplink_entertainment_concept$"
