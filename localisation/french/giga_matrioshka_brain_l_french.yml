 concept_giga_mbrain_uplinks_im_desc:0 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires:$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_factory_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_robot_concept$\n\nDisponible pour ['tradition_category:tradition_virtuality', Virtual] Empires:$giga_mbrain_uplink_virtual_concept$\n\nDisponible pour ['concept_giga_mbrain_uplinks_diplomatic', Diplomatic] Empires:$giga_mbrain_uplink_diplomacy_concept$\n\nDisponible pour les empires gardant £job_livestock£ $job_livestock$:$giga_mbrain_uplink_livestock_concept$\n\nDisponible pour ['concept_giga_mbrain_uplinks_judgemental', Judgemental] Empires:$giga_mbrain_uplink_hell_concept$\n\nIndisponible pour ['civic:civic_dystopian_society']:$giga_mbrain_uplink_entertainment_concept$"
 concept_giga_mbrain_uplinks_hive:0 "$giga_mbrain_uplink_plural$: $auth_hive_mind$"
 concept_giga_mbrain_uplinks_hive_desc:0 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires:$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept_hive$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_anti_deviancy_concept$\n\nDisponible pour les empires gardant £job_livestock£ $job_livestock$:$giga_mbrain_uplink_livestock_concept$\n\nDisponible pour les empires utilisant £consumer_goods£ $consumer_goods$:$giga_mbrain_uplink_factory_concept$\n\nDisponible pour ['civic:civic_hive_empath']:$giga_mbrain_uplink_diplomacy_concept$"
 concept_giga_mbrain_uplinks_machine:0 "$giga_mbrain_uplink_plural$: $auth_machine_intelligence$"
 concept_giga_mbrain_uplinks_machine_desc:0 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires:$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept_machine$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_anti_deviancy_concept$$giga_mbrain_uplink_robot_concept$\n\nDisponible pour les empires gardant £job_organic_battery£ $job_organic_battery$ Pops:$giga_mbrain_uplink_amalgamation_concept$\n\nDisponible pour les empires utilisant £consumer_goods£ $consumer_goods$:$giga_mbrain_uplink_factory_concept$\n\nDisponible pour ['tradition_category:tradition_virtuality', Virtual] Empires:$giga_mbrain_uplink_virtual_concept$\n\nDisponible pour ['civic:civic_machine_diplomatic_protocols']:$giga_mbrain_uplink_diplomacy_concept$"
 concept_giga_mbrain_uplinks_machine_servitor:0 "$giga_mbrain_uplink_plural$: $civic_machine_servitor$"
 concept_giga_mbrain_uplinks_machine_servitor_desc:0 "$concept_giga_mbrain_uplinks_text$\n$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_factory_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_anti_deviancy_concept$$giga_mbrain_uplink_robot_concept$$giga_mbrain_uplink_sanctuary_concept$$giga_mbrain_uplink_entertainment_concept$$giga_mbrain_uplink_diplomacy_concept$\n\nDisponible pour ['tradition_category:tradition_virtuality', Virtual] Empires:$giga_mbrain_uplink_virtual_concept$"
 giga_mbrain_uplink_research:0 "Simulacre Cosmique"
 building_giga_matrioshka_brain_uplink_research:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_research$"
 building_giga_matrioshka_brain_uplink_research_desc:0 "L'histoire d'univers infinis détaillée de manière complexe et simulée. Ne regardez pas trop attentivement, vous pourriez vous y voir."
 giga_mbrain_uplink_research_concept:0 "\n£job_researcher£ ['building:building_giga_matrioshka_brain_uplink_research', \"$giga_mbrain_uplink_research$\"]"
 giga_mbrain_uplink_unity:0 "Hyperviseur d'Allocation"
 building_giga_matrioshka_brain_uplink_unity:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_unity$"
 building_giga_matrioshka_brain_uplink_unity_desc:0 "Une puissance de calcul stupéfiante tournée vers l'organisation, le catalogage, la régimentation et la correction de signal. Gérer un empire interstellaire n'a jamais été aussi efficace."
 giga_mbrain_uplink_unity_concept:0 "\n£job_bureaucrat£ ['building:building_giga_matrioshka_brain_uplink_unity', \"$giga_mbrain_uplink_unity$\"]"
 giga_mbrain_uplink_unity_concept_hive:0 "\n£job_synapse_drone£ ['building:building_giga_matrioshka_brain_uplink_unity', \"$giga_mbrain_uplink_unity$\"]"
 giga_mbrain_uplink_unity_concept_machine:0 "\n£job_coordinator£ ['building:building_giga_matrioshka_brain_uplink_unity', \"$giga_mbrain_uplink_unity$\"]"
 giga_mbrain_uplink_sanctuary:0 "Utopie Organique"
 building_giga_matrioshka_brain_uplink_sanctuary:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_sanctuary$"
 building_giga_matrioshka_brain_uplink_sanctuary_desc:0 "Un paradis virtuel où les habitants peuvent vivre leurs rêves les plus fous - sans jugement, sans limites."
 giga_mbrain_uplink_sanctuary_concept:0 "\n£job_bio_trophy£ ['building:building_giga_matrioshka_brain_uplink_sanctuary', \"$giga_mbrain_uplink_sanctuary$\"]"
 giga_mbrain_uplink_entertainment:0 "Mégacomplexe Médiatique"
 building_giga_matrioshka_brain_uplink_entertainment:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_entertainment$"
 building_giga_matrioshka_brain_uplink_entertainment_desc:0 "Des attractions infinies conçues pour émerveiller les sens, personnalisées à un degré effrayant."
 giga_mbrain_uplink_entertainment_concept:0 "\n£job_entertainer£ ['building:building_giga_matrioshka_brain_uplink_entertainment', \"$giga_mbrain_uplink_entertainment$\"]"
 giga_mbrain_uplink_training:0 "Simulateur d’Entraînement"
 building_giga_matrioshka_brain_uplink_training:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_training$"
 building_giga_matrioshka_brain_uplink_training_desc:0 "Dans ces espaces virtuels spécialement conçus, nos meilleurs éléments peuvent recevoir l’enseignement qu’ils méritent, sans contrainte de temps."
 building_giga_matrioshka_brain_uplink_training_effect:0 "Fournit §G+$@matrioshka_brain_uplink_training_bonus|0$§! £mod_country_naval_cap_add£ $MOD_COUNTRY_NAVAL_CAP_ADD$ par £job_soldier£ §Y[owner.GetSoldier]§! Emploie\n"
 giga_mbrain_uplink_training_concept:0 "\n£job_giga_virtual_training_coordinator£ ['building:building_giga_matrioshka_brain_uplink_training', \"$giga_mbrain_uplink_training$\"]"
 giga_mbrain_uplink_diplomacy:0 "Consulat Virtuel"
 building_giga_matrioshka_brain_uplink_diplomacy:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_diplomacy$"
 building_giga_matrioshka_brain_uplink_diplomacy_desc:0 "Suites diplomatiques somptueuses et espaces de réunion où nos diplomates désignés peuvent rencontrer ceux des autres empires dans des conditions étroitement contrôlées."
 giga_mbrain_uplink_diplomacy_concept:0 "\n£job_giga_virtual_diplomat£ ['building:building_giga_matrioshka_brain_uplink_diplomacy', \"$giga_mbrain_uplink_diplomacy$\"]"
 giga_mbrain_uplink_hell:0 "Machine de Châtiment"
 building_giga_matrioshka_brain_uplink_hell:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_hell$"
 building_giga_matrioshka_brain_uplink_hell_desc:0 "Par condamnation criminelle, transgression sociale ou simple malchance de naissance, les détenus ici sont condamnés à souffrir pendant des éternités subjectives."
 giga_mbrain_uplink_hell_concept:0 "\n£job_giga_virtual_hell_inmate£ ['building:building_giga_matrioshka_brain_uplink_hell', \"$giga_mbrain_uplink_hell$\"]"
 giga_mbrain_uplink_livestock:0 "Champs de Rêve"
 building_giga_matrioshka_brain_uplink_livestock:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_livestock$"
 building_giga_matrioshka_brain_uplink_livestock_desc:0 "Permettre à notre bétail de vivre dans un monde virtuel spécialement conçu les maintient contrôlés, dociles... et tendres."
 giga_mbrain_uplink_livestock_concept:0 "\n£job_livestock£ ['building:building_giga_matrioshka_brain_uplink_livestock', \"$giga_mbrain_uplink_livestock$\"]"
 giga_mbrain_uplink_amalgamation:0 "Réseau de Rêves"
 building_giga_matrioshka_brain_uplink_amalgamation:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_amalgamation$"
 building_giga_matrioshka_brain_uplink_amalgamation_desc:0 "Il existe des champs. Des champs infinis, où les organiques ne naissent plus... ils sont cultivés."
 giga_mbrain_uplink_amalgamation_concept:0 "\n£job_organic_battery£ ['building:building_giga_matrioshka_brain_uplink_amalgamation', \"$giga_mbrain_uplink_amalgamation$\"]"
 giga_mbrain_uplink_foundry:0 "Affinage Métallurgique"
 building_giga_matrioshka_brain_uplink_foundry:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_foundry$"
 building_giga_matrioshka_brain_uplink_foundry_desc:0 "Expériences de conception industrielle itérative, exécutées à une vitesse fulgurante."
 giga_mbrain_uplink_foundry_concept:0 "\n£job_foundry£ ['building:building_giga_matrioshka_brain_uplink_foundry', \"$giga_mbrain_uplink_foundry$\"]"
 giga_mbrain_uplink_factory:0 "Optimisation de la Chaîne de Production"
 building_giga_matrioshka_brain_uplink_factory:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_factory$"
 building_giga_matrioshka_brain_uplink_factory_desc:0 "Des algorithmes de conception et de prédiction de marché de plus en plus sophistiqués nous permettent d'assurer l'offre avant la demande."
 giga_mbrain_uplink_factory_concept:0 "\n£job_artisan£ ['building:building_giga_matrioshka_brain_uplink_factory', \"$giga_mbrain_uplink_factory$\"]"
 giga_mbrain_uplink_refinery:0 "Matrice de Purification Chimique"
 building_giga_matrioshka_brain_uplink_refinery:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_refinery$"
 building_giga_matrioshka_brain_uplink_refinery_desc:0 "Une combinaison de relais à faible latence, d'instrumentation de précision et d'une puissance de calcul immense permet une évaluation des produits au niveau moléculaire."
 giga_mbrain_uplink_refinery_concept:0 "\n£job_gas_refiner£ ['building:building_giga_matrioshka_brain_uplink_refinery', \"$giga_mbrain_uplink_refinery$\"]"
 giga_mbrain_uplink_anti_deviancy:0 "Régulateur Comportemental"
 building_giga_matrioshka_brain_uplink_anti_deviancy:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_anti_deviancy$"
 building_giga_matrioshka_brain_uplink_anti_deviancy_desc:0 "Bien que coûteux en calcul, des algorithmes prédictifs ajustés pour anticiper la formation de groupes de drones déviants nous permettent d'intervenir avant que leurs effets ne deviennent significatifs."
 building_giga_matrioshka_brain_uplink_anti_deviancy_effect:0 "Réduit de manière multiplicative la valeur de base du £crime£ §Y$PLANET_CRIME_NO_HAPPINESS_TITLE$§! par drone de §G$@matrioshka_brain_uplink_anti_deviancy_reduction|0%$§!\n"
 giga_mbrain_uplink_anti_deviancy_concept:0 "\n£job_patrol_drone£ ['building:building_giga_matrioshka_brain_uplink_anti_deviancy', \"$giga_mbrain_uplink_anti_deviancy$\"]"
 giga_mbrain_uplink_robot:0 "Coordinateur des Unités de Travail"
 building_giga_matrioshka_brain_uplink_robot:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_robot$"
 building_giga_matrioshka_brain_uplink_robot_desc:0 "L'efficacité de nos unités de travail robotiques peut être améliorée grâce à des processus de gestion de haut niveau et à une micromanagement localisé. L'autonomie individuelle des unités est réduite, mais cela peut être considéré comme une perte acceptable."
 building_giga_matrioshka_brain_uplink_robot_effect_servitude:0 "L'effet est augmenté lorsque la politique §Y$policy_artificial_intelligence_policy$§! est définie sur §Y$ai_servitude_name$§!"
 building_giga_matrioshka_brain_uplink_robot_effect_servitude_or_ban:0 "L'effet est augmenté lorsque la politique §Y$policy_artificial_intelligence_policy$§! est définie sur §Y$ai_servitude_name$§! ou §Y$ai_outlawed_name$§!"
 giga_mbrain_uplink_robot_concept:0 "\n£job_roboticist£ ['building:building_giga_matrioshka_brain_uplink_robot', \"$giga_mbrain_uplink_robot$\"]"
 giga_mbrain_uplink_virtual:0 "Accélérateur de Routage"
 building_giga_matrioshka_brain_uplink_virtual:0 "$giga_mbrain_uplink$: $giga_mbrain_uplink_virtual$"
 building_giga_matrioshka_brain_uplink_virtual_desc:0 "La gestion des tâches et le routage des signaux sont des problèmes complexes dans un réseau de cette taille, mais en y consacrant suffisamment de ressources computationnelles, nous avons obtenu des résultats prometteurs. Parfois, la quantité peut être une forme de qualité."
 building_giga_matrioshka_brain_uplink_virtual_effect:0 "Divise par deux le nombre de colonies de base pour cette planète, de manière multiplicative"
 giga_mbrain_uplink_virtual_concept:0 "\n£job_mind_thrall£ ['building:building_giga_matrioshka_brain_uplink_virtual', \"$giga_mbrain_uplink_virtual$\"]"
 job_giga_media_coordinator:0 "Mogul des Médias"
 job_giga_media_coordinator_plural:0 "Moguls des Médias"
 job_giga_media_coordinator_desc:0 "Les esprits créatifs derrière les empires du divertissement virtuel, ces moguls s’assurent que notre population ne manque jamais de distractions. Lumières. Caméra. ACTION !"
 job_giga_media_coordinator_effect_desc:0 "£job_giga_media_coordinator£ $job_giga_media_coordinator_plural$ transforment £consumer_goods£ §Y$consumer_goods$§! en £unity£ §Y$unity$§!, £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!, et £mod_trade_value_add£ §Y$TRADE_VALUE$§!, tout en augmentant légèrement £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§! dans tout l’empire."
 mod_job_giga_media_coordinator_add:0 "$job_giga_media_coordinator$ Emplois "
 mod_job_giga_media_coordinator_per_pop:0 "§G+1§! emploi de $job_giga_media_coordinator$ par palier de $VALUE$ Pops "
 mod_job_giga_media_coordinator_per_pop_short:0 "\n§G+1§! £mod_job_giga_media_coordinator_add£ par $VALUE$ £pop£"
 job_giga_media_coordination_drone:0 "Drone de Coordination Médias"
 job_giga_media_coordination_drone_plural:0 "Drones de Coordination Médias"
 job_giga_media_coordination_drone_desc:0 "Ces clusters de drones spécialisés produisent un flux ininterrompu de contenu adapté aux préférences des sujets organiques de l’intelligence machine."
 job_giga_media_coordination_drone_effect_desc:0 "£job_giga_media_coordination_drone£ $job_giga_media_coordination_drone_plural$ transforment £consumer_goods£ §Y$consumer_goods$§! en £unity£ §Y$unity$§! et £mod_planet_amenities_no_happiness_add£ §Y$PLANET_AMENITIES_TITLE$§!, tout en augmentant légèrement £mod_planet_amenities_no_happiness_add£ §Y$PLANET_AMENITIES_TITLE$§! dans tout l’empire."
 mod_job_giga_media_coordination_drone_add:0 "$job_giga_media_coordination_drone$ Emplois"
 mod_job_giga_media_coordination_drone_per_pop:0 "§G+1§! emploi de $job_giga_media_coordination_drone$ par palier de $VALUE$ Pops"
 mod_job_giga_media_coordination_drone_per_pop_short:0 "\n§G+1§! £mod_job_giga_media_coordinator_add£ par $VALUE$ £pop£"
 job_giga_gamer_fe_game_master:0 "Maître du Jeu"
 job_giga_gamer_fe_game_master_plural:0 "Maîtres du Jeu"
 job_giga_gamer_fe_game_master_desc:0 "Ces individus studieux utilisent la vaste puissance de calcul du Cerveau Matrioshka pour créer des mondes complexes, destinés aux autres résidents du Simulateur de Réalité."
 job_giga_gamer_fe_game_master_effect_desc:0 "£job_giga_gamer_fe_game_master£ $job_giga_gamer_fe_game_master_plural$ améliorent la £stability£ §YStabilité§! de la planète et aident leurs joueurs à atteindre leur plein potentiel."
 mod_job_giga_gamer_fe_game_master_add:0 "$job_giga_gamer_fe_game_master$ Emplois"
 mod_job_giga_gamer_fe_game_master_per_pop:0 "§G+1§! emploi de $job_giga_gamer_fe_game_master$ par palier de $VALUE$ Pops"
 mod_job_giga_gamer_fe_game_master_per_pop_short:0 "\n§G+1§! £mod_giga_gamer_fe_game_master_add£ par $VALUE$ £pop£"
 job_giga_gamer_fe_npc:0 "Personnage Non-Joueur"
 job_giga_gamer_fe_npc_plural:0 "Personnages Non-Joueurs"
 job_giga_gamer_fe_npc_desc:0 "Derrière chaque héros se cache une myriade de personnages secondaires, qu'ils soient amis, ennemis ou simples spectateurs. Si certains de ces rôles sont joués par les résidents du Simulateur de Réalité, la grande majorité sont des simulations sophistiquées."
