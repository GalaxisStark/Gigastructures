 giga_frameworld_nanite_consume_world_toggle_on_desc:0 "L'essaim va grandir."
 giga_frameworld_nanite_consume_world_toggle_on_effect:0 "Ce monde sera considéré comme une cible viable pour la décision §Y$giga_frameworld_nanite_consume_world$§! sur §Y[from.Capital.GetName]§!."
 giga_frameworld_nanite_consume_world_toggle_off:0 "Interdire l'Assimilation"
 giga_frameworld_nanite_consume_world_toggle_off_desc:0 "Certains mondes sont mieux laissés intacts."
 giga_frameworld_nanite_consume_world_toggle_off_effect:0 "Ce monde ne sera pas assimilé, préservant ainsi la planète."
 giga_frameworld_contract:0 "Détacher un Module"
 giga_frameworld_contract_desc:0 "Lorsque la charge du réseau est extrêmement élevée, des modules de station supplémentaires peuvent être plus un fardeau qu'un avantage."
 giga_frameworld_contract_effect:0 "Supprime une caractéristique d'expansion aléatoire de §Y[this.GetName]§!, réduisant £planetsize£ §Yla Taille de la Planète§!, ce qui peut réduire ['concept_giga_virtual_colony_size']."
 giga_frameworld_contract_need_expansions:0 "$TRIGGER_FAIL$ Nécessite que §Y[this.GetName]§! ait été étendu au moins une fois."
 giga_frameworld_upgrade_desc:0 "§BMise à niveau du $pc_giga_frameworld$§!\n "
 giga_frameworld_upgrade_warning:0 "§HCe projet de mise à niveau majeure bloquera tout autre projet jusqu'à son achèvement.§!\n "
 giga_frameworld_upgrade_upkeep:0 "§PAvertissement : Ce projet a un coût d'entretien important !§!\n"
 giga_frameworld_upgrade_fail:0 "$TRIGGER_FAIL$Requiert qu'aucun projet de mise à niveau majeure soit en cours."
 giga_frameworld_penrose:0 "$d_frameworld_penrose$"
 giga_frameworld_penrose_effect:0 "Début de la construction d'une Mégastructure à plusieurs étages qui, une fois achevée, remplacera les §Y$district_giga_frameworld_generator_plural$§! du $pc_giga_frameworld$ par un plus petit nombre de §Y$district_giga_frameworld_penrose_plural$§!.\n\n§Y$district_giga_frameworld_penrose_plural$§! nettement plus puissants, fournissant des emplois de £job_technician£§Y[owner.GetTechnician] supplémentaires§! mais plus coûteux que les districts qu'ils remplacent.\n\n$frameworld_penrose_fake_tooltip$"
 giga_frameworld_penrose_desc:0 "Un grand miroir construit autour du $pc_black_hole$ du système, est conçu pour exploiter la diffusion superradiante, générant de l'énergie avec une efficacité étonnante."
 giga_frameworld_decompressor:0 "$d_frameworld_decompressor$"
 giga_frameworld_decompressor_effect:0 "Commence la construction d'une Mégastructure à plusieurs étages qui, une fois achevée, remplacera les §Y$district_giga_frameworld_mining_plural$§! du $pc_giga_frameworld$ par un plus petit nombre de §Y$district_giga_frameworld_decompressor_plural$§!.\n\n§Y$district_giga_frameworld_decompressor_plural$§! nettement plus puissants qui fournissent des £job_miner£§Y[owner.GetMiner] emplois supplémentaires§! mais sont plus coûteux que les districts qu'ils remplacent."
 giga_frameworld_decompressor_desc:0 "Une installation de lentille gravitationnelle qui transforme les champs gravitationnels en forets capables d'extraire des matériaux du $pc_black_hole$.."
 giga_frameworld_advanced_city:0 "Améliorer les sections d'habitation des drones"
 giga_frameworld_advanced_city_effect:0 "Remplace les §Y$district_giga_frameworld_nexus_plural$§! du $pc_giga_frameworld$ par un plus petit nombre de §Y$district_giga_frameworld_nexus_advanced_plural$§!, et remplace deux £job_maintenance_drone£§Y$job_maintenance_drone_plural$§! emplois de chaque §Y$district_giga_frameworld_amenities_gestalt$§! par des £job_frame_maintenance_overseer£§Y$job_frame_maintenance_overseer_plural$§!\n\n§Y$district_giga_frameworld_nexus_advanced_plural$§! deux fois plus efficaces que les districts qu'ils remplacent.\n$job_frame_maintenance_overseer_effect_desc$\n"
 giga_frameworld_advanced_hive_effect:0 "Remplace les §Y$district_giga_frameworld_hive_plural$§! par des §Y$district_giga_frameworld_hive_advanced_plural$§!, et remplace deux emplois de £job_maintenance_drone£§Y$job_maintenance_drone_plural$§! par £job_frame_maintenance_overseer£§Y$job_frame_maintenance_overseer_plural$§!.\n\n§Y$district_giga_frameworld_hive_advanced_plural$§! sont deux fois plus efficaces que les districts qu’ils remplacent."
 giga_frameworld_advanced_nexus_effect:0 "Remplace les §Y$district_giga_frameworld_nexus_plural$§! par des §Y$district_giga_frameworld_nexus_advanced_plural$§!, et remplace deux emplois de £job_maintenance_drone£§Y$job_maintenance_drone_plural$§! par £job_frame_maintenance_overseer£§Y$job_frame_maintenance_overseer_plural$§!.\n\n§Y$district_giga_frameworld_nexus_advanced_plural$§! sont deux fois plus efficaces que les districts qu’ils remplacent."
 giga_frameworld_advanced_city_desc:0 "L'amélioration de la conception des stations d'habitation et de stockage permettra une meilleure organisation des espaces de vie."
 giga_frameworld_advanced_industrial:0 "Développer l'industrie lourde"
 giga_frameworld_advanced_industrial_foundry_effect:0 "Remplace les §Y$district_giga_frameworld_foundry_plural$§! par un nombre réduit de §Y$district_giga_frameworld_foundry_advanced_plural$§!.\n\n§Y$district_giga_frameworld_foundry_advanced_plural$§! fournissent 2 emplois supplémentaires de £job_fabricator£§Y[owner.GetAlloyProducer]§!, mais nécessitent £volatile_motes£ §Y$volatile_motes$§! pour l'entretien."
 giga_frameworld_advanced_industrial_factory_effect:0 "Remplace les §Y$district_giga_frameworld_factory_plural$§! par un nombre réduit de §Y$district_giga_frameworld_factory_advanced_plural$§!.\n\n§Y$district_giga_frameworld_factory_advanced_plural$§! fournissent 2 emplois supplémentaires de [owner.GetArtisanIcon]§Y[owner.GetArtisan]§!, mais nécessitent £rare_crystals£ §Y$rare_crystals$§! pour l'entretien."
 giga_frameworld_advanced_industrial_desc:0 "L'introduction de procédés industriels avancés utilisant des matériaux exotiques, associée à l'extension des installations de fonderie, améliorera considérablement le rendement."
 giga_frameworld_advanced_sanctuary:0 "Projet Arcologie du Sanctuaire"
 giga_frameworld_advanced_sanctuary_effect:0 "Remplace les  §Y$district_giga_frameworld_sanctuary_plural$§! du $pc_giga_frameworld$ par un plus petit nombre de §Y$district_giga_frameworld_sanctuary_advanced_plural$§!.\n\n§Y$district_giga_frameworld_sanctuary_advanced_plural$§! pouvant accueillir deux fois plus de £job_bio_trophy£ §Y$job_bio_trophy_plural$§! que les districts qu'ils remplacent."
 giga_frameworld_advanced_sanctuary_desc:0 "La réimagination stratégique de la satisfaction des besoins organiques et des installations de divertissement permettra une densité d'habitation beaucoup plus élevée sans sacrifier la fonction ou le confort."
 giga_frameworld_gaia:0 "Modernisation des systèmes de soutien environnemental"
 giga_frameworld_gaia_desc:0 "Des systèmes de contrôle climatique avancés, conçus pour fournir des environnements idéaux pour toutes les formes de vie organique."
 giga_frameworld_computing_complex:0 "Modernisation des installations de traitement des données"
 giga_frameworld_computing_complex_desc:0 "Des installations dédiées au stockage de données à haute densité et au traitement accéléré de l'information amélioreront considérablement notre capacité de recherche."
 giga_frameworld_expand_infrastructure:0 "Développer l'infrastructure des stations"
 giga_frameworld_expand_infrastructure_desc:0 "L'amélioration du débit des installations de fabrication et de maintenance des stations nous permettra de prendre en charge un plus grand nombre de modules."
 giga_frameworld_orbital_ring_upgrade:0 "Construire des Orbites de Traitement"
 giga_frameworld_orbital_ring_upgrade_desc:0 "$d_frameworld_orbital_ring_desc$"
 giga_frameworld_nanites:0 "Infusion Nanotechnologique"
 giga_frameworld_nanites_desc:0 "Nous avons changé notre nature, et nous devons maintenant compléter le processus."
 giga_frameworld_nanites_effect:0 "Débloque les décisions d'expansion coûtant £nanites£ §Y$nanites$§!\n\nModernise plusieurs districts avec la nanotechnologie:\n\n§H$district_giga_frameworld_foundry$:§!\n- Produit directement des £alloys£ §Y$alloys$§! supplémentaires\n- Augmente l’entretien en £energy£ §Y$energy$§!\n- Nécessite un entretien supplémentaire en £nanites£ §Y$nanites$§!\n\n§H$district_giga_frameworld_science$:§!\n- Supprime 1 emploi de [owner.GetResearcherIcon] §Y[owner.GetResearcher]§!\n- Ajoute 3 emplois de [owner.GetNanotechResearcherIcon] §Y[owner.GetNanotechResearcher]§!\n- Nécessite un entretien supplémentaire en £nanites£ §Y$nanites$§!\n\n§H$district_giga_frameworld_refinery$:§!\n- Produit directement des ressources stratégiques supplémentaires $giga_r_motes$$giga_r_gases$$giga_r_crystals$\n- Augmente l’entretien en £energy£ §Y$energy$§!\n- Nécessite un entretien supplémentaire en £nanites£ §Y$nanites$§!"
 giga_frameworld_maginot:0 "Mettre en oeuvre la doctrine Maginot"
 giga_frameworld_maginot_effect:0 "Débloque les mécanismes §Y$name_maginot$§!, améliorant le potentiel défensif du $pc_giga_frameworld$ de multiples façons :\n\nAjoute une §Y$strategic_defence_command_platform$§!, station défensive évolutive immensément puissante capable d'affronter des flottes entières\n\nAjoute 3 §Y$frameworld_defensive_station_plural$§! supplémentaires au périmètre défensif du $pc_giga_frameworld$\n\npermet la construction de §Y$district_giga_frameworld_maginot_shield_generators$§! et §Y$district_giga_frameworld_maginot_planetary_cannons$§! districts, qui renforcent les défenses spatiales et fournissent des armées spéciales\n\n§Y$district_giga_frameworld_fortress_plural$§! fournissent des armées de défense puissantes supplémentaires\n\nPermet un §YSystème de perturbation subspatiale§! 'activable' qui bloque la formation de vortex et le fonctionnement des moteurs de saut dans ce système et les systèmes adjacents\n\n."
 giga_frameworld_maginot_desc:0 "Nous comprenons maintenant les limites absurdes auxquelles une planète peut être fortifiée, et grâce à ces connaissances, nous voyons clairement comment améliorer nos propres défenses."
