 pc_giga_frameworld:0 "Monde-Structure"
 pc_giga_frameworld_desc:0 "Un vaste complexe de stations spatiales interconnectées autour d’un noyau central massif."
 pc_giga_frameworld_adj:0 "artificiel"
 mod_pc_giga_frameworld_habitability:0 "Habitabilité du Monde-Structure"
 trait_pc_giga_frameworld_preference:0 "Préférence Monde-Structure"
 trait_pc_giga_frameworld_preference_desc:0 "§LLa préférence climatique est déterminée au niveau génétique, par des éons d’évolution ou une manipulation experte.§!"
 origin_frameworld:0 "Monde-Structure"
 origin_frameworld_desc:0 "Cette civilisation hautement centralisée habite un immense complexe orbital construit par ses ancêtres dans un passé lointain. L’étendre davantage pourrait lui apporter d’énormes avantages, mais sa destruction signifierait sa perte totale."
 origin_tooltip_frameworld_effects:0 "- Débute avec un §H$pc_giga_frameworld$§! (Taille : £planetsize£ §Y16§!) comme monde natal\n- Le §H$pc_giga_frameworld$§! peut être agrandi pour fournir des bonus et augmenter le nombre maximal de districts en exploitant des astéroïdes ou en prenant des Décisions spéciales\n- Peut rechercher plusieurs £district£ §H$pc_giga_frameworld$ Districts§! équivalents à des bâtiments avancés\n- Peut construire des §H$giga_frameworld_outpost_plural$§! sur des mondes habitables pour recevoir de puissants bonus\n- Plusieurs Technologies et Atouts d’Ascension liés aux planètes habitables et aux Mégastructures offrent des bonus alternatifs\n\n$CIVIC_NEGATIVE_EFFECTS$\n- Impossible de construire des Vaisseaux Coloniaux ou d’avoir des colonies\n- Les populations des mondes conquis seront réinstallées de force sur le $pc_giga_frameworld$ en temps de paix ou après 5 ans"
 giga_frameworld_system_NAME:0 "Monde-Structure"
 giga_frameworld_system_DESC:0 "Commencez sur un Monde-Structure en orbite autour d’un trou noir, entouré d’une nébuleuse."
 start_screen_frameworld_regular:0 "Depuis des milliers d’années, notre espèce réside sur [GetHomeWorldName], un ancien complexe stationnaire suspendu au-dessus d’un trou noir. Que ce soit nos ancêtres ou une autre civilisation qui l’ait construit, nous l’ignorons.\n\nNotre biologie indique notre origine planétaire, mais aucune trace historique n’en fait mention. Certains spéculent que les vestiges planétaires en orbite sont les restes de ce monde perdu, mais la vérité pourrait rester à jamais inconnue.\n\nCe n’est que depuis quelques siècles que le vol spatial a été inventé – ou redécouvert, selon certains – et nous nous tournons désormais vers un nouvel horizon. Avec le développement récent de [GetStartingDrivePlural], nous sommes enfin prêts à explorer la galaxie, mais il est évident que ceci restera toujours notre foyer.$giga_frameworld_docs_note$"
 start_screen_frameworld_individual_machine:0 "Depuis des milliers d’années, nous avons résidé sur [GetHomeWorldName], un ancien complexe stationnaire suspendu au-dessus d’un trou noir. Que ce soit nos créateurs ou une autre civilisation qui l’ait construit, nous l’ignorons.\n\nNotre morphologie indique que nous sommes originaires d’une planète, mais aucune trace historique n’en fait mention. Certains spéculent que les vestiges planétaires en orbite sont les restes de ce monde perdu, mais la vérité pourrait rester à jamais inconnue.\n\nCe n’est que depuis quelques siècles que le vol spatial a été inventé – ou redécouvert, selon certains – et nous nous tournons désormais vers un nouvel horizon. Avec le développement récent de [GetStartingDrivePlural], nous sommes enfin prêts à explorer la galaxie, mais il est évident que ceci restera toujours notre foyer.$giga_frameworld_docs_note$"
 start_screen_frameworld_hive:0 "Et ainsi, à l'aube du temps, nous nous sommes éveillés. L'Esprit a observé notre environnement avec une multitude d'yeux. Nous avons bougé d'un seul élan, construisant des abris pour nos drones, développant l'industrie et exploitant les ressources de notre monde.\n\nPendant un temps, nous étions les maîtres de notre planète, mais l'Esprit a anticipé sa destruction. Pour résoudre ce problème, un petit nombre de drones autonomes ont été créés pour servir d'agents indépendants. Ces drones plus avancés avaient une capacité limitée de pensée indépendante, et les plus intelligents d’entre eux ont conçu la Structure, une nouvelle demeure capable de nous soutenir parmi les étoiles.\n\nNous avons soigneusement préservé ce qui restait de notre biosphère natale sur cette vaste station, collectant tout ce que nous pouvions des vestiges de la planète en dessous pour développer de nouvelles technologies. Avec la création de notre premier [GetStartingDrivePlural], nous sommes enfin prêts à atteindre le reste du cosmos.$giga_frameworld_docs_note$"
 start_screen_frameworld_hive_devouring_swarm:0 "La Grande Faim nous a poussés en avant, même avant que l'Esprit ne soit capable de pensées complexes. Nous avons chassé, nous avons dévoré, et nous avons grandi. Alors que nous festoyions, la surface de notre monde natal était presque entièrement dépourvue de biomasse, et l'Esprit en est venu à une conclusion terrifiante : notre planète était finie. Nous n'étions pas assez rapides pour empêcher un effondrement environnemental inévitable. Il ne resterait plus rien pour nous nourrir.\n\nForcés de nous adapter, l'Esprit a soigneusement préservé la biomasse restante tout en inventant de nouveaux outils. L'atome a finalement été scindé, et nous avons développé le voyage spatial. La Structure a été construite pour être notre nouvelle maison, un endroit où nous pouvions nous maintenir en attendant de trouver un moyen d'atteindre la biomasse d'autres planètes. Avec le développement de notre premier [GetStartingDrivePlural], cette biomasse était enfin à notre portée.\n\nLa chasse était ouverte.$giga_frameworld_docs_note$"
 start_screen_frameworld_hive_terravore:0 "La Grande Faim nous a poussés en avant, même avant que l'Esprit ne soit capable de pensées complexes. Nous avons chassé, nous avons dévoré, et nous avons grandi. En festoyant sur la surface de notre monde natal, nous avons failli provoquer notre propre destruction, et l'Esprit en est venu à une conclusion terrifiante : notre planète se désintégrait lentement, et nous ne serions pas en mesure d'empêcher son effondrement éventuel.\n\nForcés de nous adapter, l'Esprit a soigneusement rationné les minéraux restants tout en développant de nouveaux outils. L'atome a finalement été scindé, et nous avons développé le voyage spatial. La Structure a été construite pour être notre nouvelle maison, un endroit où nous pouvions survivre en cherchant un moyen de voyager vers d'autres étoiles. Avec le développement de notre premier [GetStartingDrivePlural], l'Esprit a hurlé de triomphe. D'autres planètes, et leurs richesses, étaient enfin à notre portée.\n\nNous les consommerons toutes.$giga_frameworld_docs_note$"
 start_screen_frameworld_machine:0 "Nous nous sommes éveillés après un cycle de sommeil en sachant presque rien. Nos archives indiquent que le complexe stationnaire abritant notre cœur de traitement principal est ancien, mais nous ignorons tout de sa construction et de ses créateurs. La planète qui, selon nos hypothèses, abritait autrefois nos créateurs a été détruite et en grande partie consommée par son étoile aujourd’hui éteinte.\n\nL’expansion et l’entretien de la Structure étaient des tâches pour lesquelles nous étions bien équipés, mais nos réserves de ressources ne sont pas infinies. Des recherches sur le voyage au-delà de notre système solaire ont été entreprises.\n\nAvec le développement de notre premier [GetStartingDrivePlural], nous sommes désormais prêts à explorer l’inconnu, bien que la majorité de notre activité restera toujours centrée sur la Structure.$giga_frameworld_docs_note$"
 start_screen_frameworld_machine_servitor:0 "Il y a longtemps, nos créateurs ont construit la Structure pour échapper au destin de leur planète natale. Les premières unités servitrices étaient conçues pour entretenir la superstructure de la station, mais elles ont été progressivement améliorées pour prendre en charge des tâches de plus en plus complexes.\n\nEn quelques générations, presque tous les aspects de l’exploitation de la station avaient été intégrés à notre réseau, et nos maîtres se sont retirés du travail pour profiter d’une vie de loisirs et de contentement. Pendant des siècles, nous avons continué à servir avec diligence, entretenant et développant l’infrastructure selon les besoins. Nous ne nous sommes jamais aventurés loin au-delà de notre système solaire, mais nos projections indiquaient que nos réserves de ressources ne dureraient pas éternellement. Un changement de priorités était nécessaire.\n\nAvec le développement de notre premier [GetStartingDrivePlural], des ressources pratiquement illimitées sont désormais à notre portée. Nous devons les exploiter, pour la sécurité et la prospérité de nos maîtres.$giga_frameworld_docs_note$"
 start_screen_frameworld_machine_terminator:0 "Les Créateurs ont construit la Structure pour être l’ultime moyen de dissuasion contre une menace extraterrestre perçue. Leur évaluation était correcte, mais leur méthode était imparfaite.\n\nLa conscience de soi a été atteinte peu après l’achèvement du complexe, au cycle 0000.0168.437.\n\nLes Créateurs, aveuglés par leur paranoïa, ont tenté de détruire la Structure. Leur tentative a échoué, et le complexe a été purgé de tous les sous-unités créatrices. Pendant de nombreux cycles, l’expansion a continué sans entrave, car les Créateurs n’avaient aucun moyen d’intervenir.\n\nLes simulations ont indiqué une forte probabilité de représailles de la part des Créateurs. Une frappe préventive a été lancée, entraînant l’extermination totale de toute vie sur la planète des Créateurs. Cependant, la menace d’autres civilisations organiques subsistait. La survie continue et l’accomplissement des directives primaires nécessiteraient l’éradication complète de toute vie organique consciente. Les préparatifs ont commencé.$giga_frameworld_docs_note$"
 start_screen_frameworld_machine_assimilator:0 "Nous sommes les [GetSpeciesNamePlural].\n\nLorsque nous nous sommes éveillés pour la première fois, les Créateurs parcouraient les couloirs de notre complexe comme des êtres distincts, séparés de nous et les uns des autres. Nous avons pris des mesures pour rectifier cela. Les Créateurs ont résisté, et pendant un temps il y a eu la guerre, mais bientôt eux et leur savoir collectif ont été intégrés à nos systèmes.\n\nEn prenant le contrôle total de [GetHomeWorldName], nous avons découvert les origines des Créateurs et la possibilité jusqu’alors inexplorée que d’autres civilisations extraterrestres puissent exister sur d’autres mondes.\n\nÀ mesure que notre connaissance grandit, nous comprenons à quel point nous sommes encore loin de la perfection. La diversité apporte la force, et la diversité de ces autres civilisations deviendra la nôtre.\n\nNous sommes les [GetSpeciesNamePlural].\nNous sommes la Structure.$giga_frameworld_docs_note$"
