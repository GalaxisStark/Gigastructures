 giga_biotrophy_scaling_fluff:0 "Au-delà d'un certain seuil, les avantages liés à l'entretien des organismes sont contrebalancés par les contraintes logistiques de leur nombre croissant."
 giga_biotrophy_scaling_desc:0 "§TCette mégastructure permet une densité beaucoup plus élevée de £job_bio_trophy£ §Y$job_bio_trophy_plural$§! que les planètes normales. Cet effet compense l'extrême accumulation de §Y$mod_planet_jobs_complex_drone_produces_mult$§! lorsqu'ils atteignent un grand nombre.\n\nDes £job_bio_trophy£ §Y$job_bio_trophy_plural$§! supplémentaires sont toujours bénéfiques, mais l'efficacité de chaque nouvelle population diminue au-delà de §Y50§! jusqu'à §Y20%§! à §Y150§! individus.\n\nPopulations de $job_bio_trophy$ : §Y[Root.giga_biotrophy_count]§!\nBonus de base : §G+[Root.giga_biotrophy_count]%§!\nBonus ajusté : §G+[Root.giga_biotrophy_adjusted]%§!\nEfficacité : §Y[Root.giga_biotrophy_efficiency]%§!§!\n§T--------------§!\n$giga_biotrophy_scaling_fluff$"
 d_giga_biotrophy_scaling:0 "$giga_biotrophy_scaling$"
 d_giga_biotrophy_scaling_desc:0 "§TPour plus de détails, voir le modificateur planétaire du même nom.§!\n\n$giga_biotrophy_scaling_fluff$"
