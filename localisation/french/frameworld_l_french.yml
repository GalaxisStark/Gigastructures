 giga_situation_frameworld_outposts_desc:0 "Les §Y$giga_frameworld_outpost_plural$§! remplacent les colonies pour les empires $origin_frameworld$, et fournissent d'importants bonus de croissance au $pc_giga_frameworld$. Le bonus total de notre réseau peut être consulté ici.\n\nLe modificateur $EMPIRE_SIZE$ est équivalent au même nombre de colonies, y compris les modificateurs de £mod_empire_size_colonies_mult£ §Y$MOD_EMPIRE_SIZE_COLONIES_MULT_ORIGINAL$§!."
