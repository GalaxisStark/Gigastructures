 giga_frameworld_expand_concurrent:0 "$TRIGGER_FAIL$La Planète ne doit pas avoir d'autre décision de fabrication de station en file d'attente."
 giga_frameworld_expand_desc_cost:0 "La construction de modules de station avec des $alloys$ augmente le coût d'un facteur de §Y[this.giga_frameworld_expansion_cost_exponent]x§! pour chaque module déjà construit. Les modifications de ce facteur affectent rétroactivement le coût total."
