 frameworld_harvest_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_project$ - $giga_list_category_special$\nDémantelez n'importe quel astéroïde pour obtenir les matières premières nécessaires à l'expansion du §Y$pc_giga_frameworld$§!\n§LUne construction à grande échelle nécessite l'acquisition de ressources à grande échelle§!."
 frameworld_harvest_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - Développe le §Y$pc_giga_frameworld$§! une fois, en ajoutant en plus §G+1§! §Y$mod_district_giga_frameworld_mining_max$ par 4 récoltes§!.\n\nLe coût augmente avec les modificateurs £mod_planet_clear_blocker_cost_mult£ §Y$MOD_COUNTRY_CLEAR_BLOCKER_COST_MULT$§!.\n\nEffets d'extension :\n\n$frameworld_size_fake_tooltip$\n\n$frameworld_expansion_fake_tooltip$\n\n$frameworld_asteroid_fake_tooltip$"
 frameworld_salvage_habitat_0:0 "Sauvegarde de l'habitat"
 frameworld_salvage_habitat_0_DESC:0 "Si vous pouvez voir ça, c'est que quelque chose a mal tourné."
 frameworld_salvage_habitat_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_project$ - $giga_list_category_special$\nDémanteler une station d'habitat pour obtenir des matériaux permettant d'étendre le §Y$pc_giga_frameworld$§!\n§LLes installations orbitales étrangères peuvent être réutilisées pour nos propres besoins.§!"
 frameworld_salvage_habitat_0_CONSTRUCTION_INFO_DELAYED:0 "Le coût varie en fonction des modificateurs £mod_planet_clear_blocker_cost_mult£ §Y$MOD_COUNTRY_CLEAR_BLOCKER_COST_MULT$§!. Les effets d'expansion par taille d'habitat sont les suivants :\n\n\n$frameworld_expansion_fake_tooltip$."
