 giga_frameworld_outpost_icon_desc:0 "Ce système contient un ou plusieurs §Y$giga_frameworld_outpost_plural$§!\n\nLes §Y$giga_frameworld_outpost_plural$§! sont des colonies mineures appartenant à des empires ayant l'origine §Y$origin_frameworld$§!. Ils n'ont pas besoin d'être envahis pour capturer le système."
