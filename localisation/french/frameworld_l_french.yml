 giga_frameworld_outpost_stripmine_mode_allow:0 "Autoriser"
 giga_frameworld_outpost_stripmine_mode_allow_desc:0 "Ce monde sera considéré comme une cible viable pour la décision §Y$giga_frameworld_consume_world$§! sur §Y[this.Capital.GetName]§!."
 giga_frameworld_outpost_stripmine_mode_deny:0 "Interdire"
 giga_frameworld_outpost_stripmine_mode_deny_desc:0 "Ce monde ne sera pas exploité, préservant ainsi la planète et toute production de ressources de l’avant-poste."
 giga_frameworld_nanite_consume_world:0 "Assimiler un Monde Avant-Poste"
 giga_frameworld_nanite_consume_world_desc:0 "$decision_nanotech_swarm_consume_world_desc$"
 giga_frameworld_nanite_consume_world_effect:0 "\nUne planète $frameworld_outpost_0$ viable aléatoire recevra un bloqueur §Y$d_frameworld_nanite_damage$§!, produisant £nanites£ §Y$nanites$§! et augmentant la production de ressources de l'avant-poste de §Y10%§!\n\nChaque $frameworld_outpost_0$ peut être assimilé jusqu'à §Y3§! fois."
