 giga_frameworld_reorganise:0 "Programme d'optimisation de la logistique"
 giga_frameworld_reorganise_desc:0 "Pour assurer le bon fonctionnement de toutes les fonctions de la station, les réseaux de transport et les installations de fabrication doivent être régulièrement inspectés, évalués et réorganisés pour une efficacité maximale."
 giga_frameworld_consume_world:0 "Exploitation Minière d'un Monde"
 giga_frameworld_consume_world_desc:0 "Extraction à grande échelle de matières premières à partir des $frameworld_outpost_0$."
 giga_frameworld_consume_world_desc_hive:0 "$decision_lithoid_swarm_consume_world_desc$"
 giga_frameworld_consume_world_desc_nonhive:0 "La collecte à grande échelle de matériaux de surface fournira des ressources abondantes."
 giga_frameworld_consume_world_effect:0 "\nUne planète $frameworld_outpost_0$ viable aléatoire recevra un bloqueur §Y$d_frameworld_terravore_damage$§!, réduisant la production de ressources de l’avant-poste de §Y25%§!\n\nChaque $frameworld_outpost_0$ peut être exploité jusqu'à §Y3§! fois."
 giga_frameworld_consume_world_allow:0 "$TRIGGER_FAIL$ Nécessite un $frameworld_outpost_0$ avec l'exploitation minière activée et moins de trois bloqueurs §Y$d_frameworld_terravore_damage$§!."
 giga_frameworld_consume_world_toggle_on:0 "Autoriser l'Exploitation Minière"
 giga_frameworld_consume_world_toggle_on_desc:0 "Les richesses minérales de la galaxie sont à notre portée. Nous devrions les saisir."
 giga_frameworld_consume_world_toggle_on_effect:0 "Ce monde sera considéré comme une cible viable pour la décision §Y$giga_frameworld_consume_world$§! sur §Y[from.Capital.GetName]§!."
 giga_frameworld_consume_world_toggle_off:0 "Interdire l'Exploitation Minière"
 giga_frameworld_consume_world_toggle_off_desc:0 "Certains mondes sont mieux laissés intacts."
 giga_frameworld_consume_world_toggle_off_effect:0 "Ce monde ne sera pas exploité, préservant ainsi la planète et toute production de ressources de l’avant-poste."
