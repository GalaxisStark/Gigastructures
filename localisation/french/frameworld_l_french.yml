 pc_giga_frameworld_outpost_planet:0 "Monde Avant-Poste de la Structure"
 pc_giga_frameworld_outpost_planet_desc:0 "Un monde habitable, actuellement surveillé par une grande station spatiale. Des groupes d'expédition depuis la station visitent régulièrement la surface, menant des relevés et réalisant une extraction légère de ressources.\n\nAucune colonie permanente active ne peut être trouvée à la surface."
 pc_giga_frameworld_outpost_planet_adj:0 "Secondaire"
 pc_giga_frameworld_outpost_artificial:0 "$pc_giga_frameworld_outpost_planet$"
 pc_giga_frameworld_outpost_artificial_desc:0 "Une structure habitable, actuellement surveillée par une grande station spatiale. Des groupes d'expédition visitent régulièrement la surface, effectuant des relevés et entreprenant une extraction de ressources légère.\n\nAucune colonie permanente active ne peut être trouvée sur la surface."
