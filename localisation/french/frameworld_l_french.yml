 frameworld_penrose_2:0 "$name_penrose$"
 frameworld_penrose_2_DESC:0 "Entièrement entourée de miroirs, l'énergie peut maintenant être générée par l'ergosphère du $pc_black_hole$."
 frameworld_decompressor_0:0 "$matter_decompressor_4$ Supports structurels"
 frameworld_decompressor_0_DESC:0 "Superstructure conçue pour supporter un énorme anneau d'installations de traitement des matériaux au-dessus du $pc_black_hole$. du système."
 frameworld_decompressor_1:0 "$matter_decompressor_4$ Anneau de traitement"
 frameworld_decompressor_1_DESC:0 "Une installation colossale dédiée à la transformation des matières extraites en minéraux utilisables."
 frameworld_decompressor_2:0 "$matter_decompressor_4$ Tableau d'alésage"
 frameworld_decompressor_2_DESC:0 "Un réseau d'installations de lentilles gravitationnelles qui tordent les champs gravitationnels pour en faire des forets capables d'extraire des matériaux du $pc_black_hole$.."
 frameworld_origin_colony_cost:0 "Pénalité pour coût de colonie"
 frameworld_origin_colony_cost_desc:0 "§W§EModificateur de compatibilité :§! Désactiver complètement la construction de $colonizer_plural$ nécessite des écrasements invasifs qui ne sont pas facilement compatibles avec d'autres mods.\n\nSi un $colonizer$ est obtenu d'une manière ou d'une autre, il peut toujours être utilisé pour fonder une colonie, mais les colons seront réinstallés de la même manière qu'un monde conquis.§!\n§W--------------§!\n§LNotre architecture réseau est fondamentalement incompatible avec les exigences de la colonisation planétaire décentralisée. Nous sommes intrinsèquement liés au Cadre.§!"
 frameworld_outpost_bonus:0 "Réseau d'$giga_frameworld_outpost$"
 frameworld_outpost_bonus_desc:0 "§LPlus petites que les colonies des autres civilisations spatiales, nos $giga_frameworld_outpost_plural$ auxiliaires étendent notre influence aux mondes lointains.§!"
 giga_frameworld_outpost_empire_size_modifier_text:0 "et $giga_frameworld_outpost_plural$"
 giga_frameworld_outpost_pops_modifier_text:0 "Pops supplémentaires lors de la construction de $giga_frameworld_outpost_plural$"
 frameworld_expanded_maintenance_protocol:0 "Protocoles de maintenance étendus"
 frameworld_expanded_maintenance_protocol_desc:0 "Permettre à des drones non assignés de rester inactifs représente un facteur de gaspillage inacceptable. Ces drones seront redistribués à des tâches secondaires, en maintenant et en assistant d'autres fonctions de la station si nécessaire."
 frameworld_expanded_maintenance_protocol_tooltip:0 "Les pops chômeurs §Yau-delà du 5ème§! de ce $pc_giga_frameworld$ seront employés comme £job_frame_maintenance_drone£ §Y$job_frame_maintenance_drone_plural$§!\n\n$job_frame_maintenance_drone_effect_desc$."
 frameworld_expanded_maintenance_protocol_gestalt:0 "$frameworld_expanded_maintenance_protocol$"
 frameworld_expanded_maintenance_protocol_gestalt_desc:0 "Laisser les drones non assignés inactifs représente un gaspillage inacceptable. Ces drones seront redistribués à des tâches secondaires, assurant l'entretien et l'assistance aux autres fonctions de la station selon les besoins."
 frameworld_expanded_maintenance_protocol_gestalt_tooltip:0 "Les pops sans emploi §Yau-delà du 5e§! sur ce $pc_giga_frameworld$ seront plutôt employés comme £job_frame_maintenance_drone£ §Y$job_frame_maintenance_drone_plural$§!\n\n$job_frame_maintenance_drone_effect_desc$"
 frameworld_ai_build_cooldown:0 "Temps de recharge de la construction de l'IA du $pc_giga_frameworld$"
 frameworld_ai_build_cooldown_desc:0 "Période de temps de recharge pour les événements d'aide à l'IA."
 frameworld_ai_artisans:0 "Ajustement des $job_artisan_drone$"
 frameworld_ai_artisans_desc:0 "Une aide à la gestion des emplois par l'IA."
 frameworld_conquered:0 "Sur-extension administrative"
 frameworld_conquered_desc:0 "Ce monde est en plein chaos suite à un changement de propriétaire."
 frameworld_conquered_tooltip:0 "La croissance, la construction et l'entraînement de l'armée sont effectivement interrompus sur ce monde."
 frameworld_conquered_no_resettle:0 "Surcharge Logistique"
 frameworld_conquered_no_resettle_desc:0 "Sans une infrastructure civile interstellaire développée, cet empire $origin_frameworld$ a du mal à répondre à la demande de transport en temps de guerre."
 frameworld_conquered_no_resettle_tooltip:0 "£pop£ Les pops ne seront pas automatiquement réinstallées depuis ce monde tant que ce modificateur n'aura pas expiré ou ne sera pas supprimé par un retour à la paix."
 frameworld_building_wreck_fix:0 "Correctif pour l'Upgrade Nexus District"
 frameworld_building_wreck_fix_desc:0 "Si vous lisez ceci, c'est que quelque chose a mal tourné. Ce modificateur existe pour éviter que les bâtiments soient détruits lors de la décision d'amélioration du district nexus et n'est pas censé persister après la fin du projet."
 frameworld_outpost_planet:0 "$pc_giga_frameworld$ $giga_frameworld_outpost$"
 frameworld_outpost_planet_effects:0 "$giga_frameworld_outpost_plural$ produisent des ressources basées sur leur planète hôte, affectées par les modificateurs de production d'emplois."
 frameworld_outpost_planet_desc:0 "§T§HGisements de Ressources Rares Exploitables:§!\n\n£volatile_motes£ $volatile_motes$: §Y[this.GetFrameworldOutpostVolatileMotes]§!\n£exotic_gases£ $exotic_gases$: §Y[this.GetFrameworldOutpostExoticGases]§!\n£rare_crystals£ $rare_crystals$: §Y[this.GetFrameworldOutpostRareCrystals]§![FrameworldOutpostTerravoreText][FrameworldOutpostNaniteText][FrameworldOutpostEnvironmentalistText]\n\n§T--------------§!\n§LBien qu'ils ne soient pas comparables à une colonie entièrement développée, nos avant-postes peuvent tout de même fournir des ressources précieuses.§!"
 frameworld_outpost_planet_desc_terravore:0 "\n\nExploitation Minière Planétaire: [FrameworldOutpostTerravoreState]\nNombre d'extractions: §Y[GetFrameworldOutpostTerravoreDamage]/3§!"
 frameworld_outpost_planet_desc_nanite:0 "\n\nAssimilation par Nanites: [FrameworldOutpostNaniteState]\nNombre d'assimilations: §Y[GetFrameworldOutpostNaniteDamage]/3§!"
 frameworld_outpost_planet_desc_environmentalist:0 "\n\n£blocker£ Bloqueurs Naturels: §Y[GetNaturalBlockerCount]§!"
 mod_deposit_blockers_frameworld_cost_mult:0 "Coût de la récolte d'astéroïdes"
 frameworld_outposts:0 "$giga_frameworld_outpost_plural$"
 mod_frameworld_outposts_produces_mult:0 "$giga_frameworld_outpost$ Sortie des ressources"
 mod_frameworld_outpost_build_cost_mult:0 "Coût de Construction de $giga_frameworld_outpost$"
 mod_giga_frameworld_outpost_output_mult:0 "Production Totale de Ressources de $giga_frameworld_outpost$"
 mod_giga_frameworld_outpost_count:0 "Taille du Réseau $giga_frameworld_outpost$"
 mod_giga_frameworld_outpost_count_display:0 "Nombre d'Avant-Postes"
 frameworld_crucible:0 "$gestation_colony$"
 frameworld_crucible_desc:0 "Une initiative dédiée à l'élevage de drones cybernétiques afin qu'ils deviennent des membres productifs du collectif."
 frameworld_crucible_effects:0 "Remplace la moitié des emplois £job_replicator£ §Y$job_replicator$§! issus de l'expansion et des §Y$giga_frameworld_outpost_plural$§! par des emplois £job_giga_extra_crucible_drone£ §Y$job_giga_extra_crucible_drone_plural$§!\n\n$job_giga_extra_crucible_drone_effect_desc$"
 mod_giga_frameworld_growth_jobs_add:0 "Croissance Secondaire des Pops ['concept_giga_frameworld_growth_job_value_tooltip']"
 concept_giga_frameworld_growth_job_value_tooltip:0 "Valeur d'Emploi"
 concept_giga_frameworld_growth_job_value:0 "Valeur d'Emploi pour la Croissance Secondaire des Pops"
 concept_giga_frameworld_growth_job_value_desc:0 "Le §Y$pc_giga_frameworld$§! reçoit une croissance supplémentaire des pops via les emplois £job£ grâce à l'expansion et au §Y$giga_situation_frameworld_outposts$§!.\n\nCe modificateur représente la §Ycroissance et l'assemblage total§! fournis par les emplois existants, qui varient en fonction du §YType de Pays§!, des §YCiviques§! et du §YChemin d'Ascension§!."
 giga_frameworld_origin.107.name:0 "La Première Expédition de [Root.GetSpeciesName]"
 giga_frameworld_origin.107.desc:0 "Nos équipes de construction ont terminé l'assemblage du poste orbital au-dessus de §Y[From.GetName]§!. Depuis cette station, une expédition a été lancée pour explorer systématiquement la surface de la planète.\n\nBien que notre influence soit limitée aussi loin de §Y[Root.GetHomeWorldName]§!, l'expédition pourra tout de même exploiter toutes les ressources utiles découvertes au cours de l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise du Monde-Structure, mais c'est un premier pas important vers notre place parmi les étoiles."
 giga_frameworld_origin.107.desc.hive:0 "Nos équipes de construction ont terminé l’assemblage de la station relais planétaire au-dessus de §Y[From.GetName]§!. Depuis ce poste avancé, une expédition a été lancée pour explorer systématiquement la surface en dessous.\n\nBien que notre influence soit limitée si loin de §Y[Root.GetHomeWorldName]§!, l'expédition pourra néanmoins exploiter toutes les ressources utiles découvertes durant l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise de la Structure, mais il s'agit d'un premier pas important vers notre place parmi les étoiles."
 giga_frameworld_origin.107.desc.machine:0 "Nos unités de construction ont achevé l’assemblage de la station relais planétaire au-dessus de §Y[From.GetName]§!. Depuis ce point d'ancrage, une expédition a été lancée pour explorer systématiquement la surface en dessous.\n\nBien que notre influence soit limitée aussi loin de §Y[Root.GetHomeWorldName]§!, l’expédition pourra toujours exploiter les ressources utiles découvertes durant l’exploration.\n\nNotre maîtrise de ce monde ne sera jamais aussi complète que celle de la Structure, mais il s'agit d'un premier pas essentiel vers notre expansion parmi les étoiles."
 giga_frameworld_origin.107.a:0 "Un grand jour pour [Root.GetName]!"
 giga_frameworld_origin.500.desc.first:0 "Nos spécialistes de l'environnement sont heureux d'annoncer que le processus d'ensemencement sur [Root.GetName] est terminé ! Les nouvelles plantes hybrides créées en laboratoire, fabriquées à partir de segments soigneusement sélectionnés du code génétique du §YBaol§! prélevé sur le corps du dernier §YBaol§!, ont été déployées avec succès dans le cadre d'une expansion plus large des systèmes de soutien environnemental.\n\nL'administration signale également qu'un certain nombre d'extraterrestres sapides, incroyablement similaires aux anciens §YBaol§!, sont apparus sur [Root.GetName] !\n\nBien que n'étant pas membres d'une Ruche, ces §GNu-Baol§! semblent aussi pacifiques que leurs ancêtres. D'une manière ou d'une autre, nous devrons nous occuper de leur présence sur [Root.GetName]."
 giga_frameworld_origin.500.desc:0 "Nos spécialistes en environnement rapportent que le processus de terraformation sur [Root.GetName] est terminé ! Une nouvelle espèce hybride dérivée du §YBaol§!, utilisant des segments génétiques sélectionnés du dernier §YBaol§!, a été créée et introduite avec succès dans notre écosystème contrôlé.\n\nAdministration signale que plusieurs individus sapients, étonnamment similaires aux anciens §YBaol§!, sont apparus sur [Root.GetName] ! Ils semblent pacifiques et déconnectés d'un esprit de ruche. Nous devons maintenant décider de la marche à suivre concernant leur présence."
 giga_frameworld_origin.001.name:0 "Structure de $name_penrose$ construit"
 giga_frameworld_origin.001.desc:0 "La structure d'un futur $name_penrose$ a été construit autour de [giga_system.star.GetName]. Ce cadre squelettique supportera un jour des miroirs massifs, construits avec les matériaux les plus réfléchissants auxquels nous pouvons penser. Une fois que nous aurons terminé la construction de ces miroirs et des systèmes d'injection et de capture de particules qui les accompagnent, nous pourrons commencer à récolter l'énergie de rotation du $pc_black_hole$."
 giga_frameworld_origin.001.a:0 "Merveilleux."
 giga_frameworld_origin.002.name:0 "$name_penrose$ partiel construit"
 giga_frameworld_origin.002.desc:0 "La moitié des miroirs gigantesques ont maintenant été installés sur le cadre entourant [giga_system.star.GetName], et les injecteurs de particules sont partiellement terminés. D'autres travaux sont nécessaires pour terminer la structure avant que nous puissions l'utiliser correctement."
 giga_frameworld_origin.002.a:0 "Excellent."
 giga_frameworld_origin.003.name:0 "Intégré $name_penrose$ Terminé"
 giga_frameworld_origin.003.desc:0 "Avec l'installation des derniers panneaux de miroirs, [giga_system.star.GetName] est maintenant complètement fermé. Nous pouvons maintenant commencer à récolter l'énergie de rotation du $pc_black_hole$."
 giga_frameworld_origin.003.a:0 "Merveilleux !"
 giga_frameworld_origin.004.name:0 "Supports structurels de $matter_decompressor_4$ construits"
 giga_frameworld_origin.004.desc:0 "Pour extraire la matière de [giga_system.star.GetName], nous avons d'abord besoin d'une base sûre pour construire l'installation. Des supports d'ancrage ont été construits depuis la superstructure du $pc_giga_frameworld$ jusqu'à une région située au-dessus de l'horizon des événements de [giga_system.star.GetName], où un énorme anneau de traitement supportera finalement l'appareil de forage gravitationnel."
 giga_frameworld_origin.004.a:0 "Merveilleux."
 giga_frameworld_origin.005.name:0 " Anneau de traitement de $matter_decompressor_4$ construit"
 giga_frameworld_origin.005.desc:0 "Construit sur les supports structurels existants, cet anneau de traitement abrite d'énormes raffineries et fonderies qui transformeront la matière extraite de [giga_system.star.GetName] en minéraux utilisables. Il ne reste plus qu'à monter l'appareil de décompression, qui utilisera des zones concentrées de gravité tordue pour créer de vastes foreuses dont les trous sont faits de force gravitationnelle redirigée et concentrée."
 giga_frameworld_origin.005.a:0 "Excellent."
 giga_frameworld_origin.006.name:0 "$matter_decompressor_4$ intégré Terminé"
 giga_frameworld_origin.006.desc:0 "Avec l'achèvement du réseau de forages gravitationnels, le $matter_decompressor_4$ au-dessus de [giga_system.star.GetName] est maintenant complet, ce qui nous permet un accès sans précédent à la matière que l'on pensait auparavant piégée à jamais dans son horizon des événements. Nous pouvons maintenant commencer à récolter les minéraux de [giga_system.star.GetName] directement."
 giga_frameworld_origin.006.a:0 "Merveilleux !"
 giga_frameworld_origin.007.name:0 "L'expansion de la section d'habitation est terminée"
 giga_frameworld_origin.007.desc:0 "Le réaménagement et l'expansion de nos zones urbaines sur [giga_planet.GetName] sont terminés. La nouvelle conception, plus encapsulée, permet à un plus grand nombre de personnes d'habiter confortablement un seul module de station, avec un accès pratique aux espaces de travail et aux commodités locales.\n\nNos zones d'habitation sont maintenant de véritables villes en soi, laissant l'espace précédemment occupé par les équipements de soutien externes pour de nouvelles constructions."
 giga_frameworld_origin.007.desc.hive:0 "La reconception et l'expansion de nos noeuds de ruche sur [giga_planet.GetName] sont terminées. La nouvelle conception, plus encapsulée, permet une meilleure distribution des drones de maintenance parmi la population en convalescence, réduisant les temps de déplacement et améliorant la délégation des tâches locales.\n\nLes économies réalisées en partageant les installations libèrent l'espace précédemment utilisé par les systèmes de maintenance dédiés pour de nouvelles constructions."
 giga_frameworld_origin.007.desc.machine:0 "Le réaménagement et l'expansion des zones d'habitation des drones sur [giga_planet.GetName] sont terminés. La nouvelle conception, plus encapsulée, permet une intégration plus étroite de l'entretien des drones dans les installations de stockage, réduisant ainsi les frais de déplacement et l'espace global utilisé.\n\nLes économies réalisées dans les systèmes de soutien permettent de libérer l'espace utilisé auparavant par les systèmes secondaires pour de nouvelles constructions."
 giga_frameworld_origin.007.a:0 "La station doit se développer."
 giga_frameworld_origin.008.name:0 "L'industrie lourde remaniée est en ligne"
 giga_frameworld_origin.008.desc:0 "Les fonderies et les usines sur [giga_planet.GetName] sont en pleine activité suite à l'achèvement de notre projet de rénovation industrielle.\n\nLes méthodes industrielles modernes permettent un plus grand niveau de productivité, en condensant l'équipement qui occupait autrefois d'énormes régions de [giga_planet.GetName] dans des stations centrales compactes et efficaces. L'espace économisé par ce réaménagement peut maintenant être utilisé pour d'autres modules de station, ou simplement pour encore plus d'usines."
 giga_frameworld_origin.008.a:0 "Les prévisions de productivité sont en hausse."
 giga_frameworld_origin.009.name:0 "Fin de la modernisation des installations du sanctuaire"
 giga_frameworld_origin.009.desc:0 "Après une longue période de réorganisation, les nouvelles installations de satisfaction des besoins organiques sur [giga_planet.GetName] sont maintenant opérationnelles. Les organiques qui nous sont confiés ne remarqueront aucune perturbation, leur vie n'étant pas interrompue mais enrichie par les systèmes améliorés.\n\nLes zones qui abritaient auparavant les systèmes de maintenance peuvent désormais être réaffectées pour accueillir une population encore plus nombreuse, ou à d'autres fins."
 giga_frameworld_origin.009.a:0 "Le travail n'est jamais terminé."
 giga_frameworld_origin.010.name:0 "Modernisation des systèmes de soutien à l'environnement"
 giga_frameworld_origin.010.desc:0 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement de l'atmosphère sur [giga_planet.GetName]. Nos citoyens peuvent désormais profiter d'une large gamme d'environnements planétaires simulés, adaptés à toutes les espèces. Le contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production de nourriture beaucoup plus efficace, avec une réduction correspondante des besoins en main-d'oeuvre.\n\nUn nouveau jour se lève sur [giga_planet.owner.GetName], et l'air est vif."
 giga_frameworld_origin.010.a:0 "Rafraîchissant !"
 giga_frameworld_origin.010.desc.servitor:0 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement atmosphérique sur [giga_planet.GetName]. Les organiques dont nous avons la charge peuvent désormais profiter d'une large gamme d'environnements planétaires simulés, adaptés à toutes les espèces. Le contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production de nourriture beaucoup plus efficace, permettant de répondre à un éventail plus diversifié de besoins alimentaires organiques.\n\nUn nouveau jour se lève sur [giga_planet.owner.GetName], et l'air est vif."
 giga_frameworld_origin.010.a.servitor:0 "Rien n'est trop beau pour nos pupilles."
 giga_frameworld_origin.010.desc.assimilator:0 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement de l'atmosphère sur [giga_planet.GetName]. Nos drones organiques bénéficieront des conditions améliorées, en particulier ceux qui proviennent de l'extérieur de nos paramètres de conception originaux.\n\nLe contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production beaucoup plus efficace de nourriture, assurant un fonctionnement efficace continu des grappes de drones intégrées. La productivité devrait augmenter à la suite de ces modifications."
 giga_frameworld_origin.010.a.assimilator:0 "Compris."
 giga_frameworld_origin.011.name:0 "Amélioration des installations de traitement des données"
 giga_frameworld_origin.011.desc:0 "Les travaux de construction du nouveau complexe de calcul à large bande passante sur [giga_planet.GetName] sont terminés. De vastes banques de superordinateurs sont désormais disponibles pour répondre aux requêtes scientifiques les plus difficiles que nous ayons jamais conçues, et promettent une amélioration considérable du débit de la recherche générale\n\nL'intégration de ces systèmes dans les fonctions centrales de la station est en cours, mais la charge supplémentaire de gestion de la chaleur ne devrait pas causer de perturbation significative."
 giga_frameworld_origin.011.a:0 "Les secrets de l'univers sont à notre portée."
 giga_frameworld_origin.012.name:0 "Extension de l'infrastructure des stations"
 giga_frameworld_origin.012.desc:0 "Après une longue période de construction, de nouveaux corridors d'infrastructure de transport essentiels ont été achevés entre les principales sections de [giga_planet.GetName].\n\nL'intégrité structurelle améliorée et les réseaux de transport interconnectés permettront à la superstructure de supporter des modules fonctionnels supplémentaires."
 giga_frameworld_origin.012.desc.2:0 "Une deuxième série de mises à niveau de l'infrastructure a été achevée sur des sections majeures de [giga_planet.GetName].\n\nL'intégrité structurelle améliorée et les réseaux de transport interconnectés permettront à la superstructure de supporter des modules fonctionnels supplémentaires."
 giga_frameworld_origin.012.a:0 "Compris."
 giga_frameworld_origin.013.name:0 "Achèvement du projet Maginot"
 giga_frameworld_origin.013.desc:0 "Nous avons maintenant achevé notre ultime barrière défensive autour de [giga_planet.GetName], encerclant notre foyer de couches successives de fortifications mortelles. Cet impressionnant exploit d'ingénierie militaire est pratiquement inattaquable par n'importe quelle force, avec des plateformes défensives intégrées, de gigantesques batteries cinétiques, de vastes emplacements de garnison et des générateurs de bouclier dépassant de loin la génération de flottes navales entières. En outre, le système Dead Hand a un effet dissuasif sur la destruction totale de [giga_planet.GetName], en utilisant le noyau central de la station comme une vaste charge creuse alimentée en antimatière en cas d'activation du système de sécurité - §Rannihilant complètement toute force hostile en orbite.§!\n\n\nLes différents systèmes de défense peuvent être gérés par le biais de §Ydécisions§!. Construisez des §Ydistricts§! pour gagner $defensive_upgrade_point_plural$ et $offensive_upgrade_point_plural$ à utiliser avec ces décisions."
 giga_frameworld_origin.013.a:0 "Personne ne peut nous faire du mal maintenant."
 giga_frameworld_origin.014.name:0 "Achèvement des Orbites de Traitement Secondaires"
 giga_frameworld_origin.014.desc:0 "Nous avons achevé la construction de plusieurs nouvelles installations de traitement près de [giga_planet.GetName]. Ces installations amélioreront les capacités de plusieurs de nos bâtiments de traitement secondaires, permettant une rationalisation et une amélioration accrues des chaînes de production."
 giga_frameworld_origin.014.a:0 "Tous les systèmes sont nominales."
 giga_frameworld_origin.015.name:0 "Infusion de Nanites Terminée"
 giga_frameworld_origin.015.desc:0 "Nous avons achevé l'intégration de notre essaim dans l'infrastructure centrale de [giga_planet.GetName], fusionnant notre être avec la structure elle-même. Nous pouvons désormais manipuler chaque système avec une précision inégalée, et nous en tirerons un grand bénéfice."
 giga_frameworld_origin.015.a:0 "Essence, incarnée."
 giga_frameworld_origin.101.name:0 "Population annexée - Population relocalisée"
 giga_frameworld_origin.101.desc.a:0 "La population locale de [From.GetName] a maintenant été entièrement transférée à [Root.Capital.GetName]. Après une brève période d'expérimentation, nous avons maintenant confirmé que le maintien d'un contrôle total d'une colonie externe aussi importante est au-delà de nos capacités, et le futur protocole se concentrera sur la relocalisation efficace des unités de population locale.\n\n[From.FrameworldEvent101GetOutpost]"
 giga_frameworld_origin.101.desc.b:0 "Conformément au protocole établi, les unités de population de [From.GetName] ont été relocalisées à [Root.Capital.GetName].\n\n[From.FrameworldEvent101GetOutpost]"
 giga_frameworld_origin.101.a:0 "Bien reçu"
 giga_frameworld_origin.101.outpost:0 "Un §Y$frameworld_outpost_0$§! a été établi en orbite, et un poste de relais reste à la surface."
 giga_frameworld_origin.101.no_outpost:0 "Le site n'étant pas adapté à un §Y$frameworld_outpost_0$§!,, aucune mesure supplémentaire n'a été prise."
 giga_frameworld_origin.103.name:0 "Récupération d'une épave orbitale"
 giga_frameworld_origin.103.desc.a:0 "Maintenant que la colonie sur [From.GetName] a été correctement établie, nos équipes d'infrastructure ont commencé les opérations de récupération sur la station accidentée en orbite.\n\nL'objectif de la station reste incertain, car la quantité d'équipement de communication découvert à bord semble disproportionnée par rapport au niveau d'activité trouvé à la surface lorsque nous sommes arrivés.\n\nNous ne comprendrons peut-être jamais complètement les motivations des anciens propriétaires, mais les matériaux récupérés se sont avérés précieux."
 giga_frameworld_origin.103.a:0 "Bizarre, mais utile."
 giga_frameworld_origin.308.name:0 "Les enquêtes sur les ressources de l'expédition donnent des résultats"
 giga_frameworld_origin.308.desc:0 "Les études en cours sur les ressources menées par nos équipes expéditionnaires ont permis de découvrir de nouvelles possibilités d'exploitation des ressources planétaires. [frameworld_outpost_motes.FrameworldEvent308Motes] [frameworld_outpost_gases.FrameworldEvent308Gases] [frameworld_outpost_crystals.FrameworldEvent308Crystals] [frameworld_outpost_betharian.FrameworldEvent308Betharian] [frameworld_outpost_zoo.FrameworldEvent308Zoo]"
 giga_frameworld_origin.308.desc.motes.general:0 "Ces particules produisent une quantité explosive de force cinétique lorsqu'elles sont activées chimiquement, et sont censées être très épicées lorsqu'elles sont utilisées en cuisine."
 giga_frameworld_origin.308.desc.motes:0 "\nUn détachement d'exploration sur §Y[this.GetName]§! a découvert un riche approvisionnement en §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$."
 giga_frameworld_origin.308.desc.motes.ecu:0 "\nUne ancienne installation de traitement chimique sur §Y[this.GetName]§! contient une importante quantité de §H$volatile_motes$§!.$giga_frameworld_origin.308.desc.motes.general$."
 giga_frameworld_origin.308.desc.motes.desert:0 "\n\nL'analyse chimique des sables du désert de §Y[this.GetName]§! a révélé une riche source de §H$volatile_motes$§!.$giga_frameworld_origin.308.desc.motes.general$."
 giga_frameworld_origin.308.desc.motes.caverns:0 "\nDans une caverne située sous la surface de §Y[this.GetName]§!, une équipe d'exploration a découvert une riche source de §H$volatile_motes$§!.$giga_frameworld_origin.308.desc.motes.general$."
 giga_frameworld_origin.308.desc.gases.general:0 "Ces gaz ont un certain nombre d'utilisations tactiques et même récréatives."
 giga_frameworld_origin.308.desc.gases:0 "\nLes scans détaillés de §Y[this.GetName]§! ont révélé une source de §H$exotic_gases$§!.$giga_frameworld_origin.308.desc.gases.general$ jusqu'alors inexploitée."
 giga_frameworld_origin.308.desc.gases.ecu:0 "\nLes scans aériens de l'ancien secteur industriel sur §Y[this.GetName]§! ont révélé un grand réservoir de §H$exotic_gases$§!.$giga_frameworld_origin.308.desc.gases.general$."
 giga_frameworld_origin.308.desc.gases.swamp:0 "\nDes analyses approfondies des marécages de §Y[this.GetName]§! ont révélé un certain nombre de points d'accès potentiels pour §H$exotic_gases$§!. $giga_frameworld_origin.308.desc.gases.general$."
 giga_frameworld_origin.308.desc.gases.bog:0 "\n\nLes relevés aériens à basse altitude des zones humides tourbeuses sur §Y[this.GetName]§! ont révélé plusieurs endroits propices à l'extraction de §H$exotic_gases$§!.$giga_frameworld_origin.308.desc.gases.general$."
 giga_frameworld_origin.308.desc.crystals.general:0 "Grâce à leurs spectaculaires propriétés réfringentes, ces cristaux se prêtent aussi bien à l'électronique haut de gamme qu'aux systèmes d'armes laser."
 giga_frameworld_origin.308.desc.crystals:0 "\nDes équipes de recherche sur §Y[this.GetName]§! ont cartographié l'emplacement d'une source majeure de §H$rare_crystals$§!.$giga_frameworld_origin.308.desc.crystals.general$."
 giga_frameworld_origin.308.desc.crystals.ecu:0 "\nLes équipes de recherche sur §Y[this.GetName]§! ont identifié une installation de stockage presque intacte contenant une énorme quantité de §H$rare_crystals$§!.$giga_frameworld_origin.308.desc.crystals.general$."
 giga_frameworld_origin.308.desc.crystals.caverns:0 "\nLes études géologiques de §Y[this.GetName]§! ont identifié une vaste caverne contenant des formations de §H$rare_crystals$§!.$giga_frameworld_origin.308.desc.crystals.general$."
 giga_frameworld_origin.308.desc.crystals.forest:0 "\nLes équipes de recherche sur §Y[this.GetName]§! ont découvert une forêt d'arbres de silicate qui peuvent être traités pour extraire §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$."
 giga_frameworld_origin.308.desc.crystals.reef:0 "\n\nLes études océanographiques de §Y[this.GetName]§! ont permis de cartographier plusieurs récifs de corail cristallisé qui pourraient être récoltés pour §H$rare_crystals$§!.$giga_frameworld_origin.308.desc.crystals.general$."
 giga_frameworld_origin.308.desc.betharian.general:0 "Ces pierres ont un énorme potentiel de production d'énergie, qui pourrait être exploité par une centrale électrique conçue de manière appropriée."
 giga_frameworld_origin.308.desc.betharian:0 "\n\nDe nombreuses §Hpierres Béthariennes§! ont été découvertes sur §Y[this.GetName]§!. $giga_frameworld_origin.308.desc.betharian.general$"
 giga_frameworld_origin.308.desc.betharian.fields:0 "\n\nDe grandes formations de §Hpierres Béthariennes§! d'origine naturelle ont été découvertes sur §Y[this.GetName]§!. $giga_frameworld_origin.308.desc.betharian.general$"
 giga_frameworld_origin.308.desc.zoo.general:0 "Ces créatures se sont révélées inoffensives et amicales envers nos équipes d'enquêteurs, et présentent des conditions idéales pour étudier de près la vie extraterrestre."
 giga_frameworld_origin.308.desc.zoo:0 "\n\nLes études zoologiques de §Y[this.GetName]§! ont confirmé l'existence d'une §Hfaune locale docile§!. $giga_frameworld_origin.308.desc.zoo.general$"
 giga_frameworld_origin.308.desc.zoo.valley:0 "\n\nUne vallée isolée sur §Y[this.GetName]§! a été découverte pour abriter une population de §Hfaune locale docile§!. $giga_frameworld_origin.308.desc.zoo.general$"
 giga_frameworld_origin.308.a:0 "Excellent."
 giga_frameworld_origin.308.a.tooltip:0 "§LLes nouvelles opportunités nécessitent de nouvelles méthodologies.§!"
 giga_frameworld_origin.308.a.motes:0 "\n§Y£volatile_motes£$volatile_motes$§! découvert le §Y[frameworld_outpost_motes.GetName]§! :"
 giga_frameworld_origin.308.a.gases:0 "\n§Y£exotic_gases£$exotic_gases$§! découvert le §Y[frameworld_outpost_gases.GetName]§! :"
 giga_frameworld_origin.308.a.crystals:0 "\n§Y£rare_crystals£$rare_crystals$§! découvert le §Y[frameworld_outpost_crystals.GetName]§! :"
 giga_frameworld_origin.308.a.betharian:0 "\n§Y£energy£Pierre Bétharienne§! découverte sur §Y[frameworld_outpost_betharian.GetName]§! :"
 giga_frameworld_origin.308.a.zoo:0 "\n§Y£unity£ £society_research£Vie extraterrestre docile§! découverte sur §Y[frameworld_outpost_zoo.GetName]§! :"
 giga_situation_frameworld_outposts_type:0 "Réseau de $giga_frameworld_outpost$"
