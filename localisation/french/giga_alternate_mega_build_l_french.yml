 giga_amb_base:0 "Mécanismes de mégaconstruction basés sur les emplois"
 giga_amb_base_tooltip:0 "Notre $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$ est basée sur le revenu de notre empire en £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!.\n\nChaque mois, lorsqu'au moins une mégastructure est en cours de construction, le double de notre revenu de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! est soustrait de notre stock et converti en $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$. Cette valeur est ensuite répartie entre toutes les mégastructures en construction.\n\nVoir le modificateur d'empire §Y$giga_amb_speed$§! pour plus de détails sur le calcul de la vitesse."
 giga_amb_base_desc:0 "§LUn personnel qualifié et des matériaux spécialisés sont nécessaires pour dépasser les étoiles elles-mêmes.§!"
 giga_amb_storage_capacity:0 "Capacité de stockage de $giga_sr_amb_megaconstruction$"
 giga_amb_storage_capacity_tooltip:0 "£giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! la capacité de stockage est limitée et n'est pas augmentée par les modificateurs généraux £mod_country_resource_max_add£ §Y$MOD_COUNTRY_RESOURCE_MAX_ADD$§!."
 giga_amb_storage_capacity_desc:0 "§LRare et précieux, nous devons stocker nos matériaux les plus avancés avec beaucoup de précautions.§!"
 giga_amb_speed:0 "Vitesse de la mégaconstruction"
 giga_amb_speed_desc:0 "§LAvec des experts et des matériaux en quantité limitée, nous devons choisir avec soin où nous les déployons.§!"
 giga_amb_flat_replacement:0 "Compatibilité avec la mégaconstruction"
 giga_amb_flat_replacement_desc:0 "Un autre mod est de fournir une source de $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$. Ce modificateur l'annule et fournit un bonus de remplacement adapté au système de mégaconstruction basé sur le travail.\n§W--------------§!\n§LUne correction concise de la méthodologie de la méga échelle.§!"
 giga_amb_ai_limit:0 "Limite AI de la mégaconstruction"
 giga_amb_ai_limit_tooltip:0 "Limite artificiellement le nombre de mégastructures que l'IA peut construire en même temps, car elle ne comprend pas le concept de répartition de sa vitesse de construction entre plusieurs projets, et a tendance à la répartir trop finement lorsque de nombreux projets sont disponibles.\n\nEssaie généralement de rester à une vitesse de 0, 75-0, 5 par projet lorsqu'elle est au plafond maximum. Mises à jour annuelles.\n\nVoir le modificateur de pays §Y$giga_amb_speed$§! pour la valeur du plafond."
 giga_amb_ai_limit_desc:0 "§L\n-Pourquoi construisez-vous DIX segments de monde en anneau avec une vitesse de 1, 4  ? ! \N-§! - TTFTCUTS §!"
 giga_amb_empire_size_penalty:0 "Pénalité de taille d'empire lié aux Mégaconstructions"
 giga_amb_empire_size_penalty_desc:0 "§L Au fur et à mesure que notre charge administrative augmente, la coordination des projets entre nos mondes devient plus difficile à gérer. §! "
 giga_amb_starting_megas_upkeep_offset:0 "Début du soutien à l'entretien des mégastructures"
 giga_amb_starting_megas_upkeep_offset_desc:0 "Paie l'entretien de base $giga_sr_amb_megaconstruction$ de toutes les mégastructures possédées en début de partie.\n\n§LLaisser nos installations spatiales les plus importantes sans maintenance, serait de la pure négligence.§!"
 giga_sr_amb_megaconstruction:0 "Matériaux Supertensiles"
 giga_sr_amb_megaconstruction_desc_only:0 "Capables de résister à des niveaux incroyables de contrainte de traction, ces matériaux avancés sont essentiels à la construction des plus grandes installations spatiales."
 giga_sr_amb_megaconstruction_desc:0 "$giga_sr_amb_megaconstruction_desc_only$\n\n§LCette ressource est utilisée lorsque l'option §YCap de construction de mégastructure§! du menu de personnalisation des gigastructures est définie sur §YBasé sur les tâches§!.§!"
 giga_tech_amb_supertensiles:0 "Application des Matériaux Supertensiles"
 giga_tech_amb_supertensiles_desc:0 "Des méthodes améliorées de synthèse moléculaire permettent l'application pratique de matériaux dotés d'une résistance à la traction quasi inimaginable."
 giga_tech_amb_living_metal_infusion:0 "Processus d'Infusion de Métal Vivant"
 giga_tech_amb_living_metal_infusion_desc:0 "Les propriétés régénératives du métal vivant pourraient être exploitées pour améliorer la qualité et la production de nos fonderies moléculaires."
 giga_tech_amb_sentient_metal_molecular_foundries:0 "Nano-informatique industrielle de métal sensible"
 giga_tech_amb_sentient_metal_molecular_foundries_desc:0 "Les équipements de traitement intégrant la capacité de calcul à l'échelle nanométrique du métal sensible pourraient permettre d'améliorer considérablement le débit des fonderies moléculaires."
 giga_tech_orbital_ring_supertensiles_mine_hub:0 "Conception de Salle Blanche en Apesanteur"
 giga_tech_orbital_ring_supertensiles_mine_hub_desc:0 "Des espaces de traitement dédiés au $giga_sr_amb_megaconstruction$ sur nos anneaux orbitaux ont le potentiel d'améliorer considérablement l'extraction et le traitement local des ressources."
 giga_tech_fe_megaworkshop_1:0 "$building_giga_fe_megaworkshop$"
 giga_tech_fe_megaworkshop_1_desc:0 "$building_giga_fe_megaworkshop_desc$"
 giga_tech_fe_megaworkshop_2:0 "$building_giga_fe_megaworkshop_2$"
 giga_tech_fe_megaworkshop_2_desc:0 "$building_giga_fe_megaworkshop_2_desc$"
 district_giga_supertensiles:0 "Districts de fonderie moléculaire"
 district_giga_supertensiles_plural:0 "Districts de fonderie moléculaire"
 district_giga_supertensiles_desc:0 "$building_giga_megaworkshop_desc$"
 d_giga_amb_start_bonus:0 "Cache des matériaux de mégaconstruction"
 d_giga_amb_start_bonus_desc:0 "§WLes ressources accordées par ce dépôt diminueront au fil du temps pour devenir un filet d'eau en milieu de jeu. Utilisez-les à bon escient.§!\n§W--------------§!\nUne cache de matériaux de construction adaptés à la construction spatiale à grande échelle. Malheureusement, elle ne durera pas éternellement..."
 d_giga_hab_supertensiles_1:0 "Dépôt de $giga_sr_amb_megaconstruction$"
 d_giga_hab_supertensiles_1_desc:0 "Cet habitat est construit près d'un gisement exploitable de matériaux supertensibles."
 d_giga_lifeless_supertensiles_1:0 "Dépôt de $giga_sr_amb_megaconstruction$"
 d_giga_lifeless_supertensiles_1_desc:0 "Ce monde a une source exploitable de matériaux supertensibles."
 col_giga_supertensiles_foundry:0 "Centre de méga-logistique"
 col_giga_supertensiles_foundry_desc:0 "Cette planète est un centre de fabrication et de logistique axé sur les projets de construction dans l'espace lointain."
 col_giga_habitat_supertensiles_foundry:0 "Station de méga-logistique"
 col_giga_habitat_supertensiles_foundry_desc:0 "Une arcologie artificielle de l'espace profond dédiée à la fabrication de mégastructures."
 edict_giga_amb_sentient_metal_supertensiles:0 "Fonderies moléculaires assistées par des métaux sensibles"
 edict_giga_amb_sentient_metal_supertensiles_desc:0 "Les propriétés adaptatives du métal sensible ont plusieurs applications potentielles dans la fabrication de matériaux supertensifs.\n\nAméliore le rendement de base et l'entretien de £job_giga_megaengineer£ §Y$job_giga_megaengineer_plural$§! de §Y50%§!.\n\nAugmente le rendement de base et les frais d'entretien de £job_giga_megaengineering_overseer£ §Y$job_giga_megaengineering_overseer_plural$§! de §Y20%§!.\n\nRemplace §Yla moitié des £alloys£ $alloys$ frais d'entretien§! des deux jobs par £ehof_sr_sentient_metal£ §Y$ehof_sr_sentient_metal$§!.."
 giga_amb.1000.name:0 "§Y[FromFrom.GetName]§!: Découverte de Ressources Stratégiques"
 giga_amb.1000.has_tech:0 "Le [Root.GetName] a découvert une source auparavant inconnue de §H$giga_sr_amb_megaconstruction$§! sur [FromFrom.GetName]. Ces fibres denses possèdent une résistance à la traction incroyable, qui pourrait être exploitée dans des projets de grande envergure."
 giga_amb.1000.no_tech:0 "'§Y[Root.GetName]§!' a découvert une ressource stratégique jusqu'alors inconnue sur [FromFrom.GetName], appelée §H$giga_sr_amb_megaconstruction$§!.. Ces fibres à maillage dense possèdent un niveau incroyable de résistance à la traction, qui pourrait être exploité dans des projets à grande échelle où les forces impliquées rendaient auparavant la construction infaisable."
 giga_amb.1000.tooltip:0 "£giga_sr_amb_megaconstruction£§Y$giga_sr_amb_megaconstruction$§!\n§E$giga_sr_amb_megaconstruction_desc_only$§!"
 giga_amb.1001.name:0 "Une Erreur de Logistique"
 giga_amb.1001.desc:0 "Organiser et mettre en œuvre des constructions spatiales à grande échelle s'est avéré plus exigeant que prévu. Une restructuration significative sera nécessaire à l'avenir. Une avenue de recherche promet d'apporter une solution, mais elle reste à prouver."
 giga_amb.1001.tooltip:0 "§EResearching §Y$giga_tech_amb_supertensiles$§! sera §Prequis§! pour faire des progrès significatifs en matière de mégastructure."
 sm_ring_giga_supertensiles_hub:0 "Coordinateur du Réseau Mégalogistique"
 sm_ring_giga_supertensiles_hub_desc:0 "Cette installation orbitale améliore nos $building_giga_megaworkshop_plural$ terrestres en utilisant le $sr_living_metal$ pour rationaliser les processus de production, entraînant une augmentation du rendement global."
 sm_ring_giga_supertensiles_mine_hub:0 "Installation de Salle Blanche Orbitale"
 sm_ring_giga_supertensiles_mine_hub_desc:0 "Des installations spécialisées et des salles blanches sur l'anneau orbital permettent le traitement des matériaux extraits qui seraient autrement perdus.\n\n§TFournit §G+1§! £job_giga_supertensiles_extractor£ §YExtraction de Supertensiles§! par bâtiment actif £building£ §Y$building_giga_supertensiles_mines$§!§!\n"
 ring_giga_supertensiles_mine_hub_condition:0 "§RLa planète doit pouvoir supporter au moins un bâtiment £building£ §Y$building_giga_supertensiles_mines$§!.§!"
 giga_tech_amb_supertensiles_acot_delta:0 "Production de Supertensiles Infusée en Matière Noire"
 giga_tech_amb_supertensiles_acot_delta_desc:0 "Les systèmes de lumière dure basés sur la matière noire ont le potentiel de révolutionner la synthèse moléculaire."
 job_giga_megaengineer_acot_delta:0 "Technicien en Matière de Lumière Dure"
 job_giga_megaengineer_acot_delta_plural:0 "Techniciens en Matière de Lumière Dure"
 job_giga_megaengineer_acot_delta_desc:0 "Les outils en lumière dure et les techniques de compression de matière noire ont considérablement amélioré les taux de synthèse des matériaux."
