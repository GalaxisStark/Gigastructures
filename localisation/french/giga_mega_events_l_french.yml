l_french:
 giga_dialog.40041.desc:0 "Les travaux sur la sphère de Dyson de [From.From.GetName] progressent, avec l'installation de nouveaux capteurs solaires avancés augmentant les bénéfices de la sphère. \n\nLes gains énergétiques ont atteint 50 % de la valeur maximale prévue une fois les travaux terminés."
 giga_dialog.40042.desc:0 "Avec l'ajout d'un nouvel ensemble de panneaux de collecte solaire, la sphère de Dyson en construction dans le système [From.From.GetName] est presque terminée.\n\nLa structure génère désormais 75 % de l'énergie maximale prévue pour une étoile de cette taille.\n\nBientôt, la pleine puissance de l'étoile elle-même sera entre nos mains."
 giga_dialog.101.name:0 "Site du $name_kugelblitz$ construit"
 giga_dialog.101.desc:0 "Le site de construction d’un $name_kugelblitz$ dans le système [giga_system.GetName] est maintenant terminé. Il abrite le personnel et les équipements nécessaires à la création d’un Kugelblitz artificiel, une singularité formée à partir de radiations plutôt que de matière ! Nous pourrons y injecter de l’énergie et de la matière, puis les extraire ultérieurement, transformant ainsi le Kugelblitz en un silo extrêmement efficace !"
 giga_dialog.101.a:0 "Excellent."
 giga_dialog.102.name:0 "$name_kugelblitz$ vide construit"
 giga_dialog.102.desc:0 "Nos ingénieurs ont achevé la construction du dispositif massif permettant de générer un Kugelblitz artificiel."
 giga_dialog.102.a:0 "Parfait."
 giga_dialog.103.name:0 "Kugelblitz généré !"
 giga_dialog.103.desc:0 "Notre $name_kugelblitz$ a réussi à générer un Kugelblitz artificiel ! Bien qu’il perde actuellement de l’énergie à cause du rayonnement de Hawking accéléré, il peut désormais stocker de la matière et de l’énergie sous forme de radiations pour une utilisation ultérieure !"
 giga_dialog.103.a:0 "Merveilleux !"
 giga_dialog.106.name:0 "Kugelblitz amélioré !"
 giga_dialog.106.desc:0 "Notre $name_kugelblitz$ au-dessus de [giga_planet.GetName] a été amélioré avec succès ! Déjà, les entrepôts ailleurs dans [giga_system_owner.GetName] commencent à vider leurs stocks et à les expédier vers [giga_planet.GetName] pour profiter de la capacité accrue de la singularité artificielle."
 giga_dialog.106.a:0 "Un grand exploit."
 giga_dialog.107.name:0 "Le Grand Entrepôt"
 giga_dialog.107.desc:0 "Notre $name_kugelblitz$ près de [giga_planet.GetName] a été entièrement mis à niveau grâce aux dernières avancées technologiques en matière d’ingénierie tétradimensionnelle. La singularité artificielle au cœur de la structure a déjà atteint une taille presque supérieure à celle de la planète autour de laquelle elle est construite.\n\nAvec un tel édifice, nous pouvons désormais stocker des quantités de matières premières et de biens raffinés qui, auparavant, semblaient impossibles. Les projections de production indiquent qu'il pourrait s'écouler plusieurs années avant que le kugelblitz ne soit rempli à sa capacité maximale stable."
 giga_dialog.107.a:0 "Vraiment incroyable !"
 giga_dialog.104.name:0 "$name_kugelblitz$ en ruine"
 giga_dialog.104.desc:0 "En entrant dans le système [from.GetName], notre vaisseau scientifique a été accueilli par des visions étranges. Un $name_kugelblitz$ a été repéré en orbite autour de l’une des planètes ! Cette construction incroyablement avancée pouvait contenir une singularité contrôlée, capable de générer d’énormes quantités d’énergie. Malheureusement, elle semble être dans un état de délabrement avancé."
 giga_dialog.104.a:0 "Fascinant."
 giga_dialog.105.name:0 "$name_kugelblitz$ réparé !"
 giga_dialog.105.desc:0 "Un $name_kugelblitz$ en ruine a été remis en état de fonctionnement par nos équipes d’ingénieurs ! Dès sa réactivation, la structure a commencé à générer une singularité massive contrôlée, à partir de laquelle nous pouvons extraire de grandes quantités d’énergie et stocker de la matière sous forme de radiations."
 giga_dialog.105.a:0 "Comment cela fonctionne-t-il seulement ?"
 giga_dialog.1207.title:0 "Objectif du $name_penrose$"
 giga_dialog.1207.a.desc:0 "Avec l'armature du miroir désormais achevée autour de [giga_system.GetName], nous pouvons enfin commencer les préparatifs pour l'utiliser comme une bombe.\n\nNous devrons la laisser accumuler de l'énergie pendant quelques années, après quoi elle pourra être déclenchée. Tout dans le système sera détruit, et l'explosion sera si puissante qu'elle se propagera à travers les hyperlignes. Chaque planète dans les systèmes voisins deviendra inhabitable sous l'effet du flux d'énergie, et toutes les planètes situées à deux sauts seront irradiées. Plus important encore, cela enverra une onde de choc à travers le subespace, perturbant et réorganisant les hyperlignes jusqu'à 4 sauts de distance !"
 giga_dialog.1207.b.desc:0 "Avec l'armature du miroir désormais achevée autour de [giga_system.GetName], nous pouvons enfin commencer les préparatifs pour la stabiliser et l'utiliser pour la production d'énergie.\n\nSon rendement initial sera relativement modeste (250 £energy£), mais il pourrait être possible de l'améliorer une fois les technologies appropriées découvertes."
 giga_dialog.1207.a:0 "Un parfait instrument de destruction."
 giga_dialog.1207.b:0 "Bientôt, sa pleine puissance sera nôtre."
 giga_dialog.3401.name:0 "Site de construction du $name_fusion_suppressor$ achevé"
 giga_dialog.3401.desc:0 "Le site de construction du futur $name_fusion_suppressor$ a été érigé avec succès dans le système [giga_system.GetName]. Il abritera les infrastructures nécessaires à la construction d'un $name_fusion_suppressor$, capable de modifier les processus internes d'une étoile."
 giga_dialog.3401.a:0 "Parfait."
 giga_dialog.3402.name:0 "Modulateurs gravitationnels construits"
 giga_dialog.3402.desc:0 "Nos ingénieurs ont achevé l'installation de la vaste gamme de modulateurs gravitationnels du $name_fusion_suppressor$ autour de [giga_system.GetName]. Ces dispositifs massifs sont capables de générer un champ gravitationnel artificiel pour compresser une étoile entière et modifier ses processus de fusion internes."
 giga_dialog.3402.a:0 "Formidable."
 giga_dialog.3403.name:0 "Stabilisateurs stellaires construits"
 giga_dialog.3403.desc:0 "Les stabilisateurs stellaires du $name_fusion_suppressor$ autour de [giga_system.GetName] sont désormais opérationnels. Ils permettent de stabiliser l'étoile pendant que les modulateurs gravitationnels génèrent le champ gravitationnel artificiel. Nous pouvons maintenant commencer le processus de compression de l'étoile, ce qui pourrait aboutir à sa destruction ou à sa transformation en trou noir."
 giga_dialog.3403.a:0 "Incroyable."
 giga_dialog.3404.name:0 "Compression stellaire - Étape I"
 giga_dialog.3404.desc:0 "Notre $name_fusion_suppressor$ a commencé à compresser [giga_system.GetName]. Les processus de fusion de l'étoile ont été modifiés et un puissant champ gravitationnel a été généré, réduisant le volume apparent de l'étoile. Les nombreux effets de cette transformation sont actuellement étudiés par plusieurs laboratoires du $name_fusion_suppressor$."
 giga_dialog.3404.a:0 "Une prouesse impressionnante."
 giga_dialog.3405.name:0 "Compression stellaire - Étape II"
 giga_dialog.3405.desc:0 "Le $name_fusion_suppressor$ a encore réduit le volume de [giga_system.GetName]. Des phénomènes fascinants sont apparus dans l’étoile, offrant d'importants bénéfices scientifiques. L'étoile commence à présenter un comportement défiant les lois de la physique. Une compression supplémentaire devrait produire encore plus de découvertes."
 giga_dialog.3405.a:0 "Excellent."
 giga_dialog.3406.name:0 "Compression stellaire - Étoile à neutrons"
 giga_dialog.3406.desc:0 "Le $name_fusion_suppressor$ a comprimé [giga_system.GetName] au point que les protons et électrons de son noyau ont fusionné pour devenir des neutrons, transformant ainsi le noyau en une étoile à neutrons entourée d'une couche de plasma stellaire exotique.\n\nNous pouvons maintenant la conserver sous cette forme, ce qui nous apportera des avancées en physique et en ingénierie. Sinon, nous pouvons la compresser davantage pour en faire un trou noir, offrant d’importantes découvertes en physique. Enfin, le $name_fusion_suppressor$ peut relâcher toute la compression gravitationnelle et générer une force répulsive, provoquant une supernova qui détruira le $name_fusion_suppressor$ et déposera une nouvelle ressource stratégique sur les planètes du système."
 giga_dialog.3406.a:0 "Une opportunité fascinante."
 giga_dialog.3407.name:0 "$name_fusion_suppressor$ Démantelé"
 giga_dialog.3407.desc:0 "Le $name_fusion_suppressor$ dans le système [giga_system.GetName] a été démantelé avec succès. Le Trou Noir qu'il a créé est désormais utilisable pour d'autres projets."
 giga_dialog.3407.a:0 "Merveilleux."
 giga_dialog.3409.title:0 "Supernova"
 giga_dialog.3409.desc:0 "Le $name_fusion_suppressor$ a relâché tous les champs gravitationnels appliqués à l’étoile et a commencé à exercer une force gravitationnelle négative.\nEn quelques secondes, les forces répulsives du noyau à neutrons surpassent la gravité naturelle, libérant l’énergie bouillonnante d’une étoile surcompressée.\nL’étoile commence à briller intensément et semble pulser durant quelques instants, avant que ses couches externes ne soient brutalement expulsées à des vitesses relativistes. En quelques heures, chaque planète du système est vitrifiée par l’onde de choc, leurs surfaces et atmosphères étant réduites à néant.\nDes dépôts d’Iodizium se sont formés sur ces planètes désormais en fusion, prêts à être exploités."
 giga_dialog.3409.a:0 "Un spectacle grandiose !"
 giga_dialog.3410.title:0 "Trou Noir"
 giga_dialog.3410.desc:0 "Le $name_fusion_suppressor$ a intensifié son champ gravitationnel artificiel au maximum. L’étoile s’est effondrée au point où même la lumière ne peut plus échapper à son attraction gravitationnelle, la transformant en trou noir. Les laboratoires du $name_fusion_suppressor$ ont déjà commencé à analyser cette singularité artificielle, produisant des données scientifiques fascinantes."
 giga_dialog.3410.a:0 "Une avancée phénoménale !"
 giga_dialog.2501.title:0 "Spécialisation du Segment Alderson"
 giga_dialog.2501.desc:0 "Le moment est venu de décider quel type de segment Alderson nous souhaitons développer pour cette section en particulier. Le type pourra être modifié ultérieurement, une fois le segment achevé, grâce à la terraformation."
 giga_dialog.2502.title:0 "Site de Construction du $name_alderson$ Terminé !"
 giga_dialog.2502.desc:0 "Le site de construction de notre $name_alderson$ a été achevé dans le système [giga_system.GetName]. Cette plateforme servira de base pour entamer la construction de l’armature colossale de la structure, qui s’étendra jusqu’aux confins du système. Il sera également possible de construire des segments Alderson spécialisés en Informatique Planétaire et en Écumenopolis, si leurs équivalents planétaires sont déjà débloqués."
 giga_dialog.2502.a:0 "Parfait."
 giga_dialog.2503.title:0 "Armature du $name_alderson$ Terminée !"
 giga_dialog.2503.desc:0 "L'armature couvrant l’ensemble du système du Disque d'Alderson est désormais achevée ! Cet immense squelette métallique recouvre tout le système et servira de base pour la construction des segments eux-mêmes. Chaque segment comprendra 15 districts, chacun étant 4 fois plus puissant qu’un district classique de monde-anneau. Une fois achevée, cette structure colossale fera sans aucun doute de nous les plus grands bâtisseurs de cette galaxie."
 giga_dialog.2503.a:0 "Mais comment cela ne s’effondre-t-il pas sur lui-même ?"
 giga_dialog.2503.a.tooltip:0 "L’ingénierie multidimensionnelle est littéralement une condition préalable à cette construction."
 giga_dialog.2504.title:0 "Segment Alderson Gaia Terminé !"
 giga_dialog.2504.desc:0 "L'un des segments de notre $name_alderson$ est enfin achevé ! Cet habitat colossal s’étend sur plusieurs unités astronomiques et offrira d’énormes capacités d’hébergement pour notre population et nos industries. Il comporte une large diversité d’écosystèmes et de climats, ce qui le rend habitable pour pratiquement toutes les espèces de la galaxie. Nous devrions commencer à le coloniser immédiatement."
 giga_dialog.2504.a:0 "Merveilleux !"
 giga_dialog.2505.title:0 "Complexe Informatique Alderson Terminé !"
 giga_dialog.2505.desc:0 "L'un des segments de notre $name_alderson$ est enfin achevé ! Cet habitat colossal s’étend sur plusieurs unités astronomiques et offrira d’énormes capacités d’hébergement pour notre population et nos industries. Ce segment est entièrement recouvert de couches et de couches d’ordinateurs et de processeurs surpuissants. Il fournira à nos chercheurs une puissance de calcul pratiquement illimitée, ainsi qu'un accès instantané aux bases de connaissances de notre empire. Cette construction titanesque nous aidera à percer les mystères de l’univers avec une facilité inégalée."
 giga_dialog.2505.a:0 "Merveilleux ! Peut-il faire tourner Crysis ?"
 giga_dialog.2505.a.tooltip:0 "Non."
 giga_dialog.2506.title:0 "Écumenopolis Alderson Terminé !"
 giga_dialog.2506.desc:0 "L'un des segments de notre $name_alderson$ est enfin achevé ! Cet habitat colossal s’étend sur plusieurs unités astronomiques et offrira d’énormes capacités d’hébergement pour notre population et nos industries. Ce segment est entièrement recouvert d’un réseau urbain-industriel dense, offrant une capacité de production et d’accueil gigantesque pour nos citoyens."
 giga_dialog.2506.a:0 "Merveilleux !"
 giga_dialog.25061.title:0 "Alderson de la Ruche Achevé !"
 giga_dialog.25061.desc:0 "L'un des segments de notre $name_alderson$ est enfin terminé ! Cet habitat colossal s'étend sur plusieurs unités astronomiques et fournira un espace immense pour notre population et nos industries. Ce segment entier est un organisme vivant géant, connecté psioniquement avec l'Esprit de la Ruche qui l'a façonné. Tout être ne faisant pas partie de la Ruche qui mettrait les pieds ici serait attaqué par le terrain lui-même."
 giga_dialog.25061.a:0 "Merveilleux !"
 giga_dialog.25062.title:0 "Alderson Mécanique Achevé !"
 giga_dialog.25062.desc:0 "L'un des segments de notre $name_alderson$ est enfin terminé ! Cet habitat colossal s'étend sur plusieurs unités astronomiques et fournira un espace immense pour notre population et nos industries. Ce segment est entièrement recouvert de structures artificielles. Son atmosphère fine est principalement composée de polluants industriels et n'est pas capable de soutenir la vie biologique."
 giga_dialog.25062.a:0 "Merveilleux !"
 giga_dialog.2507.title:0 "$name_alderson$ Terminé !"
 giga_dialog.2507.desc:0 "C'est fait ! Dans le système [giga_system.GetName], nous avons réussi à assembler un disque colossal s'étendant de l'étoile jusqu'aux confins du système. Cette méga-structure titanesque surpasse tout ce que nous avons construit auparavant et témoigne de notre domination ultime sur les lois de la physique et de l'ingénierie."
 giga_dialog.2507.a:0 "Qui pourrait encore s'opposer à nous ?"
 giga_dialog.3301.name:0 "Site de Construction du $name_auto_stripmine$ Terminé"
 giga_dialog.3301.desc:0 "Nos ingénieurs ont terminé l'assemblage du site de construction d'un futur $name_auto_stripmine$ près de [giga_system.GetName]. Cette grande plateforme orbitale abritera tout ce dont nous avons besoin pour construire un immense complexe minier autour de la planète, exploitant presque entièrement ses minéraux."
 giga_dialog.3301.a:0 "Excellent."
 giga_dialog.3302.name:0 "Appareil Orbital du $name_auto_stripmine$ Construit"
 giga_dialog.3302.desc:0 "L'appareil orbital de notre $name_auto_stripmine$ est désormais opérationnel. Cette immense structure comprend deux grands faisceaux tracteurs capables d'acheminer d'énormes quantités de minéraux extraits, ainsi que des faisceaux énergétiques capables de faire fondre les parties les plus dures de la planète. Un anneau de traitement a également été intégré pour maximiser la production minérale. Il ne nous reste plus qu'à achever les installations planétaires, composées de millions d'unités de forage robotisées, pour lancer les opérations d'extraction."
 giga_dialog.3302.a:0 "Merveilleux !"
 giga_dialog.3303.title:0 "Mine Planétaire en Pleine Production"
 giga_dialog.3303.desc:0 "Notre $name_auto_stripmine$ est maintenant pleinement opérationnel ! D'immenses faisceaux tracteurs orbitaux transfèrent des tonnes de minéraux extraits par des millions de drones de forage automatisés, récupérant des motes volatils dans des milliers de complexes miniers répartis sur la planète."
 giga_dialog.3303.monster.desc:0 "Notre $name_auto_stripmine$ est maintenant pleinement opérationnel ! D'immenses faisceaux tracteurs orbitaux transfèrent des tonnes de minéraux extraits par des millions de drones de forage automatisés.\n\nLes habitants précédents de [giga_planet.GetName] n'ont pas réussi à fuir avant l'activation de la structure. Ils seront probablement collectés comme de simples roches et intégrés à la production du $name_auto_stripmine$."
 giga_dialog.3303.a:0 "Production minérale nominale."
 giga_dialog.3303.b:0 "Quelle horreur... pour eux."
 giga_dialog.3304.title:0 "La Mine Planétaire a Atteint le Noyau Externe"
 giga_dialog.3304.desc:0 "Nos ingénieurs et scientifiques travaillant sur le $name_auto_stripmine$ de [giga_planet.GetName] nous informent que les opérations minières ont atteint le noyau externe en fusion de la planète.\nCela signifie que l'extraction minérale cessera dans quelques années, une fois que nous aurons atteint le noyau interne."
 giga_dialog.3304.a:0 "Reçu."
 giga_dialog.3305.title:0 "Mine Planétaire Épuisée"
 giga_dialog.3305.desc:0 "Le $name_auto_stripmine$ de [giga_planet.GetName] a épuisé tous les minéraux exploitables. [giga_planet.GetName] a été réduite à un petit noyau en fusion exposé au vide spatial. Les derniers minéraux du noyau ont été extraits via des techniques de fracturation avancées, laissant uniquement des matériaux de récupération et à peine exploitables. L'appareil orbital a été démantelé et un dépôt de minéraux est désormais présent sur le noyau exposé de la planète."
 giga_dialog.3305.a:0 "C'était inévitable."
 giga_dialog.3306.name:0 "La Mine Planétaire a Découvert des Ressources"
 giga_dialog.3306.desc.minerals:0 "Le $name_auto_stripmine$ de [fromfrom.GetName] a mis au jour de riches veines de minerai. Celles-ci augmenteront de manière significative la production de £minerals£§YMinéraux§! de la structure orbitale.\n\nElles ne devraient durer que pour encore [from.gigas_stripmine_rich_mineral_deposit_length] couches de la planète."
 giga_dialog.3306.desc.alloys:0 "Le $name_auto_stripmine$ de [fromfrom.GetName] a découvert une portion particulièrement dense du manteau. Cette section de lithosphère est structurellement similaire aux £alloys£§YAlliages§!, nous permettant d'exploiter directement des matériaux raffinés. Malheureusement, extraire un matériau assez robuste pour servir d'armure à des vaisseaux spatiaux est une tâche complexe, et la concentration requise sur ce dépôt dense ralentira la production de £minerals£§YMinéraux§!.\n\nNous estimons pouvoir extraire encore [from.gigas_stripmine_alloy_deposit_length] couches avant épuisement."
 giga_dialog.3306.desc.gas:0 "Le $name_auto_stripmine$ de [fromfrom.GetName] a percé d'immenses cavernes remplies d'une forme hautement pressurisée de £exotic_gases£§YGaz Exotiques§! Les drones en surface pourront extraire ces précieux gaz. Malheureusement, la mobilisation des drones pour cette tâche ralentira la production de £minerals£§YMinéraux§!.\n\nNous estimons encore [from.gigas_stripmine_gas_deposit_length] couches exploitables."
 giga_dialog.3306.desc.motes:0 "Le $name_auto_stripmine$ de [fromfrom.GetName] a découvert un filon de composés hautement volatils. Avec un minimum de raffinage, ces matériaux pourraient être transformés en £volatile_motes£§YMotes Volatiles§!. Toutefois, ce processus réduira la production de £minerals£§YMinéraux§!, car il nous faudra ralentir les opérations minières pour éviter toute explosion accidentelle.\n\nNous prévoyons que ces composés s'épuiseront après [from.gigas_stripmine_motes_deposit_length] couches supplémentaires."
 giga_dialog.3306.desc.crystals:0 "Le $name_auto_stripmine$ de [fromfrom.GetName] a localisé une caverne remplie de structures cristallines. Un traitement adéquat pourrait permettre de transformer ces fragments en £rare_crystals£§YCristaux Rares§!. La caverne étant instable, la nécessité de l'excaver avec soin pour éviter d'endommager les cristaux ralentira malheureusement la production de £minerals£§YMinéraux§!.\n\nLes cavernes devraient être présentes pour encore [from.gigas_stripmine_crystal_deposit_length] couches."
 giga_dialog.3306.desc.tensiles:0 "Le $name_auto_stripmine$ de [fromfrom.GetName] a fait une découverte vraiment remarquable : une partie de la planète est 'creuse', cette cavité interne résistant aux forces gravitationnelles grâce à un matériau naturellement présent, le £giga_sr_amb_megaconstruction£§YMatériau Supertensile§!. Bien que l'extraction réduise la production de £minerals£§YMinéraux§!, la récolte de ce matériau est d'une valeur inestimable pour de futurs projets de méga-constructions.\n\nCette poche devrait être exploitable encore pendant [from.gigas_stripmine_supertensile_deposit_length] couches de la planète."
 giga_dialog.3306.desc.default:0 "Le $name_auto_stripmine$ de [fromfrom.GetName] a localisé une concentration anormale de ressources enfouies sous la surface de la planète. Ces ressources s'avéreront précieuses pour augmenter la production de la structure, bien qu'elles ne dureront pas éternellement."
 giga_dialog.1901.name:0 "Site de Construction du $name_succ$ Terminé"
 giga_dialog.1901.desc:0 "Le site de construction d'un futur $name_succ_full$ dans le système [giga_system.GetName] a été achevé ! Sur cette plateforme, nous construirons un immense dispositif qui récoltera progressivement l'atmosphère du Géant Gazeux et la filtrera en gaz exotiques. Il générera également de l'énergie grâce à des réacteurs à fusion utilisant l'hydrogène présent dans l'atmosphère.\n\nGardez à l'esprit qu'il finira par s'épuiser, laissant derrière lui un monde stérile."
 giga_dialog.1901.a:0 "Combien de temps a-t-il fallu pour trouver cet acronyme ?"
 giga_dialog.1903.title:0 "$name_succ$ Opérationnel !"
 giga_dialog.1903.desc:0 "Notre $name_succ$ dans le système [giga_system.GetName] est désormais opérationnel ! Ses faisceaux tracteurs ont été activés, et l’atmosphère du Géant Gazeux est progressivement récoltée."
 giga_dialog.1903.a:0 "Merveilleux !"
 giga_dialog.1904.title:0 "$name_succ$ Épuisé"
 giga_dialog.1904.desc:0 "Notre $name_succ_full$ dans le système [giga_system.GetName] a maintenant atteint le noyau rocheux du Géant Gazeux. Il n'y a plus d'atmosphère à extraire, et l'ancien Géant Gazeux a été réduit à un petit monde stérile riche en minéraux. La mégastructure a été démantelée, et le noyau est désormais libre d’être utilisé comme bon nous semble."
 giga_dialog.1904.a:0 "Toutes choses ont une fin."
 giga_dialog.3001.name:0 "Le Mythe du Carré"
 giga_dialog.3001.desc:0 "Dans le système [from.GetName] se trouve une étrange construction. Nos scientifiques sont perplexes devant cette immense installation orbitale qui entoure l'étoile du système. En fait, elle est si absurde qu'elle a d'abord été prise pour une erreur sensorielle, voire une plaisanterie.\n\nUn $name_ringworld_square$.\n\nDans le système [from.GetName] réside un anneau-monde en forme de carré. Bien qu'il semble avoir subi de lourds dommages par le passé, sa structure reste en grande partie intacte. Cette forme défie toutes nos connaissances en physique et en ingénierie, car la gravité aurait dû le détruire depuis des millénaires. Pourtant, il est là, attendant que quelqu'un lève le voile sur ses mystères.\n\nUne petite station en ruine flotte également au-dessus de l'étoile. Nos scientifiques pensent qu'elle pourrait contenir des informations précieuses sur cette structure singulière.\n\nUn §SProjet Spécial§! a été lancé pour enquêter sur cette structure et la station, afin de comprendre comment elle peut encore exister."
 giga_dialog.3001.a:0 "Quelle curiosité."
 giga_dialog.3002.name:0 "Les Mystères du Carré"
 giga_dialog.3002.desc:0 "Après des dizaines d'expéditions et plusieurs mois de recherche, nos scientifiques pensent enfin avoir percé les secrets du Monde-Carré.\n\nBien que son extérieur soit gravement endommagé, son intérieur est presque intact et la plupart des systèmes fonctionnent encore ! Son cadre est principalement composé de Qubérine, un alliage avancé doté de propriétés d’auto-réparation incroyablement complexes, ce qui explique sa résistance aux forces titanesques qui s'exercent sur lui.\n\nNos scientifiques estiment qu'il est possible de réparer cette structure, moyennant des ressources et des technologies suffisamment avancées. Ils ont également détecté des usines de fabrication de Qubérine désactivées à l'intérieur, qui pourraient être réactivées une fois l'alimentation rétablie.\n\nL'équipe de recherche a également conclu que la petite station en orbite sert de 'point central d'accès' aux systèmes internes du Monde-Carré. Ils recommandent d'investir en ressources pour la restaurer et la remettre en ligne, car elle pourrait contenir des données inestimables sur le Monde-Carré et ses créateurs. Ces informations pourraient bien être la clé de sa restauration."
 giga_dialog.3002.a:0 "Merveilleux ! Réparons immédiatement cette station."
 giga_dialog.3003.name:0 "Monde-Carré Restauré !"
 giga_dialog.3003.desc:0 "Nos ingénieurs rapportent avec fierté qu'une section du Monde-Carré a été entièrement restaurée ! L'alimentation auxiliaire a été rétablie, et les usines de fabrication de Qubérine produisent de nouveau cet alliage avancé. Étrangement, la forte concentration de Qubérine dans la structure et le sol a eu pour effet de rendre la végétation anormalement verte, mais à part cela, tout semble fonctionner normalement."
 giga_dialog.3003.a:0 "Incroyable !"
 giga_dialog.3004.name:0 "Le Monde-Carré Parle"
 giga_dialog.3004.desc:0 "Incroyable nouvelle ! Après avoir réparé et remis sous tension la station située dans le système du Monde-Carré, une ancienne intelligence artificielle en sommeil, hébergée à la fois dans la station et dans le Monde-Carré lui-même, semble s'être réveillée.\n\nCette IA, dont le nom est §YGaryx§!, d'après les données récupérées sur la station, était apparemment chargée de l'entretien du Monde-Carré et de ses vastes systèmes internes. Nos équipes de recherche ont réussi à établir un contact avec elle, et elle semble très impatiente de communiquer avec nous."
 giga_dialog.3004.a:0 "Affichez à l’écran."
 giga_dialog.3005.name:0 "Garyx, Gardien du Monde-Carré"
 giga_dialog.3005.desc:0 "Ah, des visiteurs ! Merci d’avoir envoyé suffisamment d’énergie à la station pour me sortir de l’hibernation. Cela fait longtemps que je n’ai pas parlé à une entité pensante.\n\nJe suis Garyx, l'intelligence artificielle chargée de l'entretien du Monde-Carré et de ses vastes archives de données. J’ai pris la forme d’un hologramme reptilien, car c’est à cela que ressemblaient mes créateurs.\n\nBref, désolé pour l’état déplorable du Monde-Carré. J’ai trouvé un documentaire particulièrement intéressant sur la reproduction reptilienne, et j’ai passé les 120 derniers millénaires à l’étudier en utilisant l’énergie de secours afin de mieux comprendre mes créateurs. Malheureusement, il semblerait qu’un événement dramatique se soit produit entre-temps… Tant pis.\n\nPuisque vous êtes ici, et puisque mes créateurs ont apparemment disparu depuis longtemps, je vous accorde l’accès aux archives du Monde-Carré, qui sont étonnamment en grande partie intactes."
 giga_dialog.3005.a:0 "Que contiennent ces archives ?"
 giga_dialog.3005.a.response:0 "Oh, beaucoup de choses. Mes créateurs y ont stocké d’innombrables données sur les différentes civilisations et espèces qu’ils connaissaient, leurs avancées scientifiques, et surtout, leur divinité §BQubey§!.\nIls voulaient préserver ce savoir pour que les générations futures puissent en bénéficier et, puisque vous êtes là aujourd’hui, je suppose qu’ils ont réussi dans leur mission. Dommage qu’ils ne soient plus là pour le voir…"
 giga_dialog.3005.b:0 "Depuis combien de temps le Monde-Carré existe-t-il ?"
 giga_dialog.3005.b.response:0 "Eh bien, en me basant sur la position des étoiles, j’estime que cette chose est en ruine depuis environ 120 000 de vos années, mais elle est bien plus ancienne.\nElle a été construite il y a environ 567 000 ans par mes créateurs et a abrité leur civilisation pendant de nombreux millénaires. Je ne sais pas exactement ce qui lui est arrivé, car j’étais complètement absorbé par mes recherches. L’hypothèse la plus probable est que leur civilisation s’est effondrée sous le poids de la décadence, ou qu’elle est simplement devenue trop ancienne et fragmentée, comme tant d’autres empires avant elle."
 giga_dialog.3005.c:0 "Qui a construit le Monde-Carré, et pourquoi ?"
 giga_dialog.3005.c.response:0 "Mes créateurs. Ils étaient une espèce de §R(DONNÉES CORROMPUES)§!, connue sous le nom de §R(DONNÉES CORROMPUES)§!, et ils dirigeaient un empire immense, le §R(DONNÉES CORROMPUES)§!\n\nIls étaient extrêmement religieux et vénéraient une divinité qu’ils appelaient §BQubey§!. Cette divinité était censée avoir aidé leur espèce à évoluer pendant des millions d’années, et beaucoup voyaient la perfection des formes géométriques comme une manifestation de la présence de §BQubey§! dans l’univers.\n\nMes créateurs ont fini par découvrir une substance incroyable, dotée de propriétés d’auto-réparation inégalées. Ils l’ont appelée 'Qubérine', persuadés qu’elle était faite de §BQubey§! lui-même, et ils ont décidé de l’utiliser pour construire cette structure défiant les lois de la physique, afin de vénérer et de témoigner leur gratitude envers §BQubey§!.\n\nIls en ont également profité pour stocker un maximum d’informations sur leurs avancées scientifiques, la Qubérine, le Monde-Carré et §BQubey§! dans les bases de données, dans l’espoir qu’une civilisation future les découvre et apprenne l’existence du tout-puissant §BQubey§!."
 giga_dialog.3005.d:0 "Peut-on réparer le Monde-Carré ?"
 giga_dialog.3005.d.response:0 "Espérons-le ! Les archives, qui sont en grande partie fonctionnelles, contiennent de nombreuses données sur la structure interne et externe du Monde-Carré. Si vous me laissez quelques dizaines de mois pour compiler toutes ces informations, je pourrai fournir à vos scientifiques une base de données contenant tout le nécessaire pour entreprendre des réparations approfondies sur la mégastructure. J’adorerais voir le Monde-Carré restauré à sa gloire passée !"
 giga_dialog.3005.e:0 "Au revoir."
 giga_dialog.3005.e.response:0 "Puisse cette archive vous être utile, et n’hésitez pas à me contacter à nouveau si vous avez besoin d’informations."
 giga_dialog.3006.name:0 "Les Archives"
 giga_dialog.3006.desc:0 "Peu avant de nous déconnecter, §YGaryx§! nous a assuré qu’il nous enverrait une base de données contenant toutes les informations nécessaires à la réparation du Monde-Carré d’ici deux ans.\n\nEn attendant, nous pouvons le contacter à nouveau en 'améliorant' la Mégastructure du Hub du Monde-Carré. Nos scientifiques pensent que sa capacité à naviguer facilement dans les archives du Monde-Carré pourrait grandement contribuer à notre recherche."
 giga_dialog.3006.a:0 "Reçu."
 giga_dialog.3007.name:0 "Garyx, Gardien du Monde-Carré"
 giga_dialog.3007.desc:0 "Salutations à nouveau. J’ai fini de compiler une base de données contenant toutes les informations nécessaires pour réparer le Monde-Carré ! Je vais la transmettre immédiatement à vos scientifiques."
 giga_dialog.3007.a:0 "Merveilleux ! Nous ferons bon usage de ces connaissances."
 giga_dialog.3008.name:0 "Garyx, Gardien du Monde-Carré"
 giga_dialog.3008.desc:0 "Ah, salutations ! Êtes-vous venu chercher plus de données dans les archives ? Comment puis-je vous aider ?"
 giga_dialog.3008.a:0 "Pouvez-vous aider nos recherches ?"
 giga_dialog.3008.c:0 "Fin de transmission."
 giga_dialog.3009.name:0 "Garyx, Gardien du Monde-Carré"
 giga_dialog.3009.desc:0 "Mais bien sûr ! Je peux parcourir les archives du Monde-Carré à la recherche de données qui pourraient vous être utiles. Quel type de données souhaitez-vous que je récupère ?"
 giga_dialog.3009.a:0 "£physics_research£ §YRecherche en Physique§!"
 giga_dialog.3009.a.response:0 "Très bien ! Je vais récupérer des données liées à vos recherches en physique, ce qui vous offrira une §Yaugmentation de 10%§! de votre vitesse de recherche dans cette catégorie.\n\nSi vous souhaitez que j’améliore un autre domaine, contactez-moi à nouveau et choisissez une autre option."
 giga_dialog.3009.b:0 "£engineering_research£ §YRecherche en Ingénierie§!"
 giga_dialog.3009.b.response:0 "Très bien ! Je vais récupérer des données liées à vos recherches en ingénierie, ce qui vous offrira une §Yaugmentation de 10%§! de votre vitesse de recherche dans cette catégorie."
 giga_dialog.3009.c:0 "£society_research£ §YRecherche en Société§!"
 giga_dialog.3009.c.response:0 "Très bien ! Je vais récupérer des données liées à vos recherches en société, ce qui vous offrira une §Yaugmentation de 10%§! de votre vitesse de recherche dans cette catégorie."
 giga_dialog.3009.d:0 "Finalement, ne nous aidez pas."
 giga_dialog.3009.d.response:0 "D’accord, j’arrête d’aider vos recherches, si c’est ce que vous voulez…"
 giga_dialog.13701.name:0 "Gestion des Mégastructures"
 giga_dialog.13701.desc:0 "La nouvelle structure [from.GetName] dans [fromfrom.GetName] dispose d'options supplémentaires accessibles via un bouton situé en haut à droite de l'interface utilisateur des mégastructures.\n\nSoyez attentif aux autres mégastructures où ce bouton est disponible, car [from.GetName] n'est pas la seule mégastructure à offrir de telles options.\n\nCe message ne sera affiché qu'une seule fois."