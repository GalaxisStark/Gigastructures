l_french:
 giga_ai_savings_info:0 "Informations sur les Économies Mégastructurelles de l'IA"
 giga_ai_savings_info_desc:0 "§LUne aide précieuse pour la planification financière.§!"
 mod_giga_ai_savings_tooltips_minerals_produces_add:0 "Affiche combien l'IA a mis de côté pour les mégastructures. Ces valeurs sont déduites des coûts de construction des mégastructures prises en charge et diminuent lorsque la construction commence.\n\n§EMégastructures Économiques Importantes:§!\n£alloys£ $alloys$: §Y[giga_ai_savings_important_alloys]§!\n£unity£ $unity$: §Y[giga_ai_savings_important_unity]§!\n\n§EMégastructures Économiques Secondaires:§!\n£alloys£ $alloys$: §Y[giga_ai_savings_resource_alloys]§!\n£unity£ $unity$: §Y[giga_ai_savings_resource_unity]§!\n\n§EMégastructures Utilitaires:§!\n£alloys£ $alloys$: §Y[giga_ai_savings_utility_alloys]§!\n£unity£ $unity$: §Y[giga_ai_savings_utility_unity]§!\n\n§EMégastructures Militaires:§!\n£alloys£ $alloys$: §Y[giga_ai_savings_military_alloys]§!\n£unity£ $unity$: §Y[giga_ai_savings_military_unity]§!\n\nModificateur factice pour que les valeurs s'affichent correctement."
 r_giga_ai_savings:0 "Compte d'Épargne de l'IA"
 r_giga_ai_savings_desc:0 "Ceci est une relique uniquement pour l'IA qui fournit les modificateurs pour la fonctionnalité d'épargne de mégastructures. Elle ne fait rien pour un joueur humain et est supprimée si elle est possédée par l'un d'eux au début de l'année.\n\n§LHolla holla get dolla§!"
