 job_maginot_military_police:0 "Police Militaire Maginot"
 job_maginot_military_police_plural:0 "Polices Militaires Maginot"
 job_maginot_military_police_desc:0 "Chargés du maintien de l'ordre et de l'application des lois, ils sont spécialement formés pour faire face quotidiennement à du personnel militaire armé, une constante de la vie sur un $name_maginot_world$."
 job_maginot_military_police_effect_desc:0 "£job_maginot_military_police£ $job_maginot_military_police_plural$ réduisent £crime£ §Y$PLANET_CRIME_TITLE$§!, augmentent £mod_planet_stability_add£ §Y$PLANET_STABILITY_TITLE$§! et génèrent des £defense_army£ §YArmées Défensives§!."
