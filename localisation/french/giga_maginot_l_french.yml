 job_maginot_planetary_cannon_operator:0 "Opérateur du Réseau de Défense"
 job_maginot_planetary_cannon_operator_plural:0 "Opérateurs du Réseau de Défense"
 job_maginot_planetary_cannon_operator_desc:0 "Une armée d’ingénieurs spécialisés maintient les canons planétaires et les relais orbitaux. Du personnel est posté à la fois sur les armes terrestres et sur les plateformes SD orbitales afin d’engager tout ennemi assez imprudent pour partager un système avec un $name_maginot_world$."
