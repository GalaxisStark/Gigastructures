 job_maginot_central_command_gestalt:0 "Drones de Commandement Central Maginot"
 job_maginot_central_command_gestalt_plural:0 "Drones de Commandement Central Maginot"
 job_maginot_central_command_gestalt_desc:0 "Des drones soigneusement sélectionnés et spécialement conçus pour des missions de commandement, chargés de superviser le $name_maginot_world$. Ils contrôlent l’immense réseau de défenses planétaires depuis les complexes de commandement les plus profonds."
 job_maginot_central_command_gestalt_effect_desc:0 "£job_maginot_central_command_gestalt£ $job_maginot_central_command_gestalt_plural$ réduisent £crime£ §Y$PLANET_CRIME_TITLE$§!, augmentent £mod_planet_stability_add£ §Y$PLANET_STABILITY_TITLE$§!, génèrent £defense_army£ §YArmées Défensives§!, augmentent £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§! et produisent £unity£ §Y$unity$§! ainsi que £influence£ §YInfluence§!."
