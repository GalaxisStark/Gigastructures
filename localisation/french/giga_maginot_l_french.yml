l_french:
 name_maginot:0 "Monde Maginot"
 is_giga_maginot_world:0 "$TRIGGER_FAIL$§RDoit être un Monde Maginot.§!"
 giga_tech_repeatable_maginot_cap: "Protocoles de gestion du Monde Maginot"
 giga_tech_repeatable_maginot_cap_desc: "Des protocoles avancés de construction et d’entretien permettant la construction et la gestion de §YMondes Maginot§! supplémentaires au sein de notre empire."
 giga_maginot_capacity_increase_title: "Capacité de §YMonde Maginot§! : §G+1§!"
 giga_maginot_capacity_increase_desc: "La capacité impériale des §YMondes Maginot§! est augmentée de §G+1§!"
 d_maginot_subspace_disruptor:0 "Système de Perturbation du Subespace Maginot"
 d_maginot_subspace_disruptor_desc:0 "Ce $name_maginot_world$ génère un puissant champ de perturbation qui se propage à travers le subespace, empêchant l'utilisation des trous de ver dans ce système. De plus, les propulseurs à saut sont rendus inopérants dans ce système et les systèmes voisins."
 heavy_defender:0 "Défenseur Lourd"
 heavy_defender_desc:0 "Une force spéciale dédiée à la défense planétaire."
 heavy_defender_plural:0 "Défenseurs Lourds"
 robot_heavy_defender:0 "Défenseur Lourd Robotique"
 robot_heavy_defender_desc:0 "Une force spéciale robotisée dédiée à la défense planétaire."
 robot_heavy_defender_plural:0 "Défenseurs Lourds Robotiques"
 machine_heavy_defender:0 "Défenseur Lourd Mécanique"
 machine_heavy_defender_desc:0 "Unités de combat lourdes spécialisées dans la défense planétaire."
 machine_heavy_defender_plural:0 "Défenseurs Mécaniques"
 maginot_artillery_army:0 "Artillerie Planétaire"
 maginot_artillery_army_desc:0 "Des canons d'artillerie massifs capables de déchirer les forces envahissantes, mais relativement fragiles."
 maginot_artillery_army_plural:0 "Artilleries Planétaires"
 maginot_shield_army:0 "Batterie de Boucliers"
 maginot_shield_army_desc:0 "D'immenses générateurs de boucliers conçus pour absorber les dégâts des forces ennemies."
 maginot_shield_army_plural:0 "Batteries de Boucliers"
 maginot_bunker_army:0 "Réseau de Fortifications"
 maginot_bunker_army_desc:0 "Vastes réseaux de bunkers, tranchées et canons dissimulés destinés à ralentir autant que possible l'avancée ennemie."
 maginot_bunker_army_plural:0 "Réseaux de Fortifications"
 maginot_assault_unit:0 "Unité d'Assaut Maginot"
 maginot_assault_unit_desc:0 "Une unité spéciale entraînée dans les installations d'un $name_maginot$ pour les opérations offensives et les invasions planétaires."
 maginot_machine_assault_unit:0 "$maginot_assault_unit$"
 maginot_machine_assault_unit_desc:0 "$maginot_assault_unit_desc$"
 NAME_planetary_artillery:0 "Artillerie Planétaire"
 NAME_shield_battery:0 "Batterie de Boucliers"
 NAME_fortification_network:0 "Réseau de Fortifications"
 NAME_heavy_defender:0 "Unité de Défense Lourde"
 building_giga_maginot_stronghold:0 "Complexe Fortifié Maginot"
 building_giga_maginot_stronghold_desc:0 "De nouvelles techniques dans le domaine de la fortification excessive permettent la construction de complexes comme celui-ci. Construire un $name_maginot_world$ ici étendra ces défenses à l'ensemble de la planète."
 building_giga_maginot_global_bunker:0 "Système de Bunkers Globaux Maginot"
 building_giga_maginot_global_bunker_desc:0 "Un réseau de bunkers souterrains couvrant toute la planète, offrant à nos armées une puissance de frappe inégalée sur ce monde."
 decision_maginot_anti_jump_on:0 "£maginot_bunker_01£ Activer le Champ de Perturbation Subspatial Maginot"
 decision_maginot_anti_jump_on_desc:0 "Le $name_maginot_world$ commence à générer un champ de perturbation subspatial, qui interfère avec l'utilisation du subespace dans ce système et les systèmes voisins. L'effet est plus faible dans les autres systèmes."
 decision_maginot_anti_jump_on_effect:0 "Ce système solaire ainsi que tous les systèmes §Y1 saut plus loin§! qui sont §Ycontrôlés par votre empire (ou un vassal)§! reçoivent un modificateur spécial qui bloque l'§Yutilisation des propulseurs à saut§! et du §Yvoyage subspatial§!. Le système du $name_maginot_world$ lui-même §Yne peut pas être ciblé par le NDB ou le QSO§!. La vérification est effectuée lors de l'activation de la décision, il est donc conseillé d’activer et de désactiver l'effet pour protéger les systèmes nouvellement apparus ou conquis."
 decision_maginot_anti_jump_on_must_not_already_be_active:0 "£trigger_no£ Un autre $name_maginot_world$ dans ce système ou un système voisin génère déjà un champ de perturbation subspatial."
 decision_maginot_anti_jump_off:0 "£maginot_bunker_01£ Maginot Désactiver le Champ de Perturbation de Subespace"
 decision_maginot_anti_jump_off_desc:0 "Le champ est désactivé pour économiser sur l’entretien ou mettre à jour les paramètres de ciblage."
 decision_maginot_anti_jump_off_effect:0 "Ce système ainsi que tous les systèmes §Yà 1 saut§! qui sont §Ypossédés par votre empire (ou un vassal)§! voient leur protection contre les propulseurs à saut désactivée. Activez et désactivez le champ pour couvrir les systèmes nouvellement générés ou conquis."
 decision_maginot_basic_garrison_check:0 "£maginot_bunker_08£ Maginot Vérification de la Garnison"
 decision_maginot_basic_garrison_check_desc:0 "Effectuer un recensement, s'assurer que la garnison est alerte et prête."
 decision_maginot_basic_garrison_check_effect:0 "Supprime et réattribue la §Ygarnison de base de 5 armées§! qui devrait être présente, fournissant une défense terrestre minimale pour le $name_maginot_world$. \nRafraîchit les armées accordées par les §YRéseaux de Défense Orbitaux§!, les §YGénérateurs de Bouclier§! et les §YComplexes de Bunkers§!."
 maginot_wait_for_army_refresh:0 "£trigger_no£ Désactivez la pause du jeu pour permettre la mise à jour de l’effet avant de réessayer."
 decision_maginot_repair_strategic_defence_command:0 "£maginot_bunker_02£ Maginot Réparer le Commandement de la Défense Stratégique"
 decision_maginot_repair_strategic_defence_command_effect:0 "Répare les systèmes de défense orbitaux. Réactive la gestion de la défense orbitale."
 decision_maginot_repair_strategic_defence_command_desc:0 "Ce monde se remet encore d’une bataille récente."
 decision_maginot_basic_point_check:0 "£maginot_bunker_03£ §GValeurs des Points Maginot§!"
 decision_maginot_basic_point_check_effect:0 "§YValeurs Actuelles des Points :§! \n§E[this.giga_maginot_current_SD_platform_count] Plateformes SD§! \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ Disponibles§! | [this.maginot_offensive_upgrade_points_max] Max via Emplois \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ Disponibles§! | [this.maginot_defensive_upgrade_points_max] Max via Emplois \n§YModificateurs Maginot Actuels :§! \n§S[this.maginot_orbital_defence_hp_upgrades] Améliorations HP§! \n§G+[this.maginot_orbital_defence_hp_display]%§! $MOD_SHIP_HULL_MULT$ \n§G+[this.maginot_orbital_defence_hp_display]%§! $MOD_SHIP_ARMOR_MULT$ \n§G+[this.maginot_orbital_defence_hp_display]%§! $MOD_SHIP_SHIELD_MULT$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_HULL_REGEN_ADD_STATIC$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ \n§S[this.maginot_orbital_defence_atk_upgrades] Améliorations ATK§! \n§G+[this.maginot_orbital_defence_atk_display]%§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+[this.maginot_orbital_defence_atk_display]%§! $MOD_SHIP_FIRE_RATE_MULT$ \n§S[this.maginot_orbital_defence_trg_upgrades] Améliorations TRG§! \n§G+[this.maginot_orbital_defence_range_display]%§! $MOD_SHIP_WEAPON_RANGE_MULT$ \n§G+[this.maginot_orbital_defence_tracking_display]§! $MOD_SHIP_TRACKING_ADD$"
 decision_maginot_basic_point_check_desc:0 "Cliquer sur cette décision mettra à jour les valeurs comme les Points d'Amélioration et le Nombre de Plateformes SD pour leur utilisation dans d'autres décisions."
 decision_maginot_construct_secondary_SD_platform:0 "£maginot_bunker_04£ §SMaginot Construire une Plateforme SD Secondaire§!"
 decision_maginot_construct_secondary_SD_platform_effect:0 "Dépenser §Y2§! $offensive_upgrade_point_plural$ pour créer une nouvelle $name_asteroid_artillery$ servant de Plateforme de Défense Stratégique secondaire \n§YPlateformes Actuelles :§! [this.giga_maginot_current_SD_platform_count] \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ Disponibles§!"
 decision_maginot_construct_secondary_SD_platform_desc:0 "Projeter des astéroïdes en orbite pour l'exploitation minière est dépassé, les creuser pour les utiliser comme plateformes de défense est bien plus intéressant."
 decision_maginot_orbital_defence_hp_upgrade:0 "£maginot_bunker_05£ §BMaginot Améliorer les Systèmes de Protection Orbitale§!"
 decision_maginot_orbital_defence_hp_upgrade_effect:0 "§RCout : [this.maginot_orbital_defence_hp_cost] £alloys£ $alloys$§! \nDépenser §Y1§! $defensive_upgrade_point$ pour \n+25% $MOD_SHIP_HULL_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display]%§! \n+25% $MOD_SHIP_ARMOR_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display]%§! \n+25% $MOD_SHIP_SHIELD_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display]%§! \n+500 $MOD_SHIP_HULL_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n+500 $MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n+500 $MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n§YNiveau Actuel :§! [this.maginot_orbital_defence_hp_upgrades] \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ Disponibles§!"
 decision_maginot_orbital_defence_hp_upgrade_desc:0 "Non seulement les générateurs de boucliers peuvent contribuer à la protection des plateformes orbitales, mais ils peuvent aussi être convertis en générateurs de liaison moléculaire pour améliorer l'intégrité structurelle."
 decision_maginot_orbital_defence_atk_upgrade:0 "£maginot_bunker_06£ §RMaginot Améliorer la Puissance de Feu Orbitale§!"
 decision_maginot_orbital_defence_atk_upgrade_effect:0 "§RCout : [this.maginot_orbital_defence_atk_cost] £alloys£ $alloys$§! \nDépenser §Y1§! $offensive_upgrade_point$ pour \n+10% $MOD_SHIP_WEAPON_DAMAGE$ | Actuel §G+[this.maginot_orbital_defence_atk_display]%§! \n+10% $MOD_SHIP_FIRE_RATE_MULT$ | Actuel §G+[this.maginot_orbital_defence_atk_display]%§! \n§YNiveau Actuel :§! [this.maginot_orbital_defence_atk_upgrades] \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ Disponibles§!"
 decision_maginot_orbital_defence_atk_upgrade_desc:0 "Plus de canons, c'est toujours mieux. L'expansion des installations d'interconnexion pour améliorer la coordination des vastes essaims de défense orbitale ne fait jamais de mal."
 decision_maginot_orbital_defence_trg_upgrade:0 "£maginot_bunker_07£ §MMaginot Systèmes de Ciblage Orbital§!"
 decision_maginot_orbital_defence_trg_upgrade_effect:0 "§RCout : [this.maginot_orbital_defence_trg_cost] £alloys£ $alloys$§! \nDépenser §Y1§! $defensive_upgrade_point$ pour \n+20% $MOD_SHIP_WEAPON_RANGE_MULT$ | Actuel §G+[this.maginot_orbital_defence_range_display]%§! \n+5 $MOD_SHIP_TRACKING_ADD$ | Actuel §G+[this.maginot_orbital_defence_tracking_display]§! \n§YNiveau Actuel :§! [this.maginot_orbital_defence_trg_upgrades] \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ Disponibles§!"
 decision_maginot_orbital_defence_trg_upgrade_desc:0 "Les stations de capteurs planétaires peuvent remplacer les générateurs de boucliers pour fournir des informations de ciblage améliorées et surveiller l’ensemble du système solaire."
 defensive_upgrade_point:0 "£job_maginot_shield_generator_operator£ Point d'Amélioration Défensive"
 defensive_upgrade_point_plural:0 "$defensive_upgrade_point$s"
 offensive_upgrade_point:0 "£job_maginot_planetary_cannon_operator£ Point d'Amélioration Offensive"
 offensive_upgrade_point_plural:0 "$offensive_upgrade_point$s"
 maginot_no_offensive_upgrade_points_available:0 "£trigger_no£ Aucun $offensive_upgrade_point_plural$ disponible"
 maginot_no_defensive_upgrade_points_available:0 "£trigger_no£ Aucun $defensive_upgrade_point_plural$ disponible"
 maginot_targetting_upgrade_hard_cap:0 "£trigger_no£ Les systèmes de ciblage ne peuvent être améliorés que §Y5 fois§! au total."
 decision_maginot_mass_recruitment:0 "£maginot_bunker_09£ Maginot Recrutement de Masse"
 decision_maginot_mass_recruitment_desc:0 "Les installations Maginot permettent l'entraînement simultané d'un grand nombre d'armées spécialisées, soutenant les conquêtes offensives de notre empire."
 decision_maginot_mass_recruitment_effect:0 "Recrute simultanément §Y[this.maginot_bunker_count]§! armées d'assaut Maginot spéciales. \n\nLe nombre d'armées est basé sur le nombre de districts §Y[maginot_world_bunker_name]§! sur la planète, avec un minimum de §Y1§!."
 decision_maginot_mass_recruitment_katzenpanzer:0 "£maginot_bunker_10£ Maginot Recrutement de Masse Katzenpanzer"
 decision_maginot_mass_recruitment_katzenpanzer_desc:0 "Un $name_maginot$ est l'endroit idéal pour construire en grande quantité les $riesigerkatzenpanzer_assault$ des Katzen."
 decision_maginot_mass_recruitment_katzenpanzer_effect:0 "Recrute simultanément §Y[this.maginot_bunker_count]§! armées $riesigerkatzenpanzer_assault$. \n\nLe nombre d'armées est basé sur le nombre de districts §Y[maginot_world_bunker_name]§! sur la planète, avec un minimum de §Y1§!."
 district_maginot_world_barracks:0 "District de Casernes"
 district_maginot_world_barracks_desc:0 "D'immenses installations de soutien permettant d’héberger les troupes en surface et en sous-sol, incluant diverses zones de loisirs et de détente."
 district_maginot_world_barracks_plural:0 "Districts de Casernes"
 district_maginot_world_shield_generators:0 "Réseau de Générateurs de Boucliers"
 district_maginot_world_shield_generators_desc:0 "Des émetteurs d’une ampleur inégalée pour tout vaisseau génèrent des champs de force capables de rivaliser avec des flottes entières. Des systèmes de défense ponctuelle et des silos de missiles antimissiles empêchent la plupart des projectiles d’atteindre leur cible. Des installations de soutien spécialisées permettent de renforcer les boucliers des plateformes orbitales."
 district_maginot_world_shield_generators_plural:0 "Réseaux de Générateurs de Boucliers"
 job_maginot_planetary_shield_effect_desc:0 "\nFournit 1 armée de §YBatterie de Boucliers§! capable d'absorber d'énormes quantités de tirs ennemis."
 district_maginot_world_planetary_cannons:0 "Réseau de Défense Orbitale"
 district_maginot_world_planetary_cannons_desc:0 "Les immenses canons planétaires sont tout à fait capables de pulvériser tout vaisseau en orbite basse, obligeant ainsi les capitaines ennemis à se tenir hors de leur portée de tir. De ce fait, ces canons sont principalement utilisés pour intercepter les projectiles ennemis et les vaisseaux de débarquement. D'immenses complexes de commandement et de contrôle interagissent avec les systèmes stratégiques de défense orbitale, permettant le déploiement d’un plus grand nombre de plateformes ainsi que le renforcement des structures existantes."
 district_maginot_world_planetary_cannons_plural:0 "Réseaux de Défense Orbitale"
 job_maginot_planetary_artillery_effect_desc:0 "\nFournit 1 armée d'§YArtillerie Planétaire§! infligeant des dégâts extrêmes mais relativement fragile."
 district_maginot_world_bunkers:0 "Complexe de Bunkers"
 district_maginot_world_bunkers_desc:0 "Des bunkers et des armes lourdes antichars à perte de vue. Le sol est traversé de tranchées interminables, de pièges à chars et de barrières massives qui empêchent tout mouvement en ligne droite sur ce monde. Des emplacements de tir camouflés sont prêts à déchaîner l'enfer sur les forces ennemies, leurs champs de tir se chevauchant pour couvrir chaque mètre carré de la planète. D'immenses infrastructures d'entraînement garantissent que nos troupes sont prêtes à toute éventualité, avec des exercices menés en permanence sur tous types de terrains."
 district_maginot_world_bunkers_plural:0 "Complexes de Bunkers"
 job_maginot_planetary_bunker_effect_desc:0 "\nFournit 1 armée de §YRéseau de Fortifications§! qui sape le moral des troupes ennemies tout en infligeant des dégâts constants."
 district_maginot_ringworld_barracks:0 "Segment de Casernes"
 district_maginot_ringworld_barracks_desc:0 "D'immenses installations de soutien permettant d’héberger les troupes à l'intérieur et à la surface de cet anneau-monde, incluant diverses zones de loisirs et de détente."
 district_maginot_ringworld_barracks_plural:0 "Segments de Casernes"
 district_maginot_ringworld_shield_generators:0 "Segment de Générateurs de Boucliers"
 district_maginot_ringworld_shield_generators_desc:0 "Des émetteurs d’une ampleur inégalée pour tout vaisseau génèrent des champs de force capables de rivaliser avec des flottes entières. Des systèmes de défense ponctuelle et des silos de missiles antimissiles empêchent la plupart des projectiles d’atteindre leur cible. Des installations de soutien spécialisées permettent de renforcer les boucliers des plateformes orbitales proches."
 district_maginot_ringworld_shield_generators_plural:0 "Segments de Générateurs de Boucliers"
 district_maginot_ringworld_planetary_cannons:0 "Segment de Défense Orbitale"
 district_maginot_ringworld_planetary_cannons_desc:0 "Doter notre anneau-monde de puissantes batteries d’armes lui permet de pulvériser tout vaisseau en orbite basse - obligeant ainsi les capitaines ennemis à se tenir hors de sa portée de tir. Ces canons sont principalement utilisés pour intercepter les projectiles ennemis et les vaisseaux de débarquement. De vastes complexes de commandement et de contrôle interagissent avec les systèmes stratégiques de défense orbitale, permettant le déploiement d’un plus grand nombre de plateformes ainsi que le renforcement des structures existantes."
 district_maginot_ringworld_planetary_cannons_plural:0 "Segments de Défense Orbitale"
 district_maginot_ringworld_bunkers:0 "Segment de Bunkers"
 district_maginot_ringworld_bunkers_desc:0 "Des bunkers et des armes lourdes antichars à perte de vue, s'étendant même aux surfaces incurvées au-dessus. Cette section de l’anneau-monde ne possède pas de surface conventionnelle, créant un paysage chaotique avec de nombreuses falaises abruptes semblant plonger directement dans l’espace. Des emplacements de tir camouflés sont prêts à déchaîner l’enfer sur les forces ennemies, leurs champs de tir se chevauchant pour couvrir chaque mètre cube d’espace. D'immenses infrastructures d'entraînement garantissent que nos troupes sont prêtes à toute éventualité, y compris les combats en microgravité et les opérations d'abordage."
 district_maginot_ringworld_bunkers_plural:0 "Segments de Bunkers"
 maginot_destruction.2000.name:0 "$name_maginot_world$ Capturé"
 maginot_destruction.2000.desc:0 "Nos forces rapportent la capture réussie du $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Les combats se sont étendus profondément dans la croûte de la planète à travers un vaste labyrinthe de bunkers et de défenses, mais en fin de compte, nos forces ont prouvé leur supériorité. Le système de sécurité insidieux Dead Hand a été empêché de tirer, bien que les commandants ennemis qui l'opéraient aient combattu jusqu'au dernier souffle. La destruction planétaire a été évitée avec succès, et nous pouvons désormais prendre le contrôle total de toutes les fonctions du $name_maginot_world$. §YNotez que le système de perturbation subspatial devra être réactivé manuellement.§!"
 maginot_destruction.2000.a:0 "Excellent."
 maginot_destruction.2010.name:0 "$name_maginot_world$ Capturé"
 maginot_destruction.2010.desc:0 "Nous avons perdu le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Malgré le vaste labyrinthe de bunkers et de défenses s'étendant profondément dans la croûte de la planète, les forces ennemies ont tout de même pénétré nos périmètres et capturé nos centres de commandement. Ils ont réussi à désactiver le système de sécurité Dead Hand, empêchant ainsi la destruction planétaire. L'ennemi contrôle désormais une structure défensive puissante et un point clé de nos lignes de défense.\nSi notre état-major actuel n'était pas déjà mort, il subirait une rétribution infernale pour cet échec."
 maginot_destruction.2010.a:0 "En effet."
 maginot_destruction.2001.name:0 "Activation Réussie du Dead Hand dans [From.GetStarName] !"
 maginot_destruction.2001.desc:0 "Le pire s'est produit. Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été perdu avec tous ses occupants.\n\nAprès que notre ennemi ait déployé une arme assez puissante pour détruire ce monde, le système de confinement d'antimatière Dead Hand a échoué comme prévu, libérant instantanément une quantité colossale d'énergie. Grâce à un positionnement stratégique et un immense travail de géo-ingénierie, l'explosion a été redirigée intentionnellement, transformant un morceau de la croûte de la taille d’un continent en une charge explosive concentrée d'une puissance inouïe.\n\nNous pouvons au moins nous consoler en sachant que le sacrifice de [From.GetName] n'a pas été vain : tout vaisseau en orbite a dû être instantanément réduit en cendres. Seul un vaisseau bien plus grand que la planète elle-même aurait pu survivre à notre colère.\n\n§YNote : Le système de perturbation subspatial a été désactivé de manière violente, forçant l'arrêt de tout dispositif similaire dans les systèmes voisins. Toute autre instance de $name_maginot_world_plural$ devra être réactivée manuellement.§!"
 maginot_destruction.2001.a:0 "Cela leur apprendra à détruire nos mondes."
 maginot_destruction.2002.name:0 "Désastre dans [From.GetStarName] !"
 maginot_destruction.2002.desc:0 "§RUn désastre a frappé notre flotte chargée d’anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLe déploiement des armes se déroulait comme prévu, jusqu’à ce que le monde se fissure soudainement et qu’un morceau de masse de la taille d’un continent soit projeté à une vitesse proche de la relativité, créant une lance de plasma surchauffé d’une ampleur inimaginable. Tous les vaisseaux en orbite ont vu leurs boucliers instantanément surchargés par l’énorme explosion de radiation à spectre complet et l’assaut implacable de l’énergie cinétique, subissant ainsi des dommages structurels massifs et potentiellement fatals. Les plus petits vaisseaux ont été instantanément détruits, avec la perte totale de leurs équipages.\n\nIl semble que l’ennemi ait stocké des quantités absurdes d’antimatière en tant que mesure de sécurité en cas de tentative de destruction de leur monde. Nous nous attendons à trouver des dispositifs similaires dans tout autre $name_maginot_world_plural$ que nous pourrions rencontrer. Si nous ne déployons pas des équipes terrestres pour désactiver ces machines avec précaution, nous devons nous attendre à perdre d’autres vaisseaux, alors que la planète elle-même est transformée en arme ultime."
 maginot_destruction.2002.a:0 "Une honte."
 maginot_destruction.2003.name:0 "Échec colossal dans [From.GetStarName] !"
 maginot_destruction.2003.desc:0 "§RUn désastre a frappé notre colosse chargé d’anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLa planète a apparemment été détruite comme ordonné, mais au moment où les dernières fortifications devaient céder, un morceau de masse de la taille d’un continent a été projeté à une vitesse proche de la relativité, formant une lance de plasma surchauffé d’une ampleur inimaginable. Notre colosse et ses systèmes ont été instantanément surchargés par l’énorme explosion de radiation à spectre complet et l’assaut implacable de l’énergie cinétique, subissant des dommages structurels massifs. Nous tentons encore d’établir s’il a même survécu. Comme si cela ne suffisait pas, tous les vaisseaux restants en orbite ont été affectés de la même manière, anéantissant instantanément les plus petits d’entre eux.\n\nIl semble que l’ennemi ait stocké des quantités absurdes d’antimatière en tant que mesure de sécurité en cas de tentative de destruction de leur monde. Nous nous attendons à trouver des dispositifs similaires dans tout autre $name_maginot_world_plural$ que nous pourrions rencontrer. Si nous ne déployons pas des équipes terrestres pour désactiver ces machines avec précaution, nous devons nous attendre à subir d’autres pertes, alors que la planète elle-même est transformée en arme ultime."
 maginot_destruction.2003.a:0 "Ça nous a coûté une fortune !"
 maginot_destruction.2004.name:0 "$name_maginot_world$ embarqué à [From.GetStarName]"
 maginot_destruction.2004.desc:0 "Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été embarqué dans l’Aiguille de l’Horizon.\n\nLe système de confinement antimatière Dead Hand a été autorisé à échouer comme prévu après l’embarquement des derniers officiers, car nous ne souhaitons certainement pas laisser de tels systèmes défensifs aussi puissants sans surveillance et accessibles à d’autres nations.\nL’explosion de plasma façonnée à l’échelle d’un continent a été dirigée vers l’espace vide, évitant ainsi une perte très coûteuse de nos colonies déjà embarquées et des systèmes de l’Aiguille de l’Horizon. Bien que l’Aiguille elle-même soit bien protégée contre les effets secondaires et le recul spatial, les autres plateformes et systèmes orbitaux appartenant au $name_maginot_world$ ne le sont pas, et tout ce qui se trouvait en orbite a été réduit en poussière spatiale. Nous espérons sincèrement qu’aucun vaisseau militaire ou civil n’a été laissé en orbite.\n\nEn route vers notre prochaine colonie !"
 maginot_destruction.2004.a:0 "Tout s'est déroulé comme prévu."
 maginot_orbital_defence.1004.name:0 "Le Commandement Stratégique Maginot a été détruit !"
 maginot_orbital_defence.1004.desc:0 "Les stations de commandement orbitales protégeant le $name_maginot_world$ §Y[maginot_world_location.GetName]§! ont été détruites après un combat intense contre le §Y[maginot_orbital_defence_destroyer.GetName]§!.\n\nNos défenses orbitales ont été réduites à de simples débris, mais la station de commandement centrale pourra être reconstruite avec le temps. Le Monde Maginot lui-même reste intact et continuera de résister à toute invasion terrestre. Si des améliorations avaient été appliquées, leur intégrité sera préservée lors de la réparation de nos défenses. Toutefois, les plateformes SD secondaires ne seront pas restaurées et devront être reconstruites de zéro."
 maginot_orbital_defence.1004.a:0 "Maudit soit-il !"
 maginot_orbital_defence.1006.name:0 "Le Commandement Stratégique Maginot a été réparé !"
 maginot_orbital_defence.1006.desc:0 "Nous avons réussi à réparer notre station de commandement orbitale autour du $name_maginot_world$ §Y[maginot_world_location.GetName]§!. La structure a été remise en état de fonctionnement et est désormais prête à défendre notre territoire.\n\nToutes les améliorations appliquées auparavant à la structure ont été conservées, mais les plateformes SD secondaires ne l'ont pas été."
 maginot_orbital_defence.1006.a:0 "Excellent !"
 job_maginot_central_command:0 "État-Major Central Maginot"
 job_maginot_central_command_plural:0 "États-Majors Centraux Maginot"
 job_maginot_central_command_desc:0 "L’état-major général supervisant le $name_maginot_world$, composé des meilleurs officiers de l’empire. Ils commandent l’immense réseau de défenses planétaires depuis les complexes de commandement souterrains les plus profonds, prêts à donner leur vie pour notre nation."
