 job_maginot_shield_generator_operator:0 "Opérateur de Générateur de Bouclier"
 job_maginot_shield_generator_operator_plural:0 "Opérateurs de Générateur de Bouclier"
 job_maginot_shield_generator_operator_desc:0 "Formés pour exploiter des générateurs de bouclier de la taille d’un pâté de maisons, ces opérateurs garantissent que le $name_maginot_world$ reste parfaitement protégé contre toute menace de bombardement ennemi."
