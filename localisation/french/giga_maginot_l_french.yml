 job_maginot_planetary_cannon_operator_gestalt_desc:0 "Une armée de drones ingénieurs maintient les canons planétaires et les relais orbitaux. Des drones de combat sont stationnés aussi bien sur les armes terrestres que sur les plateformes SD orbitales afin d’engager tout ennemi assez imprudent pour partager un système avec un $name_maginot_world$."
