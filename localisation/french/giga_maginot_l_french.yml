 maginot_world_0:0 "$gc_mega$$name_maginot_world$ - Site de Construction"
 maginot_world_0_DESC:0 "Site de construction d’un futur $name_maginot_world$ destiné à être intégré à la planète en contrebas. Cette forteresse massive s'étendra un jour profondément dans le manteau planétaire et bien au-delà de l’atmosphère, présentant un obstacle quasi insurmontable pour les ennemis. Tous les districts de la planète seront remplacés par des districts défensifs uniques et la gestion des plateformes défensives planétaires deviendra accessible. Les $orbital_ring_tier_1_plural$ seront intégrés puis supprimés."
 maginot_world_0_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ $giga_list_category_megastructure$ - $giga_list_category_defensive$ \nFournit une grande quantité de §YArmées Défensives§!, des §YInhibiteurs FTL§! et bloque les §YPropulseurs à Saut§! - §BREQUIERT UNE PLANÈTE AVEC UN COMPLEXE FORTIFIÉ MAGINOT§!\n§LUne forteresse colossale englobant une planète entière, offrant la défense ultime contre toute invasion.§!"
 maginot_world_1:0 "$name_maginot_world$ - Échafaudage"
 maginot_world_1_DESC:0 "Les premières étapes de la géoformation, de l'excavation et de la construction des ascenseurs spatiaux, accompagnées des prémices de l’anneau défensif. Les bunkers les plus profonds ont été creusés, et l’installation du système Dead Hand peut commencer."
 maginot_world_2:0 "$name_maginot_world$"
 maginot_world_2_DESC:0 "Une immense forteresse planétaire conçue pour être totalement imprenable par toute force ennemie."
 maginot_world_ringworld_0:0 "$name_maginot_ringworld$ - Site de Construction"
 maginot_world_ringworld_0_DESC:0 "Site de construction d’un futur $name_maginot_ringworld$ intégré à la section de l'anneau-monde en contrebas. Cette forteresse massive transformera un jour la superstructure de l’anneau, créant un obstacle pratiquement infranchissable pour les ennemis. Tous les districts de l'anneau seront remplacés par des districts défensifs uniques, et la gestion des plateformes défensives planétaires deviendra disponible."
 maginot_world_ringworld_0_MEGASTRUCTURE_DETAILS:0 "Ceci ne devrait pas être visible."
 maginot_world_ringworld_1:0 "$name_maginot_ringworld$ - Superstructure"
 maginot_world_ringworld_1_DESC:0 "Transformation initiale de l'anneau-monde, incluant des modifications majeures de la superstructure globale. Les bunkers les plus profonds ont été installés, et l'installation du système Dead Hand peut commencer."
 maginot_world_ringworld_2:0 "$name_maginot_ringworld$"
 maginot_world_ringworld_2_DESC:0 "Une immense forteresse s'étendant sur tout l'anneau, conçue pour être totalement imprenable par toute force ennemie."
 requires_maginotable_planet_type:0 "$TRIGGER_FAIL$Les Mondes Maginot ne peuvent être construits que sur des planètes normales, des habitats de géantes gazeuses ou des segments d'anneau-monde."
 requires_not_maginot_world:0 "$TRIGGER_FAIL$Impossible de construire un Monde Maginot sur un Monde Maginot. Évidemment."
 requires_maginot_stronghold_built:0 "$TRIGGER_FAIL$Nous devons d'abord préparer l'espace de construction des bunkers planétaires en construisant un $building_giga_maginot_stronghold$."
 giga_dialog.5001.name:0 "Site de Construction de $name_maginot_world$ Terminé"
 giga_dialog.5001.desc:0 "Le site de construction d’un futur $name_maginot_world$ est désormais achevé dans le système [giga_system.GetName]. Bientôt, la planète deviendra un immense complexe fortifié, nous garantissant la défense ultime. \n\n§STous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion de la défense planétaire sera activée. Les $orbital_ring_tier_1_plural$ seront intégrés et supprimés.§! \n\n§RAVERTISSEMENT : Le $name_maginot_world$ dispose d'un système de sécurité qui fait exploser la planète et annihile tous les vaisseaux en orbite en cas de destruction de la colonie !"
 giga_dialog.5001.a:0 "Excellent."
 giga_dialog.5002.name:0 "Infrastructure de $name_maginot_world$ Achevée"
 giga_dialog.5002.desc:0 "Nous nous rapprochons encore de l'achèvement d’un $name_maginot_world$ dans le système [giga_system.GetName]. La géoformation et la construction spatiale avancent bien, et nous avons creusé les espaces nécessaires aux bunkers et aux centres de commandement les plus profonds. Nous sommes maintenant prêts à installer le système de sécurité à base d’antimatière et à finaliser les défenses planétaires initiales."
 giga_dialog.5002.a:0 "Excellent."
 giga_dialog.5003.name:0 "$name_maginot_world$ Achevé !"
 giga_dialog.5003.desc:0 "Excellentes nouvelles ! Dans le système [giga_system.GetName], nous avons achevé notre forteresse ultime, s'étendant depuis l’espace jusqu’au manteau planétaire. Cette construction véritablement impressionnante est pratiquement imprenable, intégrant des défenses orbitales, des canons planétaires, des bunkers en surface, d’immenses complexes souterrains et des générateurs de boucliers surpassant les capacités énergétiques de flottes navales entières. \nDe plus, le système Dead Hand final protège contre toute destruction planétaire totale, en transformant la planète entière en une gigantesque charge façonnée alimentée en antimatière en cas d’activation du système de sécurité - §Ranéantissant totalement toutes les forces hostiles en orbite.§! \n\nLes divers systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! et attribuez du personnel aux §Yemplois§! pour obtenir des §E$defensive_upgrade_point_plural$§! et des §E$offensive_upgrade_point_plural$§! à utiliser dans ces décisions."
 giga_dialog.5003.a:0 "Enfin, nous sommes en sécurité."
 giga_dialog.5004.name:0 "Site de Construction de $name_maginot_ringworld$ Terminé"
 giga_dialog.5004.desc:0 "Le site de construction d’un futur $name_maginot_ringworld$ est désormais achevé dans le système [giga_system.GetName]. Bientôt, cette section de l’anneau deviendra un immense complexe fortifié, nous garantissant la défense ultime. \n\n§STous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion des plateformes de défense proches de l’espace sera activée.§! \n\n§RAVERTISSEMENT : Le $name_maginot_ringworld$ dispose d'un système de sécurité qui fait exploser l’anneau et annihile tous les vaisseaux en orbite en cas de destruction de la colonie !"
 giga_dialog.5004.a:0 "Excellent."
 giga_dialog.5005.name:0 "Extérieur du $name_maginot_ringworld$ Achevé"
 giga_dialog.5005.desc:0 "Nous nous rapprochons encore de l'achèvement d’un $name_maginot_ringworld$ dans le système [giga_system.GetName]. La construction spatiale et le remodelage de la surface avancent bien, et nous avons sélectionné les emplacements pour les bunkers les plus profonds et les centres de commandement. Nous sommes maintenant prêts à installer le système de sécurité à base d’antimatière et à finaliser les défenses initiales de l’anneau."
 giga_dialog.5005.a:0 "Excellent."
 giga_dialog.5006.name:0 "$name_maginot_ringworld$ Achevé !"
 giga_dialog.5006.desc:0 "Excellentes nouvelles ! Dans le système [giga_system.GetName], nous avons achevé notre forteresse ultime, qui encercle partiellement une étoile entière. Cette construction véritablement impressionnante est pratiquement imprenable, intégrant des défenses proches de l’espace, des batteries superstructurelles, d’immenses segments de bunkers, des complexes de commandement profondément enfouis et des générateurs de boucliers surpassant les capacités énergétiques de flottes navales entières. \nDe plus, le système Dead Hand final protège contre toute destruction de segment, en utilisant l’ensemble de la superstructure comme une gigantesque charge façonnée alimentée en antimatière en cas d’activation du système de sécurité - §Ranéantissant totalement toutes les forces hostiles en orbite.§! \n\nLes divers systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! et attribuez du personnel aux §Yemplois§! pour obtenir des §E$defensive_upgrade_point_plural$§! et des §E$offensive_upgrade_point_plural$§! à utiliser dans ces décisions."
 giga_dialog.5006.a:0 "Enfin, nous sommes en sécurité."
