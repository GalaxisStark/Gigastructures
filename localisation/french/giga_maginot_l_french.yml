 GIGA_MAGINOT_REACTOR:0 "Système Énergétique Maginot"
 GIGA_MAGINOT_REACTOR_DESC:0 "De multiples connexions redondantes avec le $name_maginot_world$ hôte et ses infrastructures enfouies fournissent l'énergie nécessaire à toutes les opérations orbitales."
 GIGA_MAGINOT_PLANET_REACTOR:0 "Système Énergétique Maginot Amélioré"
 GIGA_MAGINOT_PLANET_REACTOR_DESC:0 "Les avancées en technologie planétaire ont permis plusieurs améliorations des infrastructures énergétiques basées au sol."
 GIGA_MAGINOT_STAR_REACTOR:0 "Réseau de Prélèvement Coronaire"
 GIGA_MAGINOT_STAR_REACTOR_DESC:0 "L'ingénierie dimensionnelle avancée et la maîtrise du contrôle stellaire permettent d'exploiter l'énergie des étoiles pour alimenter tous les systèmes Maginot."
 GIGA_MAGINOT_OMEGA_LANCE:0 "Lance d'Annihilation Oméga"
 GIGA_MAGINOT_OMEGA_LANCE_DESC:0 "Une arme de la taille d'une lune, rien de moins ne suffira pour protéger notre $name_maginot_world$. Alimentée par un immense réacteur installé au cœur de la planète et régulée par un réseau de systèmes sous la croûte, cette lance énergétique peut et détruira tout sur son passage."
 GIGA_MAGINOT_KINETIC_BATTERY:0 "Batteries Planétaires Lourdes"
 GIGA_MAGINOT_KINETIC_BATTERY_DESC:0 "D'immenses batteries cinétiques construites à la surface du $name_maginot_world$, capables de causer une dévastation massive lorsqu'elles sont interconnectées avec les systèmes orbitaux."
 GIGA_MAGINOT_DEFENCE_DRONE_SWARM:0 "Essaim de Drones de Défense Orbitale"
 GIGA_MAGINOT_DEFENCE_DRONE_SWARM_DESC:0 "Un essaim de drones reliés à leur $name_maginot_world$ hôte, n'ayant pas besoin d'équipage, de générateurs de boucliers embarqués ou de noyaux de commandement indépendants, leur permettant ainsi d'opérer plus efficacement en combat que les chasseurs autonomes de taille similaire."
 giga_tech_maginot_world:0 "Théorie Défensive du Bastion Ultime"
 giga_tech_maginot_world_desc:0 "Pour défendre notre empire, nous devons construire le bastion défensif ultime et transformer une planète entière en un immense complexe fortifié : le $name_maginot_world$. \n\nCe monde sera équipé de défenses orbitales, de canons planétaires, d'innombrables bunkers, de complexes de commandement souterrains profonds et de générateurs de boucliers couvrant des continents entiers. De plus, un système de riposte automatique sera développé pour dissuader les vaisseaux de guerre de classe Colossus ennemis.\n\n§YLe bâtiment planétaire est nécessaire pour commencer la construction du $name_maginot_world$§!, mais il peut également être construit sur d'autres sites ne permettant pas un développement complet."
 maginot_desc:0 "Une forteresse planétaire tentaculaire conçue pour être totalement imprenable par toute force ennemie."
 allow_maginot:0 "§HDébloque la Mégastructure :§! $name_maginot_world$"
 giga_tech_maginot_firepower_1:0 "Puissance de Feu Maginot Améliorée"
 giga_tech_maginot_firepower_1_desc:0 "Avec les développements pratiques terminés, nous pouvons maintenant nous concentrer sur de nouvelles optimisations pour les systèmes du $name_maginot_world$. En particulier, une puissance de feu toujours plus grande."
 allow_giga_maginot_firepower_1:0 "Dégâts des Armes Maginot : §G+25%§! \nCadence de Tir des Armes Maginot : §G+10%§! \nPortée des Armes Maginot : §G+20%§!"
 maginot_display_firepower_1:0 "\n§B$giga_tech_maginot_firepower_1$ Technologie§! : \n§G+25%§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+10%§! $MOD_SHIP_FIRE_RATE_MULT$ \n§G+20%§! $MOD_SHIP_WEAPON_RANGE_MULT$"
 giga_tech_maginot_planetcraft_upgrade:0 "Techniques de Renforcement Maginot Modernisées"
 giga_tech_maginot_planetcraft_upgrade_desc:0 "La nouvelle génération de vaisseaux de guerre célestes a révélé plusieurs améliorations potentielles pour le renforcement des structures Maginot, nous permettant d’augmenter leur durabilité face aux menaces croissantes. De plus, certaines améliorations d’armes et de réacteurs peuvent être appliquées rétroactivement."
 allow_giga_maginot_planetcraft_upgrade:0 "§HDébloque la Section de Plateforme :§! Plateforme de Défense Stratégique Maginot Améliorée \nDégâts des Armes Maginot : §G+50%§! \nCoque Maginot : §G+500 000§! \nBlindage Maginot : §G+200 000§! \nBoucliers Maginot : §G+200 000§!"
 maginot_display_planetcraft_upgrade:0 "§B$giga_tech_maginot_planetcraft_upgrade$ Technologie§! : \n§G+50%§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+500 000§! $MOD_SHIP_HULL_ADD$ \n§G+200 000§! $MOD_SHIP_ARMOR_ADD$ \n§G+200 000§! $MOD_SHIP_SHIELD_ADD$"
 giga_tech_maginot_systemcraft_upgrade:0 "Rétrofit Stellaire"
 giga_tech_maginot_systemcraft_upgrade_desc:0 "Alors que nous commandons désormais le mouvement des étoiles, nous ne devons pas négliger nos défenses. Nos dernières innovations permettent plusieurs améliorations fondamentales des mesures de protection Maginot."
 allow_giga_maginot_systemcraft_upgrade:0 "§HDéverrouille la Section de Plateforme :§! Plateforme Stratégique de Défense Maginot de Niveau Systémique \nDégâts des armes Maginot : §G+250%§! \nCadence de tir des armes Maginot : §G+100%§! \nPrécision Maginot : §G+20§! \nSuivi Maginot : §G+10§! \nCoque Maginot : §G+5 000 000§! \nBlindage Maginot : §G+2 000 000§! \nBoucliers Maginot : §G+2 000 000§!"
 maginot_display_systemcraft_upgrade:0 "§BTechnologie $giga_tech_maginot_systemcraft_upgrade$§! : \n§G+250%§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+100%§! $MOD_SHIP_FIRE_RATE_MULT$ \n§G+20§! $MOD_SHIP_ACCURACY_ADD$ \n§G+10§! $MOD_SHIP_TRACKING_ADD$ \n§G+5 000 000§! $MOD_SHIP_HULL_ADD$ \n§G+2 000 000§! $MOD_SHIP_ARMOR_ADD$ \n§G+2 000 000§! $MOD_SHIP_SHIELD_ADD$"