 succ_0:0 "$gc_kilo$$name_succ$ Site de Construction"
 succ_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£ $giga_list_category_kilostructure$ - $giga_list_category_strategic_resource_production$\n Révèle et amplifie les gisements de £exotic_gases£ §YGaz Exotiques§! et £energy£ §YÉnergie§! sur les §YGéantes Gazeuses§!.\n§LLe S.U.C.C. rase méthodiquement l'atmosphère d'un monde gazeux, extrayant les gaz les plus précieux tout en utilisant le reste pour alimenter d'immenses réseaux de fusion.§!"
 succ_0_DESC:0 "Le site de construction d'un futur $name_succ_full$. Il abrite le personnel et l'infrastructure nécessaires pour construire un $name_succ$ autour d'un monde gazeux voisin."
 succ_0_CONSTRUCTION_INFO_DELAYED:0 "$sr_mega_extra_data$"
 succ_1:0 "$name_succ$"
 succ_1_DESC:0 "Un $name_succ_full$ achevé et opérationnel, récoltant en continu d'énormes quantités de gaz à partir d'une Géante Gazeuse. Les réacteurs à fusion utilisent l'hydrogène collecté pour générer d'immenses quantités d'énergie."
 sr_mega_extra_data:0 "Révèlera et amplifie les gisements de ressources stratégiques, et amplifie (mais ne crée pas) les gisements de ressources classiques."
 automated_stripmine_0:0 "$gc_kilo$$name_auto_stripmine$ Site de Construction"
 automated_stripmine_0_DESC:0 "Le site de construction d'un futur $name_auto_stripmine$. Il contient tout le nécessaire pour construire l'appareil d'extraction orbitale ainsi que les usines à la surface de la planète."
 automated_stripmine_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_strategic_resource_production$\nRévèle et amplifie les gisements de £volatile_motes£ §YMottes Volatiles§! et de £minerals£ ou £alloys£ sur les §YMondes en Fusion§!.\n§LGrâce à une danse délicate entre d'immenses foreuses et des faisceaux de traction, la Mine Automatisée dépouille la croûte d'une planète en fusion, récoltant les précieuses mottes volatiles du manteau en fusion.§!"
 automated_stripmine_0_CONSTRUCTION_INFO_DELAYED:0 "$sr_mega_extra_data$"
 automated_stripmine_1:0 "$name_auto_stripmine$"
 automated_stripmine_1_DESC:0 "Une grande structure orbitale récoltant directement les mottes volatiles à partir du manteau en fusion d'un monde volcanique."
 kugelblitz_0:0 "$gc_kilo$Kugelblitz Vide $name_kugelblitz$"
 kugelblitz_0_DESC:0 "Une immense structure capable de créer un Kugelblitz artificiel pour générer et stocker de l'énergie grâce au rayonnement de Hawking accéléré, ainsi que de la matière. Elle peut également extraire l'énergie stockée pour l'utiliser."
 kugelblitz_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_storage$\nStocke d'incroyables quantités de chaque ressource.\n§LUn dispositif de stockage basé sur un Kugelblitz incroyablement avancé, capable de stocker l'énergie et la matière sous forme de rayonnement."
 kugelblitz_1:0 "$name_kugelblitz$"
 kugelblitz_1_DESC:0 "Cette structure abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'injecter et d'extraire de l'énergie. Le Kugelblitz nécessite une petite quantité d'énergie pour maintenir la singularité stable et assurer un stockage sécurisé."
 kugelblitz_2:0 "$name_kugelblitz$ amélioré "
 kugelblitz_2_DESC:0 "Cette structure abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'injecter et d'extraire de l'énergie. Les avancées en technologie à grande échelle ont permis de stabiliser un Kugelblitz beaucoup plus grand, augmentant ainsi la capacité de stockage."
 kugelblitz_3:0 "Grand $name_kugelblitz$"
 kugelblitz_3_DESC:0 "Cette structure abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'injecter et d'extraire de l'énergie. Grâce à l'ingénierie tétra-dimensionnelle, nous pouvons encore augmenter la capacité de stockage viable d'un seul Kugelblitz généré."
 kugelblitz_ruined:0 "Ruines de $name_kugelblitz$"
 kugelblitz_ruined_DESC:0 "Un $name_kugelblitz$ en ruines. Construit pour abriter une singularité artificielle contrôlée, cette structure a subi d'immenses dégâts et n'est plus opérationnelle. Bien que difficile, sa réparation pourrait être envisageable."
 kugelblitz_ruined_MEGASTRUCTURE_DETAILS:0 "$kugelblitz_ruined_DESC$"
 kugelblitz_restored:0 "$name_kugelblitz$"
 kugelblitz_restored_DESC:0 "$kugelblitz_2_DESC$"
 giga_tech_orbital_artificial_eco:0 "Écosystèmes Orbitaux"
 giga_tech_orbital_artificial_eco_desc:0 "Créer un écosystème complexe entièrement fonctionnel en orbite d'une planète est un défi majeur, mais une telle technologie permet la construction de vastes écosystèmes pour la recherche."
 orbital_artificial_eco_0:0 "$gc_kilo$$name_orbital_artificial_eco$: Support de Vie"
 orbital_artificial_eco_0_DESC:0 "Ce site servira de base pour construire un $name_orbital_artificial_eco$, une immense structure abritant un écosystème artificiel où nous pourrons expérimenter librement."
 orbital_artificial_eco_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des dépôts de £society_research£ §YRecherche en Société§! sur les planètes du système.\n§LUne station construite en orbite d'un monde toxique pour abriter et étudier une vaste variété d'espèces exotiques de flore et de faune.§!"
 orbital_artificial_eco_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $orbital_eco_arcology_1_mod_tooltip$"
 orbital_artificial_eco_1:0 "$name_orbital_artificial_eco$: Banque Génétique"
 orbital_artificial_eco_1_DESC:0 "Une série d'installations externes permettant de stocker l'information génétique de toutes les espèces hébergées dans le $name_orbital_artificial_eco$, afin qu'elles puissent être restaurées en cas d'extinction."
 orbital_artificial_eco_2:0 "$name_orbital_artificial_eco$: Enclos Exotiques"
 orbital_artificial_eco_2_DESC:0 "Les enclos exotiques abritent une variété d'environnements simulés ainsi que des infrastructures permettant d'assurer des populations viables de flore et de faune."
 orbital_artificial_eco_3:0 "$name_orbital_artificial_eco$: Expérimentation Planétaire"
 orbital_artificial_eco_3_DESC:0 "Un $name_orbital_artificial_eco$ complet, rempli d'espèces importées ainsi que d'organismes artificiels créés grâce à l'ingénierie génétique. Cet écosystème unique peut être modifié à volonté par nos scientifiques pour étudier les mécanismes de la nature."
 orbital_artificial_eco_ruined:0 "Ruines de $name_orbital_artificial_eco$"
 orbital_artificial_eco_ruined_DESC:0 "Un $name_orbital_artificial_eco$ en ruines. Il abritait autrefois un grand nombre d'espèces bio-ingénierées dans des environnements contrôlés, mais ce n'est plus le cas. Sa restauration pourrait être possible avec les bonnes technologies."
 orbital_artificial_eco_ruined_MEGASTRUCTURE_DETAILS:0 "$orbital_artificial_eco_ruined_DESC$"
 orbital_artificial_eco_restored:0 "$name_orbital_artificial_eco$"
 orbital_artificial_eco_restored_DESC:0 "$orbital_artificial_eco_3_DESC$"
 giga_dialog.1003.name:0 "Ruines de $name_orbital_artificial_eco$"
 giga_dialog.1003.desc:0 "Un $name_orbital_artificial_eco$ en ruines a été repéré en orbite d'une Géante Gazeuse dans le système [from.GetName]. Il semble avoir subi d'importants dommages, mais son cadre externe est encore relativement intact. Nos scientifiques estiment qu'il pourrait être réparé si nous disposons des technologies adéquates."
 giga_dialog.1003.a:0 "Intéressant."
 giga_tech_engineering_test_site:0 "Installations de Tests Colossales"
 giga_tech_engineering_test_site_desc:0 "Construire une installation de test en orbite d'une planète peut s'avérer difficile et extrêmement dangereux. Cependant, les applications potentielles sont très prometteuses."
 macro_test_site_0:0 "$gc_kilo$$name_eng_test_site$: Stabilisateur Géologique"
 macro_test_site_0_DESC:0 "Un immense dispositif conçu pour empêcher les étendues gelées de la planète d'être complètement détruites par le stress constant des tests d'armes à grande échelle prévus."
 macro_test_site_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des dépôts de £engineering_research£ §YRecherche en Ingénierie§! sur les planètes du système.\n§LUne vaste station en orbite d'une planète glacée permettant de mener librement des expériences en ingénierie.§!"
 macro_test_site_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $orbital_test_site_1_mod_tooltip$"
 macro_test_site_1:0 "$name_eng_test_site$: Baies de Tests Matériels"
 macro_test_site_1_DESC:0 "Les baies de tests permettent le déplacement à grande échelle de matériaux et de vaisseaux inachevés vers les sites de tests sur la planète en contrebas ainsi que vers d'autres planètes du système."
 macro_test_site_2:0 "$name_eng_test_site$: Simulations Matérielles"
 macro_test_site_2_DESC:0 "Les simulations matérielles permettent d'améliorer l'efficacité des tests matériels plus pratiques, autorisant une impressionnante gamme de destructions simulées et de dévastation planétaire."
 macro_test_site_3:0 "$name_eng_test_site$: Champ de Tir Orbital"
 macro_test_site_3_DESC:0 "Les champs de tir permettent un bombardement quasi permanent de la planète en contrebas, ainsi qu'une livraison de munitions hostiles à longue portée vers d'autres planètes du système. Cependant, elles sont bien trop lentes pour être utilisées dans des scénarios de combat."
 macro_test_site_ruined:0 "Ruines de $name_eng_test_site$"
 macro_test_site_ruined_DESC:0 "Un $name_eng_test_site$ en ruines, construit il y a des éons par une race spatiale. Bien que l'intérieur soit complètement détruit, la coque externe est encore relativement intacte et pourrait être réparée."
 macro_test_site_ruined_MEGASTRUCTURE_DETAILS:0 "$macro_test_site_ruined_DESC$"
 macro_test_site_restored:0 "$name_eng_test_site$"
 macro_test_site_restored_DESC:0 "$macro_test_site_3_DESC$"
 macro_test_site_1_dismantle:0 "Démanteler la Mégastructure"
 macro_test_site_1_dismantle_DESC:0 "Cette mégastructure sera déconstruite et recyclée pour récupérer des matériaux."
 giga_tech_macro_scale_weather_manipulation:0 "Manipulation Météorologique Macro-Atmosphérique"
 giga_tech_macro_scale_weather_manipulation_desc:0 "La construction d'une installation dédiée à la création de tempêtes massives dans l'atmosphère des géantes gazeuses pourrait nous permettre d'étudier ces phénomènes bien mieux que n'importe quelle tempête naturelle. Les applications d'une telle recherche sont très prometteuses."
 atmosphere_shredder_0:0 "$gc_kilo$$name_atmosphere_shredder$: Œil de la Tempête"
 atmosphere_shredder_0_DESC:0 "Une immense installation de manipulation météorologique contenant tout le nécessaire pour déclencher une tempête expérimentale à l'échelle de l'atmosphère. Cette structure nous permettra de mener diverses expériences sur la géante gazeuse et de collecter des données précieuses à travers tout le système."
 atmosphere_shredder_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des dépôts de £physics_research£ §YRecherche en Physique§! sur les planètes du système.\n§LUne vaste station en orbite d'une géante gazeuse, provoquant une tempête permanente pour l'étude et l'expérimentation.§!"
 atmosphere_shredder_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $orbital_atmosphere_shredder_1_mod_tooltip$"
 atmosphere_shredder_1:0 "$name_atmosphere_shredder$: Bras Agitateurs"
 atmosphere_shredder_1_DESC:0 "Les immenses Bras Agitateurs permettent d'intensifier la tempête planétaire, augmentant encore son potentiel d'étude."
 atmosphere_shredder_2:0 "$name_atmosphere_shredder$: Bras Stabilisateurs"
 atmosphere_shredder_2_DESC:0 "Les bras stabilisateurs permettent la création de poches de calme relatif dans la tempête, facilitant ainsi la récupération sécurisée des drones et autres machines automatisées envoyées dans la tempête pour l'étudier."
 atmosphere_shredder_3:0 "$name_atmosphere_shredder$: Anneau de Laboratoires"
 atmosphere_shredder_3_DESC:0 "L'anneau de laboratoires abrite les capteurs les moins sensibles de la station. Il est conçu pour être immergé dans la puissance de la tempête, permettant ainsi de récupérer une quantité phénoménale de données."
 atmosphere_shredder_complete_name:0 "$name_atmosphere_shredder$"
 atmosphere_shredder_ruined:0 "Ruines de $name_atmosphere_shredder$"
 atmosphere_shredder_ruined_DESC:0 "Un $name_atmosphere_shredder$ en ruines, construit il y a des éons par une race spatiale. Bien que le mécanisme de contrôle des tempêtes et les composants internes soient détruits, la coque externe est encore relativement intacte et pourrait être réparée."
 atmosphere_shredder_ruined_MEGASTRUCTURE_DETAILS:0 "$atmosphere_shredder_ruined_DESC$"
 atmosphere_shredder_restored:0 "$name_atmosphere_shredder$"
 atmosphere_shredder_restored_DESC:0 "$atmosphere_shredder_3_DESC$"
