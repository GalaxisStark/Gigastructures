 ehof_presphere_ruined:0 "§BRuines§! $ehof_presphere_dyson$"
 ehof_presphere_ruined_DESC:0 "Cette mégastructure extraterrestre a été détruite pour vaincre définitivement le $ehof_the_compound_text$."
 ehof_presphere_ruined_MEGASTRUCTURE_DETAILS:0 "Capable d'exploiter une énergie inégalée, elle ne devrait pas rester en ruines pour toujours."
 ehof_presphere_dyson:0 "§BSphère de Préservation§!"
 ehof_presphere_dyson_DESC:0 "Restaurée après la défaite du $ehof_the_compound_text$, la $ehof_presphere_dyson$ est capable d'exploiter une énergie inégalée issue du trou blanc autour duquel elle est construite."
 ehof_presphere_dyson_MEGASTRUCTURE_DETAILS:0 "Capable d'exploiter une énergie inégalée grâce aux émissions inépuisables d'un trou blanc."
