 alderson_disk_0:0 "$gc_giga$$name_alderson$ Site de Construction"
 alderson_disk_0_DESC:0 "Cette plateforme de construction abrite l'infrastructure nécessaire pour commencer la construction d'un disque massif s'étendant à travers tout ce système solaire."
 alderson_disk_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_gigastructure$ - $giga_list_category_habitable_mega$\nUn disque de taille systémique composé de huit gigantesques §YSlices§! pouvant être spécialisés davantage\n$giga_list_removes_system_planets$\n§LUn disque de la taille d'un système solaire offrant d'énormes quantités d'espace habitable.§!"
 alderson_disk_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - Les §YSlices Alderson§! peuvent être transformés en §YGaïa§!/§YMachine§!/§YRuche§!, en §YComplexe Informatique Alderson§! ou en §YEcumenopolis§!."
 alderson_disk_1:0 "Structure $name_alderson$"
 alderson_disk_1_DESC:0 "L'immense structure du $name_alderson$ s'étend de l'étoile jusqu'aux confins de ce système. Elle servira de base à l'assemblage des segments."
 alderson_disk_2:0 "Cadre de Tranche Alderson"
 alderson_disk_2_DESC:0 "Un cadre colossal qui servira à la construction d'une Tranche Alderson complète."
 alderson_disk_2_MEGASTRUCTURE_DETAILS:0 "$alderson_disk_2_DESC$"
 alderson_disk_2_ecu:0 "Écumenopolis Alderson"
 alderson_disk_2_ecu_DESC:0 "Une tranche gigantesque d'un $name_alderson$, s'étendant jusqu'aux bords de ce système solaire. Fonctionne comme une immense ville et peut abriter d'énormes quantités d'industries et de population.\n\nInclut des quartiers générant £consumer_goods£ §YBiens de consommation§!, £alloys£ §YAlliages§! et £amenities£ §YCommodités§!."
 alderson_disk_2_hive:0 "Ruche Alderson"
 alderson_disk_2_hive_DESC:0 "Une tranche gigantesque d'un $name_alderson$, s'étendant jusqu'aux bords de ce système solaire. Fonctionne comme une immense ruche et peut accueillir d'énormes industries et drones.\n\nInclut des quartiers générant £minerals£ §YMinerais§! et £alloys£ §YAlliages§!."
 alderson_disk_2_machine:0 "Alderson Machine"
 alderson_disk_2_machine_DESC:0 "Une tranche gigantesque d'un $name_alderson$, s'étendant jusqu'aux bords de ce système solaire. Fonctionne comme une immense ville et peut accueillir d'énormes industries et population.\n\nInclut des quartiers générant £minerals£ §YMinerais§! et £alloys£ §YAlliages§!."
 alderson_disk_2_gaia:0 "Tranche Alderson Gaïa"
 alderson_disk_2_gaia_DESC:0 "Une tranche gigantesque d'un $name_alderson$, s'étendant jusqu'aux bords de ce système solaire. Capable d'abriter d'innombrables habitants.\n\nInclut des quartiers générant £energy£ §YÉnergie§!, £food£ §YNourriture§! et £minerals£ §YMinerais§!."
 alderson_disk_2_pc:0 "Complexe Informatique Alderson"
 alderson_disk_2_pc_DESC:0 "Une tranche gigantesque d'un $name_alderson$, s'étendant jusqu'aux bords de ce système solaire. Capable de fournir une puissance de calcul colossale.\n\nInclut des quartiers générant £physics£ £society£ £engineering£ §YRecherche§! et £unity£ §YUnité§!."
 alderson_disk_ruined_left:0 "Ruines de l'Hypersegment $name_alderson$"
 alderson_disk_ruined_left_DESC:0 "On ignore qui ou quoi a construit cette structure gargantuesque. Ce segment a été partiellement achevé et nécessite une réparation majeure."
