l_french:
 fusion_suppressor_0:0 "Site de construction du $gc_mega$$name_fusion_suppressor$"
 fusion_suppressor_0_DESC:0 "Le site de construction d'un futur $name_fusion_suppressor$, abritant tout le nécessaire pour entamer la construction de cet appareil extrêmement avancé."
 fusion_suppressor_0_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ $giga_list_category_megastructure$ - $giga_list_category_miscellaneous$\nPeut convertir des §Yétoiles§! ordinaires en §Yétoiles à neutrons§! et en §YTrous noirs§! - $giga_list_damages_system_planets$\n§LLe Suppresseur de Fusion manipule les processus de fusion au sein d'une étoile pour déclencher prématurément une supernova, transformant l'étoile en un corps céleste plus exotique.§!"
 fusion_suppressor_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - L'achèvement complet du $name_fusion_suppressor$ permet soit de démanteler la structure et de conserver un §YTrou noir§! utilisable, soit de laisser l'étoile entrer en §Hsupernova§!, §Rdétruisant tous les vaisseaux et structures dans le système, et ravageant chaque planète§!, laissant une §YEtoile à neutrons§! exploitable. Les corps restants sont ensemencés aléatoirement avec £sr_iodizium£ §Y$sr_iodizium$§!, £energy£ §Y$energy$§! et £physics_research£ §Y$physics_research$§!.\n\n§HRemarque :§! Le $name_fusion_suppressor$ doit être §Yentièrement terminé§! pour utiliser l'étoile à neutrons pour une autre mégastructure.\n\n£sr_iodizium£ §Y$sr_iodizium$§! peut être utilisé pour alimenter des bâtiments puissants qui améliorent la production planétaire de £physics_research£ £society_research£ £engineering_research£ §Yrecherche§! et £energy£ §Y$energy$§!.\n\n§YLes étoiles à neutrons§! créées par le §YSuppresseur de Fusion§! peuvent accueillir un §YHyperforge Nidavellir§!. Les §YTrous noirs§! peuvent être utilisés pour toute autre mégastructure nécessitant un trou noir."
 fusion_suppressor_1:0 "$name_fusion_suppressor$ Modulateurs de gravité"
 fusion_suppressor_1_DESC:0 "Ces énormes dispositifs sont capables de manipuler la gravité autour de l'étoile, permettant de compresser la matière stellaire en un volume plus petit."
 fusion_suppressor_2:0 "$name_fusion_suppressor$ Stabilisateurs stellaires"
 fusion_suppressor_2_DESC:0 "Le $name_fusion_suppressor$ est désormais capable de stabiliser l'étoile autour de laquelle il est construit, permettant ainsi aux modulateurs de gravité de compresser l'objet stellaire sans qu'il explose soudainement en raison de sa déstabilisation."
 fusion_suppressor_3:0 "$name_fusion_suppressor$ - Phase de compression I"
 fusion_suppressor_3_DESC:0 "Le $name_fusion_suppressor$ a commencé à compresser la matière de l'étoile, ouvrant ainsi des opportunités de recherche sur la nature des réactions nucléaires stellaires. Une compression supplémentaire fournira plus de découvertes scientifiques."
 fusion_suppressor_4:0 "$name_fusion_suppressor$ - Phase de compression II"
 fusion_suppressor_4_DESC:0 "L'étoile a été une fois de plus comprimée, et ses composants de base commencent à montrer des comportements étranges avec un grand potentiel scientifique. Des réactions de fusion plus exotiques commencent à apparaître, tandis que la structure même de l'étoile semble se dégrader."
 fusion_suppressor_5:0 "$name_fusion_suppressor$ - Phase d'Étoile à neutrons"
 fusion_suppressor_5_DESC:0 "Le $name_fusion_suppressor$ a réussi à compresser l'étoile à tel point que les protons et électrons ont fusionné pour devenir des neutrons au sein du noyau, transformant ce dernier en une étoile à neutrons. Il s'agit d'une étoile à neutrons entourée de plasma stellaire ordinaire."
 fusion_suppressor_6:0 "Effondrer l'étoile en Trou Noir"
 fusion_suppressor_6_DESC:0 "La matière de l'étoile s'est maintenant effondrée à un tel point que même la lumière ne peut plus échapper à son attraction gravitationnelle, la transformant en un Trou Noir artificiel avec un potentiel de recherche incroyable."
 fusion_suppressor_6b:0 "Détoner l'Étoile"
 fusion_suppressor_6b_DESC:0 "Ordonner au $name_fusion_suppressor$ de libérer le champ gravitationnel et d'exercer une force répulsive, provoquant l'explosion de l'étoile comprimée en une supernova dévastatrice, détruisant le $name_fusion_suppressor$. Toute planète de taille inférieure à 5, ainsi que les astéroïdes, seront détruits, et les géantes gazeuses perdront leur atmosphère. Les planètes survivantes recevront des dépôts d'Iodizium, des cristaux générés par la supernova artificielle percutant les planètes à des vitesses relativistes. Ces cristaux peuvent être utilisés pour construire des bâtiments puissants sur nos planètes."
 fusion_suppressor_7:0 "Démanteler le $name_fusion_suppressor$"
 fusion_suppressor_7_DESC:0 "Démonter ce $name_fusion_suppressor$, rendant son Trou Noir utilisable pour d'autres projets."
 penrose_sphere_0:0 "$gc_mega$$name_penrose$ Site de construction"
 penrose_sphere_0_DESC:0 "Cette plateforme abrite le personnel et les infrastructures nécessaires à la construction d'une $name_penrose$ autour d'un Trou Noir."
 penrose_sphere_0_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ £megaupgrade£ $giga_list_category_megastructure$ - $giga_list_category_basic_resource_production$ - $giga_list_category_weaponry$\nPeut générer £energy£ §YÉnergie§! ou devenir une §YBombe§!. Peut être améliorée en une §YRingworld Penrose§!\n§LUne sphère de miroirs autour d'un Trou Noir, exploitant la diffusion superradiante pour générer de l'énergie à des fins lucratives ou destructrices.§!"
 penrose_sphere_1:0 "$name_penrose$ Structure"
 penrose_sphere_1_DESC:0 "Cette structure squelettique supportera d'immenses miroirs capables de réfléchir la lumière à travers l'ergosphère du Trou Noir, générant d'énormes quantités d'énergie."
 penrose_sphere_a2:0 "Bombe de Distorsion Subspatiale Désarmée"
 penrose_sphere_a2_DESC:0 "Ce $name_penrose$ a été converti en bombe. Nous devons maintenant laisser l'énergie s'accumuler avant de la faire exploser."
 penrose_sphere_a3:0 "Bombe de Distorsion Subspatiale"
 penrose_sphere_a3_DESC:0 "Une grande structure en forme de miroir construite autour d'un Trou Noir, capable de réfléchir les radiations entre sa surface interne et l'ergosphère du Trou Noir, provoquant une diffusion superradiante et amplifiant exponentiellement l'énergie des radiations."
 penrose_sphere_a4:0 "Détoner !"
 penrose_sphere_a4_DESC:0 "Envoyez juste assez de radiations pour dépasser la limite d'intégrité du miroir et libérer le flot d'énergie !"
 penrose_sphere_a41:0 "Bombe de Distorsion Subspatiale"
 penrose_sphere_a41_DESC:0 "Cette Bombe de Distorsion Subspatiale est sur le point d'exploser !"
 penrose_sphere_a41_MEGASTRUCTURE_DETAILS:0 "$penrose_sphere_a41_DESC$"
 penrose_sphere_a42:0 "Bombe de Distorsion Subspatiale"
 penrose_sphere_a42_DESC:0 "Cette Bombe de Distorsion Subspatiale est sur le point d'exploser !"
 penrose_sphere_a42_MEGASTRUCTURE_DETAILS:0 "$penrose_sphere_a42_DESC$"
 penrose_sphere_b2:0 "$name_penrose$"
 penrose_sphere_b2_DESC:0 "Un grand miroir construit autour d'un Trou Noir. Les radiations rebondissent entre la surface interne du miroir et l'ergosphère du Trou Noir, générant de l'énergie."
 penrose_sphere_b3:0 "$name_penrose$ Stabilisé"
 penrose_sphere_b3_DESC:0 "Ce $name_penrose$ a été stabilisé avec des constructions spécialisées, permettant de contenir davantage de radiations dans la sphère miroir sans risquer d'explosion. Il génère ainsi plus d'énergie."
 penrose_sphere_b4:0 "Anneau-Monde $name_penrose$"
 penrose_sphere_b4_DESC:0 "Une partie de la production énergétique de ce $name_penrose$ a été détournée pour soutenir une immense et avancée ringworld construite autour de lui."
 gigablackhole_ring_world_2:0 "$name_penrose_ring$ Structure"
 gigablackhole_ring_world_2_DESC:0 "Cette structure squelettique constitue environ la moitié de la circonférence complète de la Ringworld. Nous devons maintenant commencer à travailler sur les habitats réels."
 gigablackhole_ring_world_2_MEGASTRUCTURE_DETAILS:0 "$gigablackhole_ring_world_2_DESC$"
 gigablackhole_ring_world_3:0 "Segment $name_penrose_ring$"
 gigablackhole_ring_world_3_DESC:0 "Un segment massif d'une Ringworld, composé de deux sections habitables et d'une section de support, alimenté par un $name_penrose$."
